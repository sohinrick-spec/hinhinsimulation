<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 幾何特異性酶催化模擬器</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-global: #f4f6f9;
            --bg-panel: #ffffff;
            --bg-canvas: #0b111e;
            --text-primary: #1a2332;
            --text-secondary: #4a5a70;
            --text-muted: #8a9ab0;
            --border-color: #d4dbe6;
            --accent-primary: #1976d2;
            --accent-rose: #c62828;
            --accent-green: #2e7d32;
            --accent-amber: #e65100;
            --accent-violet: #5e35b1;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            letter-spacing: -0.01em;
        }

        .mono-metric {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 700;
        }

        .mono-text {
            font-family: 'IBM Plex Mono', monospace;
        }

        canvas {
            background-color: var(--bg-canvas);
            border: 1px solid var(--text-primary);
            border-radius: 4px;
        }

        /* Scientific Instrument Range Slider Customization */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-canvas-runnable-track,
        input[type="range"]::-webkit-slider-runnable-track {
            background: #e2e8f0;
            height: 3px;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -5px;
            background-color: var(--accent-primary);
            height: 13px;
            width: 13px;
            border-radius: 50%;
            border: 1px solid #ffffff;
            transition: transform 0.1s ease;
        }

        input[type="range"]:hover::-webkit-slider-thumb {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-track {
            background: #e2e8f0;
            height: 3px;
            border-radius: 2px;
        }

        input[type="range"]::-moz-range-thumb {
            background-color: var(--accent-primary);
            height: 13px;
            width: 13px;
            border-radius: 50%;
            border: 1px solid #ffffff;
            transition: transform 0.1s ease;
        }

        input[type="range"]:hover::-moz-range-thumb {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="min-h-screen antialiased">

    <header class="border-b border-gray-300 bg-white p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-lg font-bold text-gray-900 flex items-center gap-2 tracking-tight">
                    🧬 酶催化幾何特異性虛擬實驗室
                </h1>
                <p class="text-xs text-gray-500 mt-0.5">動態幾何模型 · 鎖鑰咬合與反應狀態觀測</p>
            </div>
            <div class="flex flex-wrap gap-3">
                <select id="reaction-mode" onchange="resetSimulation()" class="bg-white border border-gray-300 text-gray-800 rounded-sm px-3 py-1.5 text-xs font-medium focus:outline-none focus:border-blue-600">
                    <option value="decomposition">✂️ 分解反應模式 (Decomposition)</option>
                    <option value="synthesis">🧲 合成反應模式 (Synthesis)</option>
                </select>
                <button onclick="resetSimulation()" class="bg-red-700 hover:bg-red-800 text-white font-medium py-1.5 px-4 rounded-sm transition text-xs tracking-wide">
                    🔄 重置實驗
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
        
        <div class="lg:col-span-2 flex flex-col gap-4">
            
            <div class="relative bg-white p-4 rounded-sm border border-gray-300">
                
                <div id="dynamic-legend" class="bg-gray-50 text-[11px] font-medium text-gray-600 p-2.5 rounded-sm border border-gray-200 flex flex-wrap gap-5 mb-3 justify-center items-center">
                    </div>
                
                <div class="w-full flex justify-center">
                    <canvas id="simCanvas" width="750" height="460" class="w-full max-w-full h-auto"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div class="bg-white p-3 rounded-sm border border-gray-300">
                    <p class="text-[10px] uppercase font-bold tracking-wider text-gray-400">游離受質總數</p>
                    <p id="stat-substrate" class="text-2xl mono-metric text-purple-700 mt-1">0</p>
                </div>
                <div class="bg-white p-3 rounded-sm border border-gray-300">
                    <p class="text-[10px] uppercase font-bold tracking-wider text-gray-400">已催化生成產物</p>
                    <p id="stat-product" class="text-2xl mono-metric text-green-700 mt-1">0</p>
                </div>
                <div class="bg-white p-3 rounded-sm border border-gray-300">
                    <p class="text-[10px] uppercase font-bold tracking-wider text-gray-400">實驗累計耗時</p>
                    <p id="stat-timer" class="text-2xl mono-metric text-blue-700 mt-1">0.0 <span class="text-xs font-normal text-gray-400">s</span></p>
                </div>
            </div>
        </div>

        <div class="bg-white p-5 rounded-sm border border-gray-300 flex flex-col gap-5">
            <div>
                <h3 class="text-sm font-bold uppercase tracking-wider text-gray-900">🎛️ 變數控制台</h3>
                <p class="text-xs text-gray-500 mt-0.5">即時調整物理與環境參數</p>
            </div>

            <hr class="border-gray-200">

            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between text-xs">
                    <label class="text-gray-700 font-medium">1. 酶的數量 (六角形 ⬢)</label>
                    <span id="val-enzyme" class="mono-text text-blue-700 font-bold">12</span>
                </div>
                <input type="range" id="slide-enzyme" min="4" max="25" value="12" class="w-full py-1">
            </div>

            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between text-xs">
                    <label id="lbl-substrate" class="text-gray-700 font-medium">2. 受質初始數量</label>
                    <span id="val-substrate" class="mono-text text-purple-700 font-bold">35</span>
                </div>
                <input type="range" id="slide-substrate" min="10" max="80" value="35" class="w-full py-1">
            </div>

            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between text-xs">
                    <label class="text-gray-700 font-medium">3. 環境溫度 (碰撞速率)</label>
                    <span id="val-temp" class="mono-text text-orange-700 font-bold">37 °C</span>
                </div>
                <input type="range" id="slide-temp" min="5" max="75" value="37" class="w-full py-1">
                <div class="flex justify-between text-[10px] text-gray-400 font-medium">
                    <span>5°C (低動能)</span>
                    <span class="text-orange-700 font-semibold">37°C 最適</span>
                    <span>75°C (變性失活)</span>
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between text-xs">
                    <label class="text-gray-700 font-medium">4. 溶液酸鹼度 (催化效率)</label>
                    <span id="val-ph" class="mono-text text-green-700 font-bold">7.0</span>
                </div>
                <input type="range" id="slide-ph" min="2" max="12" step="0.5" value="7.0" class="w-full py-1">
            </div>

            <div id="enzyme-status-box" class="mt-2 p-3 bg-gray-50 border border-gray-200 rounded-sm text-xs flex items-center gap-2.5">
                <span id="status-indicator" class="w-2.5 h-2.5 rounded-full bg-green-600 flex-shrink-0"></span>
                <span id="status-text" class="text-gray-600 font-medium">酶結構：活性正常。</span>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let enzymes = [];
        let substrates = []; 
        let products = [];

        let productsCount = 0;
        let startTime = Date.now();
        let activeReaction = 'decomposition';
        let globalDenatured = false;

        // 幾何尺寸常數
        const R_ENZYME = 20;
        const R_SUB_BIG = 10;
        const R_SUB_SMALL = 6;

        // --- 核心幾何繪圖輔助器 ---
        function drawHexagonPath(c, x, y, r) {
            c.beginPath();
            for (let i = 0; i < 6; i++) {
                let angle = (Math.PI / 3) * i;
                c.lineTo(x + r * Math.cos(angle), y + r * Math.sin(angle));
            }
            c.closePath();
        }

        class Enzyme {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.status = 'free'; // 'free', 'has_A', 'has_B', 'complex'
                this.timer = 0;
                this.boundTarget = null;
                this.boundA = null;
                this.boundB = null;
            }

            update(speedFactor, lockTime) {
                this.x += this.vx * speedFactor;
                this.y += this.vy * speedFactor;
                this.bounceWalls();

                if (globalDenatured) {
                    this.status = 'free';
                    this.timer = 0;
                    if(this.boundTarget) { this.boundTarget.isBound = false; this.boundTarget = null; }
                    if(this.boundA) { this.boundA.isBound = false; this.boundA = null; }
                    if(this.boundB) { this.boundB.isBound = false; this.boundB = null; }
                    return;
                }

                if (this.status === 'complex') {
                    this.timer += 1;
                    if (this.timer >= lockTime) {
                        this.catalyze();
                    }
                }
            }

            bounceWalls() {
                if (this.x - R_ENZYME < 0) { this.x = R_ENZYME; this.vx *= -1; }
                if (this.x + R_ENZYME > canvas.width) { this.x = canvas.width - R_ENZYME; this.vx *= -1; }
                if (this.y - R_ENZYME < 0) { this.y = R_ENZYME; this.vy *= -1; }
                if (this.y + R_ENZYME > canvas.height) { this.y = canvas.height - R_ENZYME; this.vy *= -1; }
            }

            catalyze() {
                if (activeReaction === 'decomposition') {
                    if (this.boundTarget) {
                        substrates = substrates.filter(s => s !== this.boundTarget);
                        // 切開：分化成一個紅色三角形與一個橘色圓形產物
                        products.push(new Product(this.x, this.y, Math.random()*2-1, Math.random()*2-1, 'A'));
                        products.push(new Product(this.x, this.y, Math.random()*2-1, Math.random()*2-1, 'B'));
                        productsCount++;
                    }
                } else {
                    if (this.boundA && this.boundB) {
                        substrates = substrates.filter(s => s !== this.boundA && s !== this.boundB);
                        // 合成：集結成一個大型粉紅菱形大產物
                        products.push(new Product(this.x, this.y, Math.random()*2-1, Math.random()*2-1, 'AB'));
                        productsCount++;
                    }
                }
                this.status = 'free';
                this.timer = 0;
                this.boundTarget = null;
                this.boundA = null;
                this.boundB = null;
            }

            draw() {
                // 1. 繪製酶本體六角形
                drawHexagonPath(ctx, this.x, this.y, R_ENZYME);
                
                if (globalDenatured) {
                    ctx.fillStyle = '#64748b'; // 灰色失活
                } else if (this.status === 'complex') {
                    ctx.fillStyle = '#0d9488'; // 結合活化狀態亮青色
                } else if (this.status === 'has_A' || this.status === 'has_B') {
                    ctx.fillStyle = '#4f46e5'; // 部分捕獲狀態靛藍色
                } else {
                    ctx.fillStyle = '#2563eb'; // 游離態標準藍色
                }
                ctx.fill();
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 2. 核心視覺亮點：當處於複合物 (ES) 狀態時，將受質形狀精密鎖定在六角形中心！
                if (!globalDenatured && this.status === 'complex') {
                    ctx.save();
                    ctx.globalAlpha = 0.85;
                    if (activeReaction === 'decomposition') {
                        // 分解中：大紫色橢圓卡在中間
                        ctx.fillStyle = '#a855f7';
                        ctx.beginPath();
                        ctx.ellipse(this.x, this.y, 11, 6, 0, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // 合成中：綠三角與黃方塊緊密咬合在中間
                        ctx.fillStyle = '#22c55e';
                        ctx.beginPath();
                        ctx.moveTo(this.x - 5, this.y - 5);
                        ctx.lineTo(this.x, this.y + 4);
                        ctx.lineTo(this.x - 10, this.y + 4);
                        ctx.closePath();
                        ctx.fill();

                        ctx.fillStyle = '#eab308';
                        ctx.fillRect(this.x + 2, this.y - 4, 7, 7);
                    }
                    ctx.restore();
                } else if (!globalDenatured && this.status === 'has_A') {
                    // 已單獨捕獲 A 三角
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - 5);
                    ctx.lineTo(this.x + 5, this.y + 5);
                    ctx.lineTo(this.x - 5, this.y + 5);
                    ctx.closePath();
                    ctx.fill();
                } else if (!globalDenatured && this.status === 'has_B') {
                    // 已單獨捕獲 B 方塊
                    ctx.fillStyle = '#eab308';
                    ctx.fillRect(this.x - 4, this.y - 4, 8, 8);
                }
            }
        }

        class Substrate {
            constructor(x, y, vx, vy, type) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.type = type; // 'S', 'A', 'B'
                this.isBound = false;
            }

            update(speedFactor) {
                if (!this.isBound) {
                    this.x += this.vx * speedFactor;
                    this.y += this.vy * speedFactor;
                    
                    let r = (this.type === 'S') ? R_SUB_BIG : R_SUB_SMALL;
                    if (this.x - r < 0) { this.x = r; this.vx *= -1; }
                    if (this.x + r > canvas.width) { this.x = canvas.width - r; this.vx *= -1; }
                    if (this.y - r < 0) { this.y = r; this.vy *= -1; }
                    if (this.y + r > canvas.height) { this.y = canvas.height - r; this.vy *= -1; }
                }
            }

            draw() {
                if (this.isBound) return; // 結合後隱藏，交由 Enzyme 類別內部繪製

                ctx.beginPath();
                if (this.type === 'S') {
                    // 分解受質：大紫色藥丸膠囊形
                    ctx.fillStyle = '#c084fc';
                    ctx.ellipse(this.x, this.y, 14, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'A') {
                    // 合成受質 A：明亮綠色正三角形
                    ctx.fillStyle = '#4ade80';
                    ctx.moveTo(this.x, this.y - R_SUB_SMALL - 3);
                    ctx.lineTo(this.x + R_SUB_SMALL + 3, this.y + R_SUB_SMALL + 1);
                    ctx.lineTo(this.x - R_SUB_SMALL - 3, this.y + R_SUB_SMALL + 1);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === 'B') {
                    // 合成受質 B：黃色正方形
                    ctx.fillStyle = '#facc15';
                    ctx.fillRect(this.x - R_SUB_SMALL, this.y - R_SUB_SMALL, R_SUB_SMALL * 2, R_SUB_SMALL * 2);
                }
            }
        }

        class Product {
            constructor(x, y, vx, vy, type) {
                this.x = x;
                this.y = y;
                this.vx = vx || (Math.random() - 0.5) * 2;
                this.vy = vy || (Math.random() - 0.5) * 2;
                this.type = type; // 'A', 'B', 'AB'
            }

            update(speedFactor) {
                this.x += this.vx * speedFactor;
                this.y += this.vy * speedFactor;

                let r = (this.type === 'AB') ? R_SUB_BIG : R_SUB_SMALL;
                if (this.x - r < 0) { this.x = r; this.vx *= -1; }
                if (this.x + r > canvas.width) { this.x = canvas.width - r; this.vx *= -1; }
                if (this.y - r < 0) { this.y = r; this.vy *= -1; }
                if (this.y + r > canvas.height) { this.y = canvas.height - r; this.vy *= -1; }
            }

            draw() {
                ctx.beginPath();
                if (this.type === 'A') {
                    // 分解產物 A：紅色小三角形
                    ctx.fillStyle = '#f87171';
                    ctx.moveTo(this.x, this.y - R_SUB_SMALL - 1);
                    ctx.lineTo(this.x + R_SUB_SMALL + 1, this.y + R_SUB_SMALL);
                    ctx.lineTo(this.x - R_SUB_SMALL - 1, this.y + R_SUB_SMALL);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === 'B') {
                    // 分解產物 B：橘色小圓形
                    ctx.fillStyle = '#fb923c';
                    ctx.arc(this.x, this.y, R_SUB_SMALL, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'AB') {
                    // 合成大產物：粉紅色菱形
                    ctx.fillStyle = '#f472b6';
                    ctx.moveTo(this.x, this.y - R_SUB_BIG - 2);
                    ctx.lineTo(this.x + R_SUB_BIG + 2, this.y);
                    ctx.lineTo(this.x, this.y + R_SUB_BIG + 2);
                    ctx.lineTo(this.x - R_SUB_BIG - 2, this.y);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }

        // --- 重置與動態建構圖例 ---
        function resetSimulation() {
            enzymes = []; substrates = []; products = [];
            productsCount = 0;
            startTime = Date.now();

            activeReaction = document.getElementById('reaction-mode').value;
            const countEnzyme = parseInt(document.getElementById('slide-enzyme').value);
            const countSubstrate = parseInt(document.getElementById('slide-substrate').value);

            // 1. 動態更新專屬幾何圖例（徹底解決舊版無法對應與無法正常顯示的問題）
            const legendDiv = document.getElementById('dynamic-legend');
            if (activeReaction === 'decomposition') {
                document.getElementById('lbl-substrate').innerText = "2. 大分子受質數量 (橢圓 💊)";
                legendDiv.innerHTML = `
                    <span class="flex items-center gap-1.5"><svg class="w-4 h-4 text-blue-600" viewBox="0 0 20 20" fill="currentColor"><polygon points="10,2 18,6 18,14 10,18 2,14 2,6"/></svg> 游離酶 (藍六角形)</span>
                    <span class="flex items-center gap-1.5"><svg class="w-5 h-3 text-purple-400" viewBox="0 0 20 10" fill="currentColor"><ellipse cx="10" cy="5" rx="8" ry="4"/></svg> 受質 (紫色大橢圓)</span>
                    <span class="flex items-center gap-1.5"><svg class="w-4 h-4 text-teal-600" viewBox="0 0 20 20" fill="currentColor"><polygon points="10,2 18,6 18,14 10,18 2,14 2,6"/><ellipse cx="10" cy="10" rx="5" ry="2.5" fill="#a855f7"/></svg> ES複合物 (鎖定催化中)</span>
                    <span class="flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-red-400 inline mr-0.5" viewBox="0 0 10 10" fill="currentColor"><polygon points="5,1 10,9 0,9"/></svg>
                        <svg class="w-3 h-3 text-orange-400 inline" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="4"/></svg> 
                        分解產物 (紅三角+橘圓)
                    </span>
                `;
            } else {
                document.getElementById('lbl-substrate').innerText = "2. 受質組數 (A三角▲ + B方塊■)";
                legendDiv.innerHTML = `
                    <span class="flex items-center gap-1.5"><svg class="w-4 h-4 text-blue-600" viewBox="0 0 20 20" fill="currentColor"><polygon points="10,2 18,6 18,14 10,18 2,14 2,6"/></svg> 游離酶 (藍六角形)</span>
                    <span class="flex items-center gap-1.5"><svg class="w-3 h-3 text-green-400" viewBox="0 0 10 10" fill="currentColor"><polygon points="5,1 10,9 0,9"/></svg> 受質 A (綠三角)</span>
                    <span class="flex items-center gap-1.5"><svg class="w-3 h-3 text-yellow-400" viewBox="0 0 10 10" fill="currentColor"><rect width="8" height="8" x="1" y="1"/></svg> 受質 B (黃方塊)</span>
                    <span class="flex items-center gap-1.5"><svg class="w-4 h-4 text-indigo-600" viewBox="0 0 20 20" fill="currentColor"><polygon points="10,2 18,6 18,14 10,18 2,14 2,6"/><circle cx="10" cy="10" r="3.5" fill="#6366f1"/></svg> ES複合物 (雙分子捕捉中)</span>
                    <span class="flex items-center gap-1.5"><svg class="w-4 h-4 text-pink-400" viewBox="0 0 10 10" fill="currentColor"><polygon points="5,0 10,5 5,10 0,5"/></svg> 合成產物 (粉紅菱形)</span>
                `;
            }

            // 2. 生成酶
            for (let i = 0; i < countEnzyme; i++) {
                enzymes.push(new Enzyme(
                    Math.random() * (canvas.width - 50) + 25,
                    Math.random() * (canvas.height - 50) + 25,
                    (Math.random() - 0.5) * 2.5,
                    (Math.random() - 0.5) * 2.5
                ));
            }

            // 3. 生成受質
            if (activeReaction === 'decomposition') {
                for (let i = 0; i < countSubstrate; i++) {
                    substrates.push(new Substrate(
                        Math.random() * (canvas.width - 30) + 15,
                        Math.random() * (canvas.height - 30) + 15,
                        (Math.random() - 0.5) * 3.5,
                        (Math.random() - 0.5) * 3.5,
                        'S'
                    ));
                }
            } else {
                for (let i = 0; i < countSubstrate; i++) {
                    substrates.push(new Substrate(
                        Math.random() * (canvas.width - 30) + 15,
                        Math.random() * (canvas.height - 30) + 15,
                        (Math.random() - 0.5) * 3.5,
                        (Math.random() - 0.5) * 3.5,
                        'A'
                    ));
                    substrates.push(new Substrate(
                        Math.random() * (canvas.width - 30) + 15,
                        Math.random() * (canvas.height - 30) + 15,
                        (Math.random() - 0.5) * 3.5,
                        (Math.random() - 0.5) * 3.5,
                        'B'
                    ));
                }
            }

            updateUIValues();
        }

        // --- 平面精密特異性幾何碰撞檢測 ---
        function handleCollisions() {
            for (let e of enzymes) {
                if (e.status === 'complex') continue; 

                for (let s of substrates) {
                    if (s.isBound) continue;

                    let dx = e.x - s.x;
                    let dy = e.y - s.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    let triggerRange = R_ENZYME + ((s.type === 'S') ? R_SUB_BIG : R_SUB_SMALL);

                    if (dist < triggerRange) {
                        if (activeReaction === 'decomposition' && s.type === 'S') {
                            e.status = 'complex';
                            e.boundTarget = s;
                            s.isBound = true;
                            e.timer = 0;
                            break; 
                        } 
                        else if (activeReaction === 'synthesis') {
                            if (e.status === 'free') {
                                if (s.type === 'A') { e.status = 'has_A'; e.boundA = s; s.isBound = true; }
                                else if (s.type === 'B') { e.status = 'has_B'; e.boundB = s; s.isBound = true; }
                            } else if (e.status === 'has_A' && s.type === 'B') {
                                e.status = 'complex';
                                e.boundB = s;
                                s.isBound = true;
                                e.timer = 0;
                                break;
                            } else if (e.status === 'has_B' && s.type === 'A') {
                                e.status = 'complex';
                                e.boundA = s;
                                s.isBound = true;
                                e.timer = 0;
                                break;
                            }
                        }
                    }
                }
            }
        }

        // --- 主循環動畫引擎 ---
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const temp = parseFloat(document.getElementById('slide-temp').value);
            const ph = parseFloat(document.getElementById('slide-ph').value);

            // 結構狀態即時解算
            globalDenatured = (temp > 55 || ph < 4.0 || ph > 10.0);
            let phErr = Math.abs(ph - 7.0);
            let lockTime = Math.round(35 + (phErr * 30)); // pH 偏離會使催化鎖定反應時間變長
            let speedFactor = (temp / 37) * 1.3;

            // 更新控制台狀態文字
            const indicator = document.getElementById('status-indicator');
            const statusTxt = document.getElementById('status-text');
            if (globalDenatured) {
                indicator.className = "w-2.5 h-2.5 rounded-full bg-red-600 flex-shrink-0";
                statusTxt.innerText = "❌ 警告：極端環境下酶結構完全變性，催化活性歸零！";
                speedFactor = temp > 55 ? speedFactor * 1.2 : speedFactor * 0.4;
            } else if (phErr > 1.5 || temp > 45) {
                indicator.className = "w-2.5 h-2.5 rounded-full bg-orange-600 flex-shrink-0";
                statusTxt.innerText = "⚠️ 提示：當前 pH 或溫度偏離最佳值，催化速率減緩。";
            } else {
                indicator.className = "w-2.5 h-2.5 rounded-full bg-green-600 flex-shrink-0";
                statusTxt.innerText = "酶結構：空間構象極佳，活性高度穩定。";
            }

            if (!globalDenatured) {
                handleCollisions();
            }

            // 更新與繪製所有分子組件
            enzymes.forEach(e => { e.update(speedFactor, lockTime); e.draw(); });
            substrates.forEach(s => { s.update(speedFactor); s.draw(); });
            products.forEach(p => { p.update(speedFactor); p.draw(); });

            // 累計計時統計
            if (substrates.filter(s => !s.isBound).length > 0) {
                let currentSec = (Date.now() - startTime) / 1000;
                document.getElementById('stat-timer').innerHTML = `${currentSec.toFixed(1)} <span class="text-xs font-normal text-gray-400">s</span>`;
            }
            document.getElementById('stat-substrate').innerText = substrates.filter(s => !s.isBound).length;
            document.getElementById('stat-product').innerText = productsCount;
        }

        // --- 滑塊同步控制機制 ---
        function syncParams() {
            const ids = ['enzyme', 'substrate', 'temp', 'ph'];
            ids.forEach(id => {
                document.getElementById(`slide-${id}`).addEventListener('input', () => {
                    updateUIValues();
                    if(id === 'enzyme' || id === 'substrate') {
                        resetSimulation();
                    }
                });
            });
        }

        function updateUIValues() {
            document.getElementById('val-enzyme').innerText = document.getElementById('slide-enzyme').value;
            document.getElementById('val-substrate').innerText = document.getElementById('slide-substrate').value;
            document.getElementById('val-temp').innerText = document.getElementById('slide-temp').value + ' °C';
            document.getElementById('val-ph').innerText = parseFloat(document.getElementById('slide-ph').value).toFixed(1);
        }

        window.onload = () => {
            syncParams();
            resetSimulation();
            animate();
        };
    </script>
</body>
</html>
