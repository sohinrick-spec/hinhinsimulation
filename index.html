<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的模擬作品集</title>
    <style>
        /* 基礎樣式設定 */
        :root {
            --primary-color: #24292e; /* GitHub 風格深灰 */
            --accent-color: #0366d6;  /* 藍色高亮 */
            --bg-color: #f6f8fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 2.2rem;
            text-align: center;
        }

        .subtitle {
            color: #586069;
            margin-bottom: 40px;
            font-size: 1.1rem;
            text-align: center;
        }

        /* 網格佈局：自動根據螢幕寬度排列卡片 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }

        /* 卡片樣式 */
        .card {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* 滑鼠移上去的放大與陰影效果 */
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
            border-color: var(--accent-color);
        }

        /* 縮略圖外殼（固定比例 16:9） */
        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #eaecef;
            overflow: hidden;
        }

        /* 縮略圖圖片樣式 */
        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 讓圖片填滿不變形 */
            transition: transform 0.5s ease;
        }

        .card:hover .thumbnail-wrapper img {
            transform: scale(1.05); /* 懸停時圖片微微放大 */
        }

        /* 卡片文字區域 */
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0 0 8px 0;
        }

        .card:hover .card-title {
            color: var(--accent-color);
        }

        .card-desc {
            font-size: 0.9rem;
            color: #6a737d;
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>模擬網頁展示菜單</h1>
    <p class="subtitle">點擊下方卡片即可進入相對應的網頁</p>
    
    <div class="grid-container">
        

        <!-- https://sohinrick-spec.github.io/hinhinsimulation>

        <!-- 項目 1 -->
        <a href="page1.html" class="card">
            <div class="thumbnail-wrapper">
                <!-- 這裡使用免費自動截圖 API，填入你這個網頁在 GitHub Pages 的完整網址（記得把 page1.html 換成你實際的網頁名字） -->
                <img src="https://public-api.wordpress.com/rest/v1.1/mshots/v1/https%3A%2F%2Fsohinrick-spec.github.io%2Fhinhinsimulation%2Fpage1.html?w=600" alt="網頁預覽" loading="lazy">
            </div>
            <div class="card-content">
                <div class="card-title">模擬項目一：網頁名稱</div>
                <div class="card-desc">這裡可以寫一段關於這個網頁的簡短描述或功能介紹。</div>
            </div>
        </a>

        <!-- 項目 2 -->
        <a href="page2.html" class="card">
            <div class="thumbnail-wrapper">
                <img src="https://public-api.wordpress.com/rest/v1.1/mshots/v1/https%3A%2F%2Fsohinrick-spec.github.io%2Fhinhinsimulation%2Fpage2.html?w=600" alt="網頁預覽" loading="lazy">
            </div>
            <div class="card-content">
                <div class="card-title">模擬項目二：網頁名稱</div>
                <div class="card-desc">在這裡輸入第二個網頁的介紹，吸引使用者點擊。</div>
            </div>
        </a>

        <!-- 如果有更多網頁，只要複製上面的 <a> ... </a> 區塊並修改 href 和 img src 即可 -->

    </div>

</body>
</html>
