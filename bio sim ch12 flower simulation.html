<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花的3D結構模擬器 — HinHin Biology</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg: #f4f6f9;               /* Global App Background: Light ice-blue/gray */
  --panel: #ffffff;            /* Main Panels/Cards Background: Pure White */
  --border: #d4dbe6;           /* Crisp, thin 1px borders */
  --text-primary: #1a2332;     /* Primary text: Deep Navy */
  --text-secondary: #4a5a70;   /* Secondary text: Slate Blue */
  --text-muted: #8a9ab0;       /* Dim/Muted labels: Gray */
  
  /* Semantic Accent Colors */
  --accent-cyan: #1976d2;      /* Primary Cyan for general active states */
  --accent-danger: #c62828;    /* Danger/Reset Rose for errors */
  --accent-success: #2e7d32;   /* Success/Energy Green */
  --accent-warning: #e65100;   /* Warning Amber for secondary toggles */
  --accent-violet: #5e35b1;    /* Special Violet for specific tools */
}

* { margin:0; padding:0; box-sizing:border-box; }

body { 
  background: var(--bg); 
  color: var(--text-primary); 
  font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; 
  overflow: hidden; 
  height: 100vh; 
  width: 100vw; 
}

/* 3D Viewport Monitor Frame */
#c { display:block; position:absolute; inset:0; z-index:1; }
#labels { position:absolute; inset:0; pointer-events:none; z-index:5; }

/* Technical Boot / Loading Screen */
#loading {
  position: absolute; inset:0; z-index:100; display:flex; flex-direction:column;
  align-items: center; justify-content:center; background:var(--bg); transition: opacity .5s;
}
#loading .flower { font-size:3rem; animation: spin 2s linear infinite; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.04)); }
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { 
  color: var(--text-secondary); 
  font-family: 'IBM Plex Mono', monospace; 
  font-size: .8rem; 
  font-weight: 600;
  margin-top: 16px; 
  letter-spacing: .15em; 
  text-transform: uppercase;
}
#loading.hidden { opacity:0; pointer-events:none; }

/* Laboratory Instrument Top Header Bar */
#topbar {
  position: absolute; top:0; left:0; right:0; z-index:20;
  padding: 16px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  pointer-events: none;
}
#topbar h1 { 
  font-family: 'IBM Plex Sans', sans-serif; 
  font-weight: 700;
  font-size: 1.15rem; 
  color: var(--text-primary); 
  letter-spacing: -0.01em; 
}
#topbar p { 
  font-family: 'IBM Plex Mono', monospace; 
  font-size: .62rem; 
  font-weight: 600;
  color: var(--text-muted); 
  letter-spacing: .15em; 
  margin-top: 4px; 
}

/* Precision Control Panel Frame */
#panel {
  position: absolute; top:84px; right:20px; width:230px; z-index:20;
  background: var(--panel); border:1px solid var(--border); border-radius:4px;
  padding: 16px; box-shadow: none;
}
#panel h3 { 
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: .68rem; font-weight: 700; letter-spacing: .1em; 
  color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; 
  border-bottom: 1px solid var(--border); padding-bottom: 6px;
}

/* Dense Dashboard Buttons */
.lbtn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px;
  margin-bottom: 6px; background: #f8fafd; border: 1px solid var(--border);
  border-radius: 4px; color: var(--text-primary); font-family: 'IBM Plex Sans', sans-serif; 
  font-size: .78rem; font-weight: 500; cursor: pointer; transition: all .15s ease; 
  text-align: left; pointer-events: all;
}
.lbtn:hover { background: #f0f4f8; border-color: #b8c6d8; }
.lbtn.on { border-color: var(--accent-cyan); background: rgba(25, 118, 210, 0.05); color: var(--accent-cyan); font-weight: 600; }

/* High Precision Micro-Square Indicators */
.dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

.sep { height: 1px; background: var(--border); margin: 12px 0; }
.clabel { 
  font-family: 'IBM Plex Mono', monospace; 
  font-size: .65rem; font-weight: 600; color: var(--text-muted); 
  letter-spacing: .05em; display: block; margin-bottom: 8px; text-transform: uppercase;
}

/* Micro Gauge / Range Sliders */
input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 6px 0; font-family: 'IBM Plex Mono', monospace; }
input[type=range]:focus { outline: none; }
input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 3px; cursor: pointer; background: var(--border); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { height: 11px; width: 11px; border-radius: 50%; background: var(--accent-cyan); cursor: pointer; -webkit-appearance: none; margin-top: -4px; transition: transform 0.1s ease; }
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type=range]::-moz-range-track { width: 100%; height: 3px; cursor: pointer; background: var(--border); border-radius: 2px; }
input[type=range]::-moz-range-thumb { height: 11px; width: 11px; border: none; border-radius: 50%; background: var(--accent-cyan); cursor: pointer; transition: transform 0.1s ease; }
input[type=range]::-moz-range-thumb:hover { transform: scale(1.2); }

/* Grid Instrumentation Selectors */
.vrow { display: flex; gap: 6px; margin-top: 8px; }
.vbtn {
  flex: 1; padding: 6px 0; background: #f8fafd; border: 1px solid var(--border);
  border-radius: 4px; color: var(--text-secondary); font-family: 'IBM Plex Sans', sans-serif; font-size: .72rem;
  font-weight: 500; cursor: pointer; transition: all .15s ease; pointer-events: all; text-align: center; line-height: 1.3;
}
.vbtn small { font-family: 'IBM Plex Mono', monospace; font-size: .58rem; color: var(--text-muted); display: block; margin-top: 1px; }
.vbtn:hover { background: #f0f4f8; color: var(--text-primary); }
.vbtn.on { background: rgba(25, 118, 210, 0.08); color: var(--accent-cyan); border-color: var(--accent-cyan); font-weight: 600; }
.vbtn.on small { color: var(--accent-cyan); }

/* Secondary Tool Actuators */
#xbtn {
  width: 100%; padding: 10px; background: #ffffff; border: 1px solid var(--border);
  border-radius: 4px; color: var(--text-primary); font-family: 'IBM Plex Sans', sans-serif; font-size: .75rem;
  font-weight: 600; cursor: pointer; margin-top: 2px; pointer-events: all; transition: all .15s ease;
}
#xbtn:hover { background: rgba(94, 53, 177, 0.04); border-color: var(--accent-violet); color: var(--accent-violet); }

#cbtn {
  width: 100%; padding: 10px; background: #ffffff; border: 1px solid var(--border);
  border-radius: 4px; color: var(--text-primary); font-family: 'IBM Plex Sans', sans-serif; font-size: .75rem;
  font-weight: 600; cursor: pointer; margin-top: 6px; pointer-events: all; transition: all .15s ease;
}
#cbtn:hover { background: rgba(230, 81, 0, 0.04); border-color: var(--accent-warning); color: var(--accent-warning); }
#cbtn.on { border-color: var(--accent-warning); background: rgba(230, 81, 0, 0.08); color: var(--accent-warning); }

/* Central Analytics Readout Display */
#info {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 20;
  background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  padding: 16px 24px; min-width: 360px; max-width: 520px; text-align: center; pointer-events: none; box-shadow: none;
}
#info h2 { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 1rem; color: var(--accent-cyan); margin-bottom: 6px; }
#info p { font-family: 'IBM Plex Sans', sans-serif; font-size: .78rem; color: var(--text-secondary); line-height: 1.6; }

/* Calibration Guide Legend */
#hint { 
  position: absolute; bottom: 24px; right: 24px; font-family: 'IBM Plex Mono', monospace; font-size: .62rem; 
  font-weight: 500; color: var(--text-muted); line-height: 1.8; z-index: 20; pointer-events: none; text-align: right; 
  background: rgba(255, 255, 255, 0.75); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px;
}

/* Fail-Safe System Terminal */
#error {
  display: none; position: absolute; inset:0; z-index: 200;
  align-items: center; justify-content: center; flex-direction: column;
  background: var(--bg); color: var(--text-secondary); text-align: center; padding: 40px;
}
#error.show { display: flex; }
#error h2 { color: var(--accent-danger); margin-bottom: 12px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 1.4rem; }
#error p { font-family: 'IBM Plex Sans', sans-serif; font-size: .85rem; line-height: 1.8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="labels"></canvas>

<div id="loading"><div class="flower">🌸</div><p>載入 Three.js 中...</p></div>
<div id="error">
  <h2>⚠️ 無法載入 3D 引擎</h2>
  <p>請確認網路連線，或嘗試在支援 WebGL 的瀏覽器中開啟。</p>
</div>

<div id="topbar">
  <h1>🌸 花的3D結構模擬器</h1>
  <p>FLORAL ANATOMY · INTERACTIVE 3D MODEL</p>
</div>

<div id="panel">
  <h3>結構圖層</h3>
  <button class="lbtn on" onclick="tog('sepal',this)">      <span class="dot" style="background:#72bb62"></span>萼片（花萼）</button>
  <button class="lbtn on" onclick="tog('petal',this)">      <span class="dot" style="background:#e090b0"></span>花瓣（花冠）</button>
  <button class="lbtn on" onclick="tog('stamen',this)">     <span class="dot" style="background:#c89020"></span>雄蕊（花藥＋花絲）</button>
  <button class="lbtn on" onclick="tog('carpel',this)">     <span class="dot" style="background:#e8d888"></span>心皮（柱頭花柱子房）</button>
  <button class="lbtn on" onclick="tog('receptacle',this)"> <span class="dot" style="background:#8a7060"></span>花托／花柄</button>
  <div class="sep"></div>
  <span class="clabel">自動旋轉速度</span>
  <input type="range" min="0" max="100" value="18" oninput="setSpd(+this.value)">
  <div class="sep"></div>
  <span class="clabel">視角</span>
  <div class="vrow">
    <button class="vbtn on" onclick="setView('free',this)">自由</button>
    <button class="vbtn"    onclick="setView('top',this)">俯視<br><small>橫切面</small></button>
    <button class="vbtn"    onclick="setView('side',this)">正視<br><small>縱切面</small></button>
  </div>
  <div class="sep"></div>
  <button id="xbtn" onclick="toggleExplode()">💥 爆炸分解視圖</button>
  <div class="sep"></div>
  <button id="cbtn" onclick="toggleCut()">🔪 子房縱切面</button>
</div>

<div id="info">
  <h2 id="ititle">點擊任一結構查看詳情</h2>
  <p id="idesc">拖動旋轉・滾輪縮放・右鍵平移</p>
</div>
<div id="hint">🖱 左鍵拖動旋轉<br>🖱 滾輪縮放<br>👆 點擊選取結構</div>

<script>
(function(){
  var cdns=[
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js'
  ];
  function tryLoad(i){
    if(i>=cdns.length){
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.add('show');
      return;
    }
    var s=document.createElement('script');
    s.src=cdns[i];
    s.onload=function(){ document.getElementById('loading').classList.add('hidden'); initFlower(); };
    s.onerror=function(){ tryLoad(i+1); };
    document.head.appendChild(s);
  }
  tryLoad(0);
})();
</script>

<script>
function initFlower(){

// ── RENDERER + SCENE ──────────────────────────
const canvas  = document.getElementById('c');
const lcanvas = document.getElementById('labels');
const lctx    = lcanvas.getContext('2d');

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0f14);
scene.fog = new THREE.FogExp2(0x0c0f14, 0.030);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

scene.add(new THREE.AmbientLight(0xffffff, 0.42));
const sun = new THREE.DirectionalLight(0xfff4ec, 1.3);
sun.position.set(7, 14, 8); sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xd0e8ff, 0.35);
fill.position.set(-6,-4,-6); scene.add(fill);
const pt = new THREE.PointLight(0xffc0d8, 0.7, 28);
pt.position.set(-4,8,-4); scene.add(pt);

// ── PART DATABASE ─────────────────────────────
const PARTS = {
  stigma:     { name:'柱頭 Stigma',     desc:'雌蕊頂端，表面有黏液，負責接收花粉。花粉落上後萌發花粉管向下進入花柱。',                   color:0xffe060, rough:.3, metal:.1 },
  style:      { name:'花柱 Style',      desc:'連接柱頭與子房的細長管道，花粉管需通過花柱才能到達子房完成受精。',                         color:0xe8d888, rough:.4 },
  ovary:      { name:'子房 Ovary',      desc:'雌蕊基部膨大的構造，內含胚珠（未來的種子）。受精後子房發育為果實。',                       color:0xf0e0a0, rough:.45 },
ovule:      { name:'胚珠 Ovule',     desc:'子房內的小顆粒，受精後發育成種子，是植物繁殖的基本單位。',                                color:0xffffff, rough:.3 },  anther:     { name:'花藥 Anther',     desc:'雄蕊頂端的囊狀構造，內含花粉囊，負責產生並釋放花粉（含有雄性配子）。',                     color:0xb87820, rough:.35, metal:.15 },
  filament:   { name:'花絲 Filament',   desc:'雄蕊的細長柄狀部分，支撐花藥並提供營養，使花藥伸至適當位置散布花粉。',                     color:0xd4c080, rough:.5 },
  petal:      { name:'花瓣 Petal',      desc:'花冠的組成單位，色彩鮮豔，主要功能是吸引授粉者（蜜蜂、蝴蝶等）協助異花授粉。',             color:0xe090b0, rough:.4, opacity:.88 },
  sepal:      { name:'萼片 Sepal',      desc:'花最外層的葉狀構造，通常呈綠色，在花苞期保護幼嫩的花瓣防止外界傷害。',                     color:0x72bb62, rough:.7 },
  receptacle: { name:'花托 Receptacle', desc:'花柄頂端膨大的部分，各輪花器（萼片、花瓣、雄蕊、雌蕊）均著生於此。',                     color:0x8a7060, rough:.7 },
  peduncle:   { name:'花柄 Peduncle',   desc:'支撐整朵花的細長莖狀構造，並提供水分與養分的運輸通道。',                                 color:0x5a8a3a, rough:.8 },
};

function mkMat(key){
  const d = PARTS[key];
  return new THREE.MeshStandardMaterial({
    color: d.color,
    roughness: d.rough !== undefined ? d.rough : 0.5,
    metalness: d.metal !== undefined ? d.metal : 0,
    transparent: !!(d.opacity && d.opacity < 1),
    opacity: d.opacity !== undefined ? d.opacity : 1,
    side: THREE.DoubleSide
  });
}

// ── REGISTRIES ────────────────────────────────
const layers    = { sepal:[], petal:[], stamen:[], carpel:[], receptacle:[] };
const clickable = [];
const labelDefs = {};       // partKey → { mesh, layerKey, dir }
const hiddenLayers = new Set();

const flowerGroup = new THREE.Group();
scene.add(flowerGroup);

const labelColor = {
  stigma:'#ffe060', style:'#e8d888', ovary:'#f0e0a0', ovule:'#ffffff',
  anther:'#e0a030', filament:'#d4c080', petal:'#e090b0', sepal:'#72bb62',
  receptacle:'#b09080', peduncle:'#7aaa5a'
};

// outwardDir: direction from mesh centre pointing outward (in group-local space)
function add(mesh, layerKey, partKey, outwardDir){
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData.partKey = partKey;
  flowerGroup.add(mesh);
  if(layerKey){ layers[layerKey].push(mesh); }
  if(partKey) clickable.push(mesh);
  mesh.userData.basePos = mesh.position.clone();
  if(partKey && outwardDir && !labelDefs[partKey]){
    labelDefs[partKey] = { mesh, layerKey, dir: outwardDir.clone().normalize() };
  }
  return mesh;
}

// ── COORDINATE SYSTEM ─────────────────────────
const RIM_R = 1.1;  // receptacle rim radius

// ── PEDUNCLE ──────────────────────────────────
{
  const h = 5.5;
  const geo = new THREE.CylinderGeometry(0.22, 0.28, h, 12);
  const m   = new THREE.Mesh(geo, mkMat('peduncle'));
  m.position.set(0, -h/2, 0);     // top edge at y=0, connects to receptacle base
  add(m, 'receptacle', 'peduncle', new THREE.Vector3(1, 0, 0));
}

// ── RECEPTACLE ────────────────────────────────
{
  const geo = new THREE.CylinderGeometry(RIM_R, 0.5, 0.5, 20);
  const m   = new THREE.Mesh(geo, mkMat('receptacle'));
  m.position.set(0, -0.25, 0);    // centred at -0.25 so top face is at y=0
  add(m, 'receptacle', 'receptacle', new THREE.Vector3(1.6, 0, 0));
}

// ── SEPALS × 5 ───────────────────────────────
{
  const N = 5;
  for(let i=0; i<N; i++){
    const a   = (i/N)*Math.PI*2;
    const len = 2.2;
    const geo = new THREE.ConeGeometry(0.38, len, 6, 1);
    geo.scale(1, 1, 0.3); 
    geo.translate(0, len/2, 0);
    const m = new THREE.Mesh(geo, mkMat('sepal'));

    const downAngle = Math.PI * 0.28;   // ~50° below horizontal
    const tx = Math.sin(a) * Math.cos(downAngle);
    const ty = -Math.sin(downAngle);
    const tz = Math.cos(a) * Math.cos(downAngle);
    m.quaternion.setFromUnitVectors(
      new THREE.Vector3(0,1,0),
      new THREE.Vector3(tx, ty, tz).normalize()
    );
    m.position.set(Math.sin(a)*RIM_R, 0, Math.cos(a)*RIM_R);

    add(m, 'sepal', 'sepal',
      i===0 ? new THREE.Vector3(Math.sin(a)*2.8, -0.8, Math.cos(a)*2.8) : undefined);
  }
}

// ── PETALS × 5 ───────────────────────────────
{
  const N        = 5;
  const P_RADIAL = 1.4;   // length from rim outward
  const P_TANG   = 1.1;   // half-width tangentially
  const P_THICK  = 0.12;  // vertical thickness
  const BOWL     = 0.32;  // tilt inward (radians) — inner edge rises, outer droops slightly

  for(let i=0; i<N; i++){
    const a = (i/N)*Math.PI*2 + Math.PI/N;  // interdigitate with sepals

    const geo = new THREE.SphereGeometry(1, 24, 16);
    geo.scale(P_TANG, P_THICK, P_RADIAL);
    geo.translate(0, 0, P_RADIAL);   // now inner edge is at local origin

    const m = new THREE.Mesh(geo, mkMat('petal'));

    m.rotation.y = a;
    m.rotation.order = 'YXZ';
    m.rotation.x = -(Math.PI/2 - BOWL);  // from flat(0°) tilt up toward vertical; BOWL controls openness

    m.position.set(Math.sin(a)*RIM_R, 0.05, Math.cos(a)*RIM_R);

    add(m, 'petal', 'petal',
      i===0 ? new THREE.Vector3(Math.sin(a)*3.2, 1.2, Math.cos(a)*3.2) : undefined);
  }
}

// ── STAMENS × 8 ──────────────────────────────
{
  const N  = 8;
  const SR = 0.72;   // stamen ring radius (inside petals)
  const FH = 2.0;    // filament height

  for(let i=0; i<N; i++){
    const a  = (i/N)*Math.PI*2;
    const fx = Math.sin(a)*SR;
    const fz = Math.cos(a)*SR;

    const fGeo = new THREE.CylinderGeometry(0.05, 0.07, FH, 7);
    fGeo.translate(0, FH/2, 0);   // pivot at base
    const fil  = new THREE.Mesh(fGeo, mkMat('filament'));
    fil.position.set(fx, 0, fz);
    const lean = 0.08;
    fil.rotation.order = 'YXZ';
    fil.rotation.x =  Math.cos(a) * lean;
    fil.rotation.z = -Math.sin(a) * lean;
    add(fil, 'stamen', 'filament',
      i===0 ? new THREE.Vector3(Math.sin(a)*2.2, FH*0.5, Math.cos(a)*2.2) : undefined);

    const aGeo = new THREE.SphereGeometry(0.18, 8, 6);
    aGeo.scale(0.9, 1.5, 0.9);
    const anth = new THREE.Mesh(aGeo, mkMat('anther'));
    anth.position.set(fx, FH, fz);
    add(anth, 'stamen', 'anther',
      i===2 ? new THREE.Vector3(Math.sin(a)*2.2, FH+0.3, Math.cos(a)*2.2) : undefined);
  }
}

// ── CARPEL (central pistil) ───────────────────
const ovaryCutMeshes = [];   // meshes that will be clipped on cut
const ovaryCapMeshes = [];   // flat cross-section caps (hidden until cut)

{
  const oGeo = new THREE.SphereGeometry(0.75, 40, 28);
  oGeo.scale(1, 1.2, 1);
  const ovaryMat = mkMat('ovary');
  ovaryMat.clippingPlanes = [];
  ovaryMat.clipShadows = true;
  const ovary = new THREE.Mesh(oGeo, ovaryMat);
  ovary.position.set(0, 0.75, 0);
  add(ovary, 'carpel', 'ovary', new THREE.Vector3(1.3, 0.75, 0));
  ovaryCutMeshes.push(ovary);

  const iGeo = new THREE.SphereGeometry(0.63, 40, 28);
  iGeo.scale(1, 1.2, 1);
  const innerMat = new THREE.MeshStandardMaterial({
    color: 0xd4c070, roughness:.6, side: THREE.BackSide,
    clippingPlanes:[], clipShadows:true
  });
  const ovaryInner = new THREE.Mesh(iGeo, innerMat);
  ovaryInner.position.set(0, 0.75, 0);
  flowerGroup.add(ovaryInner);
  layers['carpel'].push(ovaryInner);
  ovaryInner.userData.basePos = ovaryInner.position.clone();
  ovaryCutMeshes.push(ovaryInner);

  {
    const capGeo = new THREE.RingGeometry(0.63, 0.74, 48); 
    capGeo.scale(1, 1.18, 1);
    const capMat = new THREE.MeshStandardMaterial({
      color: 0xc8b840, roughness:.5, side: THREE.DoubleSide
    });
    const cap = new THREE.Mesh(capGeo, capMat);
    cap.rotation.y = Math.PI / 2;   
    cap.position.set(0, 0.75, 0);
    cap.visible = false;
    flowerGroup.add(cap);
    layers['carpel'].push(cap);
    cap.userData.basePos = cap.position.clone();
    ovaryCapMeshes.push(cap);
  }

  {
    const pGeo = new THREE.CylinderGeometry(0.07, 0.07, 1.5, 10);
    const pMat = new THREE.MeshStandardMaterial({color:0xb89030, roughness:.6, clippingPlanes:[], clipShadows:true});
    const placenta = new THREE.Mesh(pGeo, pMat);
    placenta.position.set(0, 0.75, 0);
    flowerGroup.add(placenta);
    layers['carpel'].push(placenta);
    placenta.userData.basePos = placenta.position.clone();
    ovaryCutMeshes.push(placenta);
  }

  const ovulePositions = [];
  for(let i=0; i<6; i++){
    const side = (i % 2 === 0) ? 1 : -1;   
    const row  = Math.floor(i / 2);
    const oy   = 0.3 + row * 0.42;
    const oz   = side * 0.32;
    ovulePositions.push([0, 0.75 - 0.6 + oy, oz]);
  }
  ovulePositions.forEach(([ox,oy,oz], i)=>{
    const og = new THREE.SphereGeometry(0.11, 12, 8);
    const ovMat = mkMat('ovule');
    ovMat.clippingPlanes = [];
    ovMat.clipShadows = true;
    const ov = new THREE.Mesh(og, ovMat);
    ov.position.set(ox, oy, oz);
    flowerGroup.add(ov);
    layers['carpel'].push(ov);
    ov.userData.basePos = ov.position.clone();
    ovaryCutMeshes.push(ov);
    
    const fLen = Math.abs(oz) - 0.07;
    const fGeo2 = new THREE.CylinderGeometry(0.02, 0.02, fLen, 5);
    const fMat2 = new THREE.MeshStandardMaterial({color:0xc0a040, clippingPlanes:[], clipShadows:true});
    const fun = new THREE.Mesh(fGeo2, fMat2);
    fun.position.set(0, oy, oz/2);
    fun.rotation.z = Math.PI/2;
    flowerGroup.add(fun);
    layers['carpel'].push(fun);
    fun.userData.basePos = fun.position.clone();
    ovaryCutMeshes.push(fun);
    if(i===0) labelDefs['ovule'] = { mesh:ov, layerKey:'carpel', dir:new THREE.Vector3(1.6, 0, 0) };
  });

  const sGeo = new THREE.CylinderGeometry(0.09, 0.16, 1.8, 10);
  const style = new THREE.Mesh(sGeo, mkMat('style'));
  style.position.set(0, 1.5 + 0.9, 0);
  add(style, 'carpel', 'style', new THREE.Vector3(0.9, 2.4, 0));

  const stGeo = new THREE.CylinderGeometry(0.2, 0.14, 0.16, 14);
  const stig  = new THREE.Mesh(stGeo, mkMat('stigma'));
  stig.position.set(0, 1.5 + 1.8 + 0.08, 0);
  add(stig, 'carpel', 'stigma', new THREE.Vector3(0.85, 3.4, 0));

  for(let i=0; i<3; i++){
    const la = (i/3)*Math.PI*2;
    const lg = new THREE.SphereGeometry(0.15, 8, 7);
    const lm = new THREE.Mesh(lg, mkMat('stigma'));
    lm.position.set(Math.sin(la)*0.26, 1.5+1.8+0.1, Math.cos(la)*0.26);
    add(lm, 'carpel', 'stigma', undefined);
  }
}

// ── POLLEN PARTICLES ─────────────────────────
{
  const n = 280, pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    pos[i*3]=(Math.random()-.5)*24;
    pos[i*3+1]=(Math.random()-.5)*20;

}

// ── EXPLODE MAP ───────────────────────────────
const explodeMap = new Map();
flowerGroup.children.forEach(m => {
  const p = m.position.clone();
  const d = new THREE.Vector3(p.x, Math.max(p.y, 0)*0.5, p.z).normalize();
  if(d.length() < 0.01) d.set(0, 1, 0);
  explodeMap.set(m.uuid, d);
});

// ── ORBIT STATE ───────────────────────────────
let theta=0.25, phi=1.05, radius=17;
let tTheta=theta, tPhi=phi, tRadius=radius;
let autoSpd=0.0035, dragging=false, prevMX=0, prevMY=0;
let viewMode='free', exploded=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ── INPUT ─────────────────────────────────────
const cvs = renderer.domElement;
let clickStartX=0, clickStartY=0;

cvs.addEventListener('mousedown', e=>{
  dragging=true; prevMX=e.clientX; prevMY=e.clientY;
  clickStartX=e.clientX; clickStartY=e.clientY;
});
cvs.addEventListener('mouseup', e=>{
  dragging=false;
  const dx=e.clientX-clickStartX, dy=e.clientY-clickStartY;
  if(Math.sqrt(dx*dx+dy*dy)<5 && e.button===0) doClick(e);
});
cvs.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const dx=e.clientX-prevMX, dy=e.clientY-prevMY;
  if(e.buttons&1){ tTheta-=dx*.007; tPhi=clamp(tPhi-dy*.007,.06,Math.PI*.88); }
  if(e.buttons&2){ flowerGroup.position.x+=dx*.014; flowerGroup.position.y-=dy*.014; }
  prevMX=e.clientX; prevMY=e.clientY;
});
cvs.addEventListener('wheel', e=>{ tRadius=clamp(tRadius+e.deltaY*.022,4,30); e.preventDefault(); },{passive:false});
cvs.addEventListener('contextmenu', e=>e.preventDefault());
cvs.addEventListener('touchstart', e=>{ dragging=true; prevMX=e.touches[0].clientX; prevMY=e.touches[0].clientY; },{passive:true});
cvs.addEventListener('touchmove', e=>{
  if(!dragging) return;
  const dx=e.touches[0].clientX-prevMX, dy=e.touches[0].clientY-prevMY;
  tTheta-=dx*.007; tPhi=clamp(tPhi-dy*.007,.06,Math.PI*.88);
  prevMX=e.touches[0].clientX; prevMY=e.touches[0].clientY;
},{passive:true});
cvs.addEventListener('touchend',()=>dragging=false);

const ray=new THREE.Raycaster(), mp=new THREE.Vector2();
function doClick(e){
  const r=cvs.getBoundingClientRect();
  mp.x=((e.clientX-r.left)/r.width)*2-1;
  mp.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mp, camera);
  const hits=ray.intersectObjects(clickable,false);
  if(hits.length){
    const key=hits[0].object.userData.partKey;
    if(key&&PARTS[key]){
      document.getElementById('ititle').textContent=PARTS[key].name;
      document.getElementById('idesc').textContent=PARTS[key].desc;
    }
  }
}

// ── PANEL CONTROLS ────────────────────────────
window.tog = function(key, btn){
  const on=btn.classList.toggle('on');
  layers[key].forEach(m=>{ m.visible=on; });
  if(on) hiddenLayers.delete(key); else hiddenLayers.add(key);
};
window.setSpd  = v=>{ autoSpd=v*0.00012; };
window.setView = function(v, btn){
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); viewMode=v;
};
let ovarySliced = false;

window.toggleCut = function(){
  ovarySliced = !ovarySliced;
  const btn = document.getElementById('cbtn');
  btn.classList.toggle('on', ovarySliced);
  btn.textContent = ovarySliced ? '🔗 還原子房' : '🔪 子房縱切面';

  const plane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);

  if(ovarySliced){
    renderer.localClippingEnabled = true;
    ovaryCutMeshes.forEach(m=>{
      if(m.material && m.material.clippingPlanes !== undefined){
        m.material.clippingPlanes = [plane];
        m.material.needsUpdate = true;
      }
    });

    ovaryCapMeshes.forEach(m=>{ m.visible = false; }); 
    document.getElementById('ititle').textContent = '子房縱切面';
    document.getElementById('idesc').textContent  = '子房沿縱軸切開，可見子房壁、胎座、胚珠及珠柄。';
  } else {
    ovaryCutMeshes.forEach(m=>{
      if(m.material && m.material.clippingPlanes !== undefined){
        m.material.clippingPlanes = [];
        m.material.needsUpdate = true;
      }
    });
    ovaryCapMeshes.forEach(m=>{ m.visible = false; });
    renderer.localClippingEnabled = false;
  }
};

window.toggleExplode = function(){
  exploded=!exploded;
  document.getElementById('xbtn').textContent=exploded?'🔗 還原視圖':'💥 爆炸分解視圖';
  if(exploded){
    document.getElementById('ititle').textContent='爆炸分解視圖';
    document.getElementById('idesc').textContent='各結構已分離，便於觀察相對位置與層次關係。';
  }
};

// ── RESIZE ────────────────────────────────────
function resize(){
  const W=window.innerWidth, H=window.innerHeight;
  renderer.setSize(W,H);
  lcanvas.width=W; lcanvas.height=H;
  camera.aspect=W/H; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ── LABEL DRAWING ─────────────────────────────
const _rSurf=new THREE.Raycaster(), _wP=new THREE.Vector3(), _wD=new THREE.Vector3();
function drawLabels(){
  const W=lcanvas.width, H=lcanvas.height;
  lctx.clearRect(0,0,W,H);
  Object.entries(labelDefs).forEach(([key,def])=>{
    if(hiddenLayers.has(def.layerKey)) return;
    if(!def.mesh.visible) return;

    def.mesh.getWorldPosition(_wP);
    _wD.copy(def.dir).transformDirection(flowerGroup.matrixWorld).normalize();

    const orig = _wP.clone().add(_wD.clone().multiplyScalar(20));
    _rSurf.set(orig, _wD.clone().negate());
    const hits = _rSurf.intersectObject(def.mesh, false);
    let surfPt;
    if(hits.length>0){
      surfPt = hits[0].point.clone();
    } else {
      def.mesh.geometry.computeBoundingSphere();
      const bs=def.mesh.geometry.boundingSphere;
      const ws=def.mesh.getWorldScale(new THREE.Vector3());
      const r=(bs?bs.radius:0.5)*Math.max(ws.x,ws.y,ws.z)*0.9;
      surfPt=_wP.clone().add(_wD.clone().multiplyScalar(r));
    }

    const ndc=surfPt.clone().project(camera);
    if(ndc.z>1) return;
    const dsx=(ndc.x*.5+.5)*W, dsy=(-ndc.y*.5+.5)*H;
    const scx=dsx-W/2, scy=dsy-H/2, scl=Math.sqrt(scx*scx+scy*scy)||1;
    const ux=scx/scl, uy=scy/scl;

    const color=labelColor[key]||'#fff';
    const label=PARTS[key]?PARTS[key].name.split(' ')[0]:key;
    lctx.font='bold 12px "Noto Serif TC", serif';
    const tw=lctx.measureText(label).width;
    const ph=17, pw=tw+14, rr=8, GAP=8;
    const lcx=dsx+ux*(pw/2+GAP), lcy=dsy+uy*(ph/2+GAP);
    const bx=lcx-pw/2, by=lcy-ph/2;
    const ex=lcx-ux*pw/2, ey=lcy-uy*ph/2;

    lctx.beginPath(); lctx.moveTo(dsx,dsy); lctx.lineTo(ex,ey);
    lctx.strokeStyle=color+'70'; lctx.lineWidth=0.9; lctx.stroke();

    lctx.beginPath(); lctx.arc(dsx,dsy,2.5,0,Math.PI*2);
    lctx.fillStyle=color; lctx.fill();

    lctx.beginPath();
    lctx.moveTo(bx+rr,by); lctx.lineTo(bx+pw-rr,by);
    lctx.arcTo(bx+pw,by,bx+pw,by+rr,rr); lctx.lineTo(bx+pw,by+ph-rr);
    lctx.arcTo(bx+pw,by+ph,bx+pw-rr,by+ph,rr); lctx.lineTo(bx+rr,by+ph);
    lctx.arcTo(bx,by+ph,bx,by+ph-rr,rr); lctx.lineTo(bx,by+rr);
    lctx.arcTo(bx,by+rr,bx+rr,by,rr); lctx.closePath();
    lctx.fillStyle='rgba(8,12,18,0.88)'; lctx.fill();
    lctx.strokeStyle=color+'99'; lctx.lineWidth=1.1; lctx.stroke();
    lctx.fillStyle=color;
    lctx.fillText(label, bx+(pw-tw)/2, by+ph*0.68);
  });
}

// ── ANIMATION LOOP ────────────────────────────
let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.016;

  if(!dragging && viewMode==='free') tTheta+=autoSpd;
  if(viewMode==='top'){
    tPhi+=(0.07-tPhi)*.07; tRadius+=(13-tRadius)*.07;
  } else if(viewMode==='side'){
    tPhi+=(Math.PI/2-tPhi)*.07; tTheta+=(0-tTheta)*.07; tRadius+=(13-tRadius)*.07;
  }
  theta+=(tTheta-theta)*.08; phi+=(tPhi-phi)*.08; radius+=(tRadius-radius)*.08;

  camera.position.set(
    radius*Math.sin(phi)*Math.sin(theta),
    radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(flowerGroup.position);

  flowerGroup.children.forEach(m=>{
    if(!m.userData.basePos) return;
    const base=m.userData.basePos;
    if(exploded){
      const dir=explodeMap.get(m.uuid)||new THREE.Vector3(0,1,0);
      m.position.x+=(base.x+dir.x*5.0-m.position.x)*.06;
      m.position.y+=(base.y+dir.y*4.0-m.position.y)*.06;
      m.position.z+=(base.z+dir.z*5.0-m.position.z)*.06;
    } else {
      m.position.x+=(base.x-m.position.x)*.09;
      m.position.y+=(base.y-m.position.y)*.09;
      m.position.z+=(base.z-m.position.z)*.09;
    }
  });

  let pi=0;
  flowerGroup.children.forEach(m=>{
    if(m.userData.partKey==='petal'){
      if(!m.userData._bs) m.userData._bs=m.scale.clone();
      const s=1+Math.sin(t*.55+pi)*0.016;
      m.scale.set(m.userData._bs.x*s, m.userData._bs.y*s, m.userData._bs.z);
      pi++;
    }
  });

  renderer.render(scene, camera);
  drawLabels();
}

animate();
}
