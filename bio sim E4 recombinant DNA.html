<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>重組DNA技術 · HinHin的虛擬實驗室</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#ffffff;--line:#d4dbe6;
  --txt:#1a2332;--sec:#4a5a70;--dim:#8a9ab0;
  --mono:'IBM Plex Mono','Roboto Mono',Monaco,ui-monospace,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',Inter,"PingFang HK","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --amp:#1976d2;--tet:#e65100;--target:#2e7d32;--ori:#5e35b1;--rop:#c2185b;
  --bam:#1976d2;--hind:#c2185b;--ecori:#e65100;--ecorv:#607d8b;--scai:#2e7d32;--afl:#5e35b1;
  --good:#2e7d32;--bad:#c62828;--warn:#e65100;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden;touch-action:manipulation;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
header{flex:0 0 auto;padding:7px 12px;background:linear-gradient(180deg,#ffffff,#f4f6f9);border-bottom:1px solid var(--line);}
.titlebar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.brand{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--txt);}
.brand b{color:var(--amp);}
.modes{display:flex;gap:6px;}
.modes button{font-size:11px;padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--sec);font-family:var(--sans);font-weight:600;}
.modes button.active{background:var(--amp);color:#fff;border-color:var(--amp);}
.steps{display:flex;gap:6px;margin-top:7px;}
.step{flex:1;display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:5px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--dim);transition:.2s;cursor:pointer;}
.step .num{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;background:#eef2f7;color:var(--sec);font-weight:700;font-size:11px;flex:0 0 auto;font-family:var(--mono);}
.step.active{color:var(--txt);border-color:var(--amp);background:#e9f2fc;}
.step.active .num{background:var(--amp);color:#fff;}
.step.done .num{background:var(--good);color:#fff;}
.step span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
main{flex:1 1 auto;position:relative;overflow:hidden;min-height:0;}
.stage{position:absolute;inset:0;display:flex;gap:10px;padding:10px;}
.col-vis{flex:1.7 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;overflow:hidden;}
.col-ctl{flex:1 1 0;min-width:240px;max-width:360px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
@media(max-width:840px){.stage{flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;}.col-vis,.col-ctl{flex:none;max-width:none;overflow:visible;}.col-vis{min-height:46vh;}}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 13px;}
.glass h2{margin:0 0 7px;font-size:13px;color:var(--txt);font-weight:700;letter-spacing:.2px;}
.glass p{margin:4px 0;font-size:12px;color:var(--sec);line-height:1.65;}
.stagebox{flex:1;display:grid;place-items:center;position:relative;min-height:0;overflow:hidden;}
.plasmid-svg{display:block;max-width:100%;max-height:100%;width:auto;height:auto;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:5px;border:1px solid var(--line);font-size:14px;font-weight:600;background:#fff;color:var(--txt);font-family:var(--sans);transition:.16s;cursor:pointer;width:100%;}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--amp);color:#fff;border-color:var(--amp);}
.btn.warn{background:var(--warn);color:#fff;border-color:var(--warn);}
.btn.confirm{background:var(--ori);color:#fff;border-color:var(--ori);}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad);}
.btn.ghost{background:#fff;color:var(--sec);}
.btn:disabled{opacity:.4;pointer-events:none;}
.btn.sm{font-size:12px;padding:9px 11px;}
.btnrow{display:flex;gap:7px;}.btnrow .btn{flex:1;}
.enzyme{display:flex;flex-direction:column;gap:6px;}
.enzyme>button{display:flex;flex-direction:column;text-align:left;padding:9px 11px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--txt);font-family:var(--sans);transition:.16s;}
.enzyme .erow{display:flex;align-items:center;gap:9px;}
.enzyme .swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
.enzyme .meta{flex:1;}.enzyme .meta b{font-size:13px;color:var(--txt);}
.enzyme .tag{font-size:10px;color:var(--dim);display:block;margin-top:2px;}
.enzyme .chk{font-size:15px;color:var(--dim);}
.enzyme>button:active{transform:scale(.99);}
.enzyme>button.sel{border-color:var(--amp);background:#e9f2fc;}
.enzyme>button.sel .chk{color:var(--amp);}
.enzyme>button.sel-good{border-color:var(--good);background:#e8f5e9;}
.enzyme>button.sel-bad{border-color:var(--bad);background:#fdecea;}
.cutmini{margin-top:7px;padding:6px 8px;border-radius:5px;background:var(--bg);border:1px dashed var(--line);font-family:var(--mono);font-size:13px;}
.cline{display:flex;align-items:center;white-space:nowrap;}
.cline .lb{width:18px;color:var(--dim);font-size:10px;flex:0 0 auto;}
.cb{display:inline-flex;width:14px;height:18px;align-items:center;justify-content:center;font-weight:700;}
.cb.cut{box-shadow:inset 2px 0 0 var(--bad);}
.cend{font-size:10px;margin-top:3px;font-family:var(--sans);}
.cend.s{color:var(--target);}.cend.bl{color:var(--sec);}
.feedback{border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.65;border:1px solid;white-space:pre-line;animation:pop .25s ease;}
.feedback.good{background:#e8f5e9;border-color:var(--good);color:#1b5e20;}
.feedback.bad{background:#fdecea;border-color:var(--bad);color:#b71c1c;}
.feedback.info{background:#fff4e5;border-color:var(--warn);color:#bf360c;}
.feedback b{color:inherit;}
@keyframes pop{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--sec);}
.legend span{display:inline-flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
.seqwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0;}
.seq{font-family:var(--mono);font-size:13px;display:inline-block;}
.seqrow{display:flex;align-items:center;white-space:nowrap;}
.lab{width:18px;color:var(--dim);font-size:11px;flex:0 0 auto;}
.b{display:inline-flex;width:17px;height:21px;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700;font-family:var(--mono);}
.b.blank{color:transparent;}
.b.cut,.b.nick{box-shadow:inset 2px 0 0 var(--bad);}
.b.seal{box-shadow:inset 2px 0 0 var(--rop);}
.b.oh{background:#eef2f7;border-radius:3px;}
.hbrow .b{font-size:11px;font-weight:400;color:var(--amp);}
.frag{display:inline-block;border:1px dashed var(--line);border-radius:5px;padding:2px;}
.jlab{font-size:10px;font-weight:700;text-align:center;margin-bottom:1px;}
.afterwrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.gap{color:var(--sec);font-size:12px;}
.geneblk{display:inline-flex;align-items:center;justify-content:center;height:21px;padding:0 7px;background:rgba(46,125,50,.1);border:1px solid var(--target);border-radius:4px;color:var(--target);font-size:10px;font-weight:700;}
.ohend{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 7px;border:1.5px solid;border-radius:5px;font-size:11px;font-weight:700;line-height:1.25;font-family:var(--mono);}
.ohend small{font-weight:400;font-size:9px;font-family:var(--sans);}
.vecarm{display:inline-flex;align-items:center;height:26px;padding:0 9px;background:rgba(230,81,0,.1);border:1px solid var(--tet);border-radius:4px;color:var(--tet);font-size:10px;font-weight:700;}
.endtag{font-size:11px;margin-top:3px;}.endtag.s{color:var(--target);}.endtag.bl{color:var(--sec);}
/* base-pair simulation */
.bpsim-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;}
.bpsvg{max-width:100%;height:auto;}
.hbond{transition:opacity .3s;}
.hbond.pulse{animation:hbpulse 1.1s ease-in-out infinite;}
@keyframes hbpulse{0%,100%{opacity:.28;}50%{opacity:1;}}
.popcards{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.popcard{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:5px;background:#fff;border:1px solid var(--line);font-size:11px;color:var(--sec);}
.popcard .ecoli{width:30px;height:30px;flex:0 0 auto;}
.popcard b{font-size:12px;color:var(--txt);}.pheno{font-size:10px;color:var(--sec);margin-top:1px;}
.pheno .r{color:var(--good);font-weight:700;}.pheno .s{color:var(--bad);font-weight:700;}
.plates{display:flex;gap:12px;flex-wrap:nowrap;justify-content:center;align-items:flex-start;width:100%;}
.plate-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 0;min-width:0;max-width:360px;}
.plate-label{font-size:12px;font-weight:700;}.plate-sub{font-size:10px;color:var(--dim);}
.petri{display:block;width:100%;height:auto;}
@media(max-width:840px){.petri{max-width:44vw;}}
.stat{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;padding:5px 0;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px;color:var(--dim);}
.stat b{color:var(--amp);font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:0;}
table.cmp{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px;text-align:center;color:var(--txt);}
table.cmp th{background:#e9f2fc;font-weight:700;}
.yes{color:var(--good);font-weight:700;font-family:var(--mono);}.no{color:var(--bad);font-weight:700;font-family:var(--mono);}
.scan{position:absolute;inset:0;pointer-events:none;border-radius:6px;overflow:hidden;}
.scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--amp),transparent);opacity:.22;animation:scanmove 3.2s linear infinite;}
@keyframes scanmove{0%{top:0}100%{top:100%}}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;max-width:90%;box-shadow:0 4px 18px rgba(26,35,50,.18);}
.glow{}
small.note{font-size:10px;color:var(--sec);display:block;margin-top:3px;line-height:1.5;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titlebar">
      <div class="brand">🧬 <b>重組DNA技術 · HinHin的虛擬實驗室</b></div>
      <div class="modes">
        <button id="mExplore" class="active" onclick="setMode('explore')">探索</button>
        <button id="mReplay" onclick="setMode('replay')">重播</button>
      </div>
    </div>
    <div class="steps" id="steps">
      <div class="step" data-s="1" onclick="goStage(1)"><span class="num">1</span><span class="t">限制酶切割</span></div>
      <div class="step" data-s="2" onclick="goStage(2)"><span class="num">2</span><span class="t">連接與轉化</span></div>
      <div class="step" data-s="3" onclick="goStage(3)"><span class="num">3</span><span class="t">雙平板篩選</span></div>
      <div class="step" data-s="4" onclick="goStage(4)"><span class="num">★</span><span class="t">總結</span></div>
    </div>
  </header>
  <main id="main"></main>
</div>

<script>
"use strict";
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const COMP={A:'T',T:'A',G:'C',C:'G'};
const comp=s=>s.split('').map(c=>COMP[c]).join('');

const SEED=20240518;
const experimentState={
  mode:'explore',stage:1,
  plasmid:{cut:false,selected:[],feedback:null,enzymes:null},
  dnaFragments:{targetReady:false},
  ligation:{inserted:false,ligated:false},
  transformation:{heatShock:false,done:false,ratios:{recombinant:9,self:5,none:0}},
  colonies:[],replica:{plated:false,onionSkin:false},
  quiz:{score:0,mistakes:0,totalRecombinant:0,found:0,hintShown:false,complete:false},
  _focus:null
};
(function initColonies(){
  const rng=mulberry32(SEED),r=experimentState.transformation.ratios;
  let types=[...Array(r.recombinant).fill('recombinant'),...Array(r.self).fill('self')];
  for(let i=types.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[types[i],types[j]]=[types[j],types[i]];}
  const cols=[];let att=0;
  while(cols.length<types.length&&att<4000){att++;
    const ang=rng()*Math.PI*2,rad=Math.sqrt(rng())*66;
    const x=100+rad*Math.cos(ang),y=100+rad*Math.sin(ang);
    if(cols.every(c=>Math.hypot(c.x-x,c.y-y)>16))
      cols.push({id:cols.length,x:+x.toFixed(2),y:+y.toFixed(2),type:types[cols.length],judged:null});
  }
  experimentState.colonies=cols;
  experimentState.quiz.totalRecombinant=cols.filter(c=>c.type==='recombinant').length;
})();

/* Geometry */
const CX=280,CY=230,R=150;
function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arc(cx,cy,r,a0,a1){const[x1,y1]=polar(cx,cy,r,a0),[x2,y2]=polar(cx,cy,r,a1);
  const large=((a1-a0+360)%360)>180?1:0;
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;}
function arrowHead(cx,cy,r,a,col){
  const[x,y]=polar(cx,cy,r,a),[x2,y2]=polar(cx,cy,r,a-7);
  let dx=x-x2,dy=y-y2;const len=Math.hypot(dx,dy)||1;const ux=dx/len,uy=dy/len,px=-uy,py=ux,s=7;
  return `<polygon points="${(x+ux*5).toFixed(1)},${(y+uy*5).toFixed(1)} ${(x-ux*2+px*s).toFixed(1)},${(y-uy*2+py*s).toFixed(1)} ${(x-ux*2-px*s).toFixed(1)},${(y-uy*2-py*s).toFixed(1)}" fill="${col}"/>`;
}
const GENES={
  amp:{a0:60,a1:140,col:'var(--amp)',name:'氨苄青黴素抗性基因'},
  ori:{a0:150,a1:185,col:'var(--ori)',name:'複製起點'},
  tet:{a0:200,a1:320,col:'var(--tet)',name:'四環素抗性基因'},
  rop:{a0:25,a1:50,col:'var(--rop)',name:'複製調節基因'}
};
const GENE_LINES={
  '氨苄青黴素抗性基因':['氨苄青黴素','抗性基因'],
  '四環素抗性基因':['四環素','抗性基因'],
  '複製調節基因':['複製','調節基因'],
  '複製起點':['複製起點'],
  '目標基因':['目標基因']
};
const MCS_BAM=235, MCS_HIND=255;

const ENZYMES=[
 {id:'bamhi', name:'BamHI', site:'GGATCC', angle:235, col:'var(--bam)',  region:'tet',
  topCut:1,botCut:5, topL:'G·····',botL:'CCTAG·', topR:'·GATCC',botR:'·····G', endType:'sticky',overhang:'GATC',
  note:'切點位於四環素抗性基因內，產生 5\'-GATC 黏端。'},
 {id:'hindiii',name:'HindIII',site:'AAGCTT',angle:255, col:'var(--hind)', region:'tet',
  topCut:1,botCut:5, topL:'A·····',botL:'TTCGA·', topR:'·AGCTT',botR:'·····A', endType:'sticky',overhang:'AGCT',
  note:'切點位於四環素抗性基因內，產生 5\'-AGCT 黏端（與 BamHI 不同）。'},
 {id:'ecori', name:'EcoRI', site:'GAATTC', angle:275, col:'var(--ecori)',region:'tet',
  topCut:1,botCut:5, topL:'G·····',botL:'CTTAA·', topR:'·AATTC',botR:'·····G', endType:'sticky',overhang:'AATT',
  note:'切點在四環素抗性基因內，但目標基因兩端無 EcoRI 切點。'},
 {id:'ecorv', name:'EcoRV', site:'GATATC', angle:295, col:'var(--ecorv)',region:'tet',
  topCut:3,botCut:3, topL:'GAT···',botL:'CTA···', topR:'···ATC',botR:'···TAG', endType:'blunt',overhang:'—',
  note:'產生鈍端，無單股黏端，無法控制插入方向。'},
 {id:'scai',  name:'ScaI',  site:'AGTACT', angle:100, col:'var(--scai)', region:'amp',
  topCut:3,botCut:3, topL:'AGT···',botL:'TCA···', topR:'···ACT',botR:'···TGA', endType:'blunt',overhang:'—',
  note:'切點在氨苄青黴素抗性基因內，會破壞 Amp 篩選標記，且為鈍端。'},
 {id:'aflIII',name:'AflIII',site:'ACATGT', angle:167, col:'var(--afl)',  region:'ori',
  topCut:1,botCut:5, topL:'A·····',botL:'TGTAC·', topR:'·CATGT',botR:'·····A', endType:'sticky',overhang:'CATG',
  note:'切點靠近複製起點，會破壞質粒複製能力。'}
];
const BAM=ENZYMES.find(e=>e.id==='bamhi'), HIND=ENZYMES.find(e=>e.id==='hindiii');

/* Plasmid drawing — gene names INSIDE (multiline), enzyme labels OUTSIDE */
function geneLabelIn(angle,name,col){
  const lines=GENE_LINES[name]||[name];
  const[x,y]=polar(CX,CY,R-30,angle);const lh=11;const y0=y-(lines.length-1)*lh/2;
  let t=`<text x="${x.toFixed(1)}" y="${y0.toFixed(1)}" fill="${col}" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none">`;
  lines.forEach((ln,i)=>{t+=`<tspan x="${x.toFixed(1)}" dy="${i===0?0:lh}">${ln}</tspan>`;});
  return t+`</text>`;
}
function arcStroke(a0,a1,col){return `<path d="${arc(CX,CY,R,a0,a1)}" stroke="${col}" stroke-width="16" fill="none" opacity=".92"/>`;}
function drawGenes(mode){
  const broken=(mode==='gap'||mode==='recombinant');let s='';
  for(const k in GENES){const g=GENES[k];
    if(k==='tet'&&broken){
      s+=arcStroke(200,MCS_BAM,g.col);
      s+=arcStroke(MCS_HIND,320,g.col)+arrowHead(CX,CY,R,320,g.col);
      s+=geneLabelIn(290,g.name,g.col);
    }else{
      s+=arcStroke(g.a0,g.a1,g.col)+arrowHead(CX,CY,R,g.a1,g.col);
      s+=geneLabelIn((g.a0+g.a1)/2,g.name,g.col);
    }
  }
  if(mode==='recombinant'){
    s+=`<path d="${arc(CX,CY,R,MCS_BAM,MCS_HIND)}" stroke="var(--target)" stroke-width="16" fill="none"/>`;
    s+=arrowHead(CX,CY,R,MCS_HIND,'var(--target)');
    s+=geneLabelIn(245,'目標基因','var(--target)');
    const[bx,by]=polar(CX,CY,R,MCS_BAM),[hx,hy]=polar(CX,CY,R,MCS_HIND);
    s+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="4" fill="var(--bad)"/>`;
    s+=`<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="4" fill="var(--bad)"/>`;
  }
  if(mode==='gap'){
    const[bx,by]=polar(CX,CY,R,MCS_BAM),[hx,hy]=polar(CX,CY,R,MCS_HIND);
    const[blx,bly]=polar(CX,CY,R+32,MCS_BAM),[hlx,hly]=polar(CX,CY,R+32,MCS_HIND);
    s+=`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${blx.toFixed(1)}" y2="${bly.toFixed(1)}" stroke="var(--sec)" stroke-width="1" opacity=".5"/>`;
    s+=`<line x1="${hx.toFixed(1)}" y1="${hy.toFixed(1)}" x2="${hlx.toFixed(1)}" y2="${hly.toFixed(1)}" stroke="var(--sec)" stroke-width="1" opacity=".5"/>`;
    s+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="5" fill="var(--bad)"/>`;
    s+=`<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="5" fill="var(--bad)"/>`;
    s+=`<text x="${blx.toFixed(1)}" y="${bly.toFixed(1)}" fill="var(--sec)" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" style="pointer-events:none">BamHI ▼</text>`;
    s+=`<text x="${hlx.toFixed(1)}" y="${hly.toFixed(1)}" fill="var(--sec)" font-size="11" font-weight="700" text-anchor="end" dominant-baseline="middle" style="pointer-events:none">HindIII ▼</text>`;
  }
  return s;
}
function siteMarkers(selected){
  let s='';const tetList=ENZYMES.filter(z=>z.region==='tet').map(z=>z.id);
  ENZYMES.forEach(e=>{
    const sel=selected.includes(e.id);
    const[x1,y1]=polar(CX,CY,R-9,e.angle),[x2,y2]=polar(CX,CY,R+9,e.angle);
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${e.col}" stroke-width="${sel?5:2.5}" style="pointer-events:none"/>`;
    let far=false;
    if(e.region==='tet'){far=(tetList.indexOf(e.id)%2===1);}
    const lr=R+(far?58:23);
    const[lx,ly]=polar(CX,CY,lr,e.angle),[dx,dy]=polar(CX,CY,R+9,e.angle);
    s+=`<line x1="${dx.toFixed(1)}" y1="${dy.toFixed(1)}" x2="${lx.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="${e.col}" stroke-width="1" opacity=".5" style="pointer-events:none"/>`;
    const anchor=lx>CX+4?'start':lx<CX-4?'end':'middle';
    s+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="${e.col}" font-size="${sel?12:10.5}" font-weight="${sel?800:600}" text-anchor="${anchor}" dominant-baseline="middle" style="pointer-events:none">${e.name}${sel?' ✓':''}</text>`;
  });
  return s;
}
function plasmidInner(mode,selected=[]){
  let s='';
  if(mode==='gap') s+=`<path d="${arc(CX,CY,R,MCS_HIND,MCS_BAM+360)}" stroke="#c4cdd8" stroke-width="2" fill="none"/>`;
  else s+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#c4cdd8" stroke-width="2"/>`;

  if(mode==='sites') s+=siteMarkers(selected);

  s+=`<text x="${CX}" y="${CY+58}" fill="#1a2332" font-size="15" font-weight="800" text-anchor="middle">pBR322</text>`;
  s+=`<text x="${CX}" y="${CY+74}" fill="#8a9ab0" font-size="10" text-anchor="middle">4361 bp　↻ 順時針轉錄</text>`;
  return s;
}
function plasmidSVG(opts={}){const{mode='sites',selected=[]}=opts;
  return `<svg class="plasmid-svg" viewBox="-30 -10 620 620" preserveAspectRatio="xMidYMid meet">${plasmidInner(mode,selected)}</svg>`;}

/* === 連接示意：質粒DNA — 目標基因 — 質粒DNA ===
   DNA與鹼基只用兩色：橙(質粒)、綠(目標基因)。
   限制位點鹼基依切點分屬左右側 DNA 著色。紅點＝限制位點標記。
   酶名標籤改為中性灰色，不再使用藍/粉。 */
function basePairSVG(state){
  const PL='var(--tet)', GN='var(--target)';
  const sealed=state==='ligated', apart=state==='apart';
  const cw=16, geneW=92;
  const yLab=16, yT=56, yB=84, yArm=32, yArmB=100;

  /* ---- 黏端分離狀態：上下股錯位，露出單股突出（黏端）---- */
  if(apart){
    const FRAG_GAP=34;
    const frags=[
      {col:PL, lab:'質粒DNA', cols:[['C','G'],['T','A'],['G','C'],['G','C'],[null,'C'],[null,'T'],[null,'A'],[null,'G']]},
      {col:GN, lab:'目標基因', cols:[['G',null],['A',null],['T',null],['C',null],['C','G'],{gene:true},['A','T'],[null,'T'],[null,'C'],[null,'G'],[null,'A']]},
      {col:PL, lab:'質粒DNA', cols:[['A',null],['G',null],['C',null],['T',null],['T','A'],['G','C'],['C','G'],['A','T']]}
    ];
    let x=14, cells='', labels='', bb='';
    const fext=[];
    frags.forEach((f,fi)=>{
      if(fi>0) x+=FRAG_GAP;
      const fx0=x; let tMin=null,tMax=null,bMin=null,bMax=null;
      f.cols.forEach(c=>{
        if(c.gene){
          cells+=`<rect x="${x}" y="${yArm}" width="${geneW}" height="${yArmB-yArm}" rx="5" fill="${GN}" opacity="0.16" stroke="${GN}" stroke-width="1.5"/>`;
          cells+=`<text x="${x+geneW/2}" y="${(yArm+yArmB)/2+5}" text-anchor="middle" font-size="13" font-weight="800" fill="${GN}">目標基因</text>`;
          if(tMin===null)tMin=x; tMax=x+geneW; if(bMin===null)bMin=x; bMax=x+geneW; x+=geneW; return;
        }
        const cx=x+cw/2;
        if(c[0]!=null){cells+=`<text x="${cx}" y="${yT}" text-anchor="middle" font-size="14" font-weight="700" font-family="Monaco,monospace" fill="${f.col}">${c[0]}</text>`; if(tMin===null)tMin=x; tMax=x+cw;}
        if(c[1]!=null){cells+=`<text x="${cx}" y="${yB}" text-anchor="middle" font-size="14" font-weight="700" font-family="Monaco,monospace" fill="${f.col}">${c[1]}</text>`; if(bMin===null)bMin=x; bMax=x+cw;}
        x+=cw;
      });
      bb+=`<line x1="${tMin}" y1="${yArm}" x2="${tMax}" y2="${yArm}" stroke="${f.col}" stroke-width="2.5" stroke-linecap="round"/>`;
      bb+=`<line x1="${bMin}" y1="${yArmB}" x2="${bMax}" y2="${yArmB}" stroke="${f.col}" stroke-width="2.5" stroke-linecap="round"/>`;
      labels+=`<text x="${(fx0+x)/2}" y="${yLab}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${f.col}">${f.lab}</text>`;
      fext.push({x0:fx0,x1:x});
    });
    let enzLab='';
    enzLab+=`<text x="${((fext[0].x1+fext[1].x0)/2).toFixed(1)}" y="${(yT+yB)/2+4}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--sec)">BamHI</text>`;
    enzLab+=`<text x="${((fext[1].x1+fext[2].x0)/2).toFixed(1)}" y="${(yT+yB)/2+4}" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--sec)">HindIII</text>`;
    const W=x+14;
    const ends=`<text x="6" y="${yT}" font-size="9" fill="var(--dim)">5'</text><text x="6" y="${yB}" font-size="9" fill="var(--dim)">3'</text><text x="${W-6}" y="${yT}" font-size="9" fill="var(--dim)" text-anchor="end">3'</text><text x="${W-6}" y="${yB}" font-size="9" fill="var(--dim)" text-anchor="end">5'</text>`;
    return `<svg class="bpsvg" viewBox="0 0 ${W} 116" width="${W}" style="max-width:100%">${labels}${enzLab}${bb}${cells}${ends}</svg>`;
  }

  /* ---- 配對中 / 已連接：黏端錯位接合的連續雙股 ---- */
  let x=14, cells='', labels='', bb='', marks='';
  const colOf=o=> o==='P'?PL:GN;

  /* 建立逐欄資料：t/b=上下股鹼基，to/bo=上下股來源(P質粒/I基因) */
  const colsArr=[];
  const push=(t,to,bo,extra)=>colsArr.push({t,b:COMP[t],to,bo,...(extra||{})});
  // 區段A 質粒 CTG（上下股皆質粒）
  'CTG'.split('').forEach(ch=>push(ch,'P','P'));
  // 區段B BamHI 復原位 GGATCC：上股 P I I I I I，下股 P P P P P I（GATC 突出錯位）
  const Bt=['P','I','I','I','I','I'], Bb=['P','P','P','P','P','I'];
  'GGATCC'.split('').forEach((ch,i)=>push(ch,Bt[i],Bb[i],{site:'BamHI',ri:i}));
  // 目標基因區塊
  colsArr.push({gene:true});
  // 區段D HindIII 復原位 AAGCTT：上股 I P P P P P，下股 I I I I I P（AGCT 突出錯位）
  const Dt=['I','P','P','P','P','P'], Db=['I','I','I','I','I','P'];
  'AAGCTT'.split('').forEach((ch,i)=>push(ch,Dt[i],Db[i],{site:'HindIII',ri:i}));
  // 區段E 質粒 GCA
  'GCA'.split('').forEach(ch=>push(ch,'P','P'));

  let bamX0=null, hindX0=null;
  colsArr.forEach(c=>{
    if(c.gene){
      cells+=`<rect x="${x}" y="${yArm}" width="${geneW}" height="${yArmB-yArm}" rx="5" fill="${GN}" opacity="0.16" stroke="${GN}" stroke-width="1.5"/>`;
      cells+=`<text x="${x+geneW/2}" y="${(yArm+yArmB)/2+5}" text-anchor="middle" font-size="13" font-weight="800" fill="${GN}">目標基因</text>`;
      bb+=`<line x1="${x}" y1="${yArm}" x2="${x+geneW}" y2="${yArm}" stroke="${GN}" stroke-width="2.5" stroke-linecap="round"/>`;
      bb+=`<line x1="${x}" y1="${yArmB}" x2="${x+geneW}" y2="${yArmB}" stroke="${GN}" stroke-width="2.5" stroke-linecap="round"/>`;
      x+=geneW; return;
    }
    if(c.site==='BamHI'&&c.ri===0) bamX0=x;
    if(c.site==='HindIII'&&c.ri===0) hindX0=x;
    const cx=x+cw/2;
    cells+=`<text x="${cx}" y="${yT}" text-anchor="middle" font-size="14" font-weight="700" font-family="Monaco,monospace" fill="${colOf(c.to)}">${c.t}</text>`;
    cells+=`<text x="${cx}" y="${yB}" text-anchor="middle" font-size="14" font-weight="700" font-family="Monaco,monospace" fill="${colOf(c.bo)}">${c.b}</text>`;
    bb+=`<line x1="${x}" y1="${yArm}" x2="${x+cw}" y2="${yArm}" stroke="${colOf(c.to)}" stroke-width="2.5" stroke-linecap="round"/>`;
    bb+=`<line x1="${x}" y1="${yArmB}" x2="${x+cw}" y2="${yArmB}" stroke="${colOf(c.bo)}" stroke-width="2.5" stroke-linecap="round"/>`;
    x+=cw;
  });

  /* 標籤 */
  labels+=`<text x="${14+1.5*cw}" y="${yLab}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${PL}">質粒DNA</text>`;
  labels+=`<text x="${bamX0+3*cw}" y="${yLab}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--sec)">BamHI</text>`;
  labels+=`<text x="${hindX0+3*cw}" y="${yLab}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--sec)">HindIII</text>`;
  labels+=`<text x="${hindX0+7.5*cw}" y="${yLab}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${PL}">質粒DNA</text>`;

  /* 錯位接點：上股切換點在 col1/2 之間，下股在 col5/6 之間（相差 4 鹼基突出）*/
  const nick=(nx,top)=>{const y=top?yArm:yArmB;
    return sealed
      ? `<circle cx="${nx}" cy="${y}" r="2.8" fill="var(--rop)"/>`
      : `<line x1="${nx}" y1="${y-5}" x2="${nx}" y2="${y+5}" stroke="var(--bad)" stroke-width="2.6"/>`;};
  marks+=nick(bamX0+cw,true)+nick(bamX0+5*cw,false);
  marks+=nick(hindX0+cw,true)+nick(hindX0+5*cw,false);

  const W=x+14;
  const ends=`<text x="8" y="${yT}" font-size="9" fill="var(--dim)">5'</text><text x="${W-6}" y="${yT}" font-size="9" fill="var(--dim)" text-anchor="end">3'</text><text x="8" y="${yB}" font-size="9" fill="var(--dim)">3'</text><text x="${W-6}" y="${yB}" font-size="9" fill="var(--dim)" text-anchor="end">5'</text>`;
  return `<svg class="bpsvg" viewBox="0 0 ${W} 116" width="${W}" style="max-width:100%">${labels}${bb}${cells}${marks}${ends}</svg>`;
}

/* Sequence panel */
function bases(str,col){return str.split('').map(t=>({t,c:col}));}
function seqRow(lab,arr){let s='';arr.forEach(x=>{s+=x.g?`<span class="geneblk">${x.g}</span>`:`<span class="b" style="color:${x.c}">${x.t}</span>`;});
  return `<div class="seqrow"><span class="lab">${lab}</span>${s}</div>`;}
function sequenceStrip(selected){
  selected=selected||[];
  const TET='var(--tet)', GN='var(--target)', HL='rgba(255,213,79,.5)';
  const sn=id=>ENZYMES.find(z=>z.id===id);

  /* 通用：自適應寬度的鹼基格 / 股 / 位點標籤（免左右捲動） */
  const fitCell=(c,which)=>{
    const ch=which==='t'?c.t:c.b;
    const cut=which==='t'?c.cutT:c.cutB;
    const sh=[];
    if(c.site)sh.push(`inset 0 -2px 0 ${c.c}`);
    if(cut)sh.push('inset 2px 0 0 var(--bad)');
    let st=`flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;height:20px;font-weight:700;color:${c.c}`;
    if(sh.length)st+=`;box-shadow:${sh.join(',')}`;
    if(c.site&&c.on)st+=`;background:${HL}`;
    return `<span style="${st}">${ch}</span>`;
  };
  const fitStrand=(cols,lab,which)=>`<div style="display:flex;align-items:center"><span class="lab">${lab}</span><div style="display:flex;flex:1;min-width:0;font-family:var(--mono);font-size:10px">${cols.map(c=>fitCell(c,which)).join('')}</div></div>`;
  const fitLabels=(cols,marks)=>{const total=cols.length;let lbl='';
    marks.forEach(m=>{const center=((m.start+m.len/2)/total*100).toFixed(2);
      lbl+=`<span style="position:absolute;left:${center}%;transform:translateX(-50%);font-size:8px;font-weight:${m.on?800:600};color:${m.e.col};white-space:nowrap;text-align:center;${m.on?'':'opacity:.55'}">${m.on?'▼':''}${m.e.name}</span>`;});
    return `<div style="display:flex;align-items:flex-end"><span class="lab"></span><div style="position:relative;flex:1;min-width:0;height:14px">${lbl}</div></div>`;};

  /* 質粒線性圖：含全部限制酶辨識位點（自適應，免捲動；鈍端上下股切於同位置） */
  const pCols=[], pMarks=[];
  const layoutP=['scai','aflIII','ecorv','bamhi','hindiii','ecori'];
  const spacers=['CAG','TCA','GTG','ATC','CAG','ATG','GCA'];
  const addPSp=seq=>seq.split('').forEach(ch=>pCols.push({t:ch,b:COMP[ch],c:TET}));
  addPSp(spacers[0]);
  layoutP.forEach((id,k)=>{
    const e=sn(id),on=selected.includes(id);
    pMarks.push({start:pCols.length,len:e.site.length,e,on});
    e.site.split('').forEach((ch,i)=>pCols.push({t:ch,b:COMP[ch],c:e.col,site:true,on,
      cutT:on&&i===e.topCut, cutB:on&&i===e.botCut}));
    addPSp(spacers[k+1]);
  });

  /* 目標基因：加長＋嵌入干擾酶切點（自適應一次顯示） */
  // ── 目標基因：加長 42 鹼基序列，含 EcoRI（黏端）與 EcoRV（鈍端）兩個內部干擾切點 ──
  // 完整序列：GGATCC-ATGCAG-GAATTC-TGCACT-GATATC-CGTTAG-AAGCTT
  const gSeqCols=[], gSiteMarks=[];
  const addGSite4=(e,inGene)=>{
    const on=selected.includes(e.id), start=gSeqCols.length;
    e.site.split('').forEach((ch,i)=>gSeqCols.push({
      t:ch, b:COMP[ch], col:e.col, on, inGene,
      cutT:on&&i===e.topCut, cutB:on&&i===e.botCut
    }));
    gSiteMarks.push({name:e.name,col:e.col,on,start,len:e.site.length,inGene,endType:e.endType});
  };
  const addGSeq4=seq=>seq.split('').forEach(ch=>
    gSeqCols.push({t:ch,b:COMP[ch],col:GN,inGene:true,on:false,cutT:false,cutB:false}));

  addGSite4(BAM, false);              // ▼ BamHI 左端（正確）
  addGSeq4('ATGCAG');
  addGSite4(sn('ecori'), true);       // ⚠ EcoRI 黏端，切點在基因內
  addGSeq4('TGCACT');
  addGSite4(sn('ecorv'), true);       // ⚠ EcoRV 鈍端，切點在基因內
  addGSeq4('CGTTAG');
  addGSite4(HIND, false);             // ▼ HindIII 右端（正確）

  const gTot4=gSeqCols.length;        // 42
  const gGS4=BAM.site.length, gGE4=gTot4-HIND.site.length;
  const pct4=n=>(n/gTot4*100).toFixed(2)+'%';

  // 酶名標籤列（▼ = 末端，⚠ = 基因內部）
  let gLbl4='';
  gSiteMarks.forEach(m=>{
    const cx=((m.start+m.len/2)/gTot4*100).toFixed(2)+'%';
    const icon=m.inGene?'':'';
    gLbl4+=`<span style="position:absolute;left:${cx};transform:translateX(-50%);font-size:8px;font-weight:${m.on?800:600};color:${m.col};opacity:${m.on?1:.55};white-space:nowrap">${icon}${m.name}</span>`;
  });
  const gLblRow4=`<div style="display:flex"><span style="width:20px;flex:0 0 auto"></span><div style="position:relative;flex:1;min-width:0;height:16px">${gLbl4}</div></div>`;

  // 自適應股渲染：基因區淺綠背景；選中高亮＋紅線切點
  const mkGStrand4=(which,lab,labEnd)=>{
    let cells='';
    gSeqCols.forEach(c=>{
      const ch=which==='t'?c.t:c.b, cut=which==='t'?c.cutT:c.cutB;
      const isSite=c.col!==GN;
      const bg=c.on?HL:c.inGene?'rgba(46,125,50,.09)':'';
      const sh=[];
      if(isSite) sh.push(`inset 0 -2px 0 ${c.col}`);
      if(cut) sh.push('inset 2px 0 0 var(--bad)');
      const shStr=sh.length?`;box-shadow:${sh.join(',')}`:''
      cells+=`<span style="flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;height:20px;font-weight:700;font-family:var(--mono);font-size:10px;color:${c.col}${bg?';background:'+bg:''}${shStr}">${ch}</span>`;
    });
    return `<div style="display:flex;align-items:center"><span style="width:20px;font-size:9px;color:var(--dim);flex:0 0 auto">${lab}</span><div style="display:flex;flex:1;min-width:0">${cells}</div><span style="font-size:9px;color:var(--dim);margin-left:3px">${labEnd}</span></div>`;
  };

  // 基因區域底條標示
  const geneBar4=`<div style="display:flex;align-items:center"><span style="width:20px;flex:0 0 auto"></span><div style="position:relative;flex:1;min-width:0;height:12px"><div style="position:absolute;left:${pct4(gGS4)};width:${pct4(gGE4-gGS4)};height:3px;top:6px;background:rgba(46,125,50,.35);border-radius:2px"></div><span style="position:absolute;left:${pct4(gGS4)};width:${pct4(gGE4-gGS4)};text-align:center;font-size:8px;color:var(--target);font-weight:700;top:0;overflow:hidden;white-space:nowrap">──目標基因（編碼區）──</span></div></div>`;

  const geneSeqBlock=gLblRow4+mkGStrand4('t',"5'","3'")+mkGStrand4('b',"3'","5'")+geneBar4;
  const anySel=selected.length>0;
  return `<div class="glass">
    <h2>DNA 序列 · 限制酶切點圖${anySel?'（已高亮所選切點）':''}</h2>
    <div style="font-size:11px;color:var(--sec)">質粒線性示意圖（標出各限制酶辨識位點；<b style="color:var(--bad)">紅線</b>＝所選酶將切割的位置）：</div>
    <div style="width:100%">${fitLabels(pCols,pMarks)}${fitStrand(pCols,'5\'','t')}${fitStrand(pCols,'3\'','b')}</div>
<div style="font-size:11px;color:var(--sec);margin-top:8px">目標基因序列：</div>
<div style="width:100%">${geneSeqBlock}</div>    <small class="note">點選左側酶可高亮辨識位點（黃底）並顯示切點（<b style="color:var(--bad)">紅線</b>）；鈍端酶上下兩股切於同一位置。</small></div>`;
}

function ecoli(col){return `<svg class="ecoli" viewBox="0 0 40 40"><ellipse cx="20" cy="20" rx="16" ry="10" fill="${col}" opacity=".22" stroke="${col}" stroke-width="1.5"/><circle cx="20" cy="20" r="4" fill="${col}"/></svg>`;}

const main=document.getElementById('main');
let suppressReplay=false;
function setMode(m){experimentState.mode=m;
  document.getElementById('mExplore').classList.toggle('active',m==='explore');
  document.getElementById('mReplay').classList.toggle('active',m==='replay');render();}
function goStage(n){experimentState.stage=n;render();}
function render(){
  document.querySelectorAll('.step').forEach(el=>{const s=+el.dataset.s;
    el.classList.toggle('active',s===experimentState.stage);el.classList.remove('done');
    if(s===1&&experimentState.plasmid.cut)el.classList.add('done');
    if(s===2&&experimentState.transformation.done)el.classList.add('done');
    if(s===3&&experimentState.quiz.complete)el.classList.add('done');});
  if(experimentState.stage===1)renderStage1();
  else if(experimentState.stage===2)renderStage2();
  else if(experimentState.stage===3)renderStage3();
  else renderSummary();
}
function toast(html,type='info',ms=3400){const t=document.createElement('div');
  t.className='toast feedback '+type;t.innerHTML=html;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.4s';setTimeout(()=>t.remove(),400);},ms);}

/* STAGE 1 */
function evaluateSelection(sel){
  if(sel.length===0) return{ok:false,type:'info',msg:'請選擇限制酶。'};
  if(sel.length===1) return{ok:false,type:'bad',
    msg:'只用一種酶時，目標基因兩端產生「相同」黏端，可能正向或反向插入（反向連接），且切開的質粒易自我黏合。\n定向選殖：請選擇「兩種不同」的酶。'};
  if(sel.length>2) return{ok:false,type:'bad',msg:'選擇過多。定向選殖只需在目標基因兩端各用一種酶，共兩種不同的酶。'};
  const set=new Set(sel);
  if(set.has('scai')) return{ok:false,type:'bad',msg:'❌ ScaI 切點在氨苄青黴素抗性基因內，會破壞 Amp 篩選標記，且為鈍端。'};
  if(set.has('aflIII')) return{ok:false,type:'bad',msg:'❌ AflIII 切點靠近複製起點，會破壞質粒複製能力。'};
  if(set.has('ecorv')) return{ok:false,type:'bad',msg:'❌ EcoRV 產生鈍端，無法與目標基因黏端互補，也無法控制方向（無法防反向連接）。'};
  if(set.has('bamhi')&&set.has('hindiii')) return{ok:true,type:'good',
    msg:'✅ 正確！目標基因左端 BamHI、右端 HindIII。以這兩種不同的酶同時切割：\n• 兩端黏端不同 → 只能單一方向插入（防反向連接）\n• 質粒兩端黏端不互補 → 難以自我黏合\n• 切點皆在四環素抗性基因內 → 插入失活，保留 Amp 與 ori'};
  return{ok:false,type:'bad',msg:'❌ 這兩種酶與目標基因兩端切點不符。\n本目標基因兩端分別為 BamHI 與 HindIII，必須使用相符的酶。'};
}
function renderStage1(){
  const P=experimentState.plasmid,cut=P.cut;
  main.innerHTML=`<div class="stage">
    <div class="col-vis">
      <div class="glass stagebox">
        <div class="scan"><div class="scanline"></div></div>
        <div id="plasmidHost" style="width:100%;height:100%;display:grid;place-items:center">${plasmidSVG({mode:cut?'gap':'sites',selected:P.selected})}</div>
      </div>
      ${sequenceStrip(P.selected)}
    </div>
    <div class="col-ctl">
      <div class="glass">
        <h2>選擇限制酶（點選＝高亮切點，不判定）</h2>
        <p>請選擇限制酶切割質粒並嘗試取得目標基因，按「確認選擇」才判定對錯。</p>
        <div class="enzyme" id="enzymeList">
          ${ENZYMES.map(e=>{const on=P.selected.includes(e.id);
            return `<button data-e="${e.id}" class="${cut?(on?'sel-good':''):(on?'sel':'')}">
              <span class="erow"><span class="swatch" style="background:${e.col}"></span>
              <span class="meta"><b>${e.name}</b><span class="tag">5'-${e.site}-3'　${e.endType==='sticky'?'黏端':'鈍端'}　切於${e.region==='tet'?'Tet基因':e.region==='amp'?'Amp基因':'ori附近'}</span></span>
              <span class="chk">${on?'☑':'☐'}</span></span>
              ${on?cutMini(e):''}</button>`;}).join('')}
        </div>
        <div style="margin-top:8px">
          <button class="btn confirm" id="confirmBtn" ${(P.selected.length===0||cut)?'disabled':''} onclick="confirmSelection()">✓ 確認選擇（已選 ${P.selected.length}）</button>
        </div>
      </div>
      <div id="fb1">${P.feedback?`<div class="feedback ${P.feedback.type}">${P.feedback.msg}</div>`:''}</div>
      <div class="glass"><div class="btnrow">
        <button class="btn ghost sm" onclick="replayStage1()">▶ 重播</button>
        <button class="btn danger sm" onclick="resetStage1()">↺ 重置</button>
      </div></div>
<div class="glass" id="next1Box" style="${cut?'position:sticky;bottom:0;z-index:5;box-shadow:0 -6px 14px rgba(244,246,249,.95)':'display:none'}">        <button class="btn primary" onclick="goStage(2)">步驟 2：連接與轉化 →</button>
      </div>
    </div>
  </div>`;
  document.querySelectorAll('#enzymeList button').forEach(b=>b.addEventListener('click',()=>chooseEnzyme(b.dataset.e)));
  if(experimentState.mode==='replay'&&!cut&&!suppressReplay)replayStage1();
}
function cutMini(e){let t='',b='';
  for(let i=0;i<6;i++){t+=`<span class="cb ${i===e.topCut?'cut':''}">${e.site[i]}</span>`;
    b+=`<span class="cb ${i===e.botCut?'cut':''}">${comp(e.site)[i]}</span>`;}
  const end=e.endType==='sticky'?`<div class="cend s">→ 黏端 5'-${e.overhang}（單股突出，可互補）</div>`:`<div class="cend bl">→ 鈍端（無突出，無法控制方向）</div>`;
  return `<div class="cutmini" style="color:${e.col}">
    <div class="cline"><span class="lb">5'</span>${t}<span class="lb">3'</span></div>
    <div class="cline"><span class="lb">3'</span>${b}<span class="lb">5'</span></div>
    ${end}<div class="cend bl">${e.note}</div></div>`;}
function chooseEnzyme(id){
  const P=experimentState.plasmid;if(P.cut)return;
  const i=P.selected.indexOf(id);
  if(i>=0)P.selected.splice(i,1);else P.selected.push(id);
  P.feedback=null;renderStage1();
}
function confirmSelection(){
  const P=experimentState.plasmid;if(P.cut)return;
  const res=evaluateSelection(P.selected);P.feedback=res;
  if(res.ok){P.cut=true;P.enzymes=['bamhi','hindiii'];experimentState.dnaFragments.targetReady=true;}
  renderStage1();
  if(res.ok&&experimentState.mode==='explore')toast('已用 BamHI + HindIII 雙酶切，兩端黏端不同 → 可定向插入。','good',3000);
}
function replayStage1(){
  const P=experimentState.plasmid;P.selected=['bamhi','hindiii'];P.cut=true;P.enzymes=['bamhi','hindiii'];
  P.feedback={ok:true,type:'good',msg:'▶ 重播：選 BamHI + HindIII，雙酶切於四環素抗性基因，產生兩種不同黏端。'};
  experimentState.dnaFragments.targetReady=true;renderStage1();
}
function resetStage1(){experimentState.plasmid={cut:false,selected:[],feedback:null,enzymes:null};
  experimentState.dnaFragments.targetReady=false;experimentState.ligation={inserted:false,ligated:false};suppressReplay=true;renderStage1();suppressReplay=false;}

function ligGapInner(){
  let s=plasmidInner('gap');
  s+=`<g id="targetChip" transform="translate(280,470)" style="cursor:grab;touch-action:none">
        <rect x="-66" y="-30" width="132" height="60" rx="8" fill="transparent"/>
        <rect x="-60" y="-17" width="120" height="34" rx="6" fill="var(--target)" opacity=".15" stroke="var(--target)" stroke-width="2"/>
        <text x="0" y="5" fill="var(--target)" font-size="13" font-weight="800" text-anchor="middle">目標基因 ▤</text>
        <text x="-46" y="-22" fill="var(--sec)" font-size="9" text-anchor="middle">BamHI端</text>
        <text x="46" y="-22" fill="var(--sec)" font-size="9" text-anchor="middle">HindIII端</text>
      </g>`;
  return s;
}
function junctionBlock(e,leftCol,rightCol,state){
  const top=e.site,bot=comp(e.site);let t='',h='',b='';
  for(let i=0;i<6;i++){
    const tc=i===0?leftCol:rightCol, bc=i<=4?leftCol:rightCol;
    const tn=(i===1&&state==='anneal')?'nick':(i===1&&state==='ligated')?'seal':'';
    const bn=(i===5&&state==='anneal')?'nick':(i===5&&state==='ligated')?'seal':'';
    const oh=(i>=1&&i<=4)?'oh':'';
    t+=`<span class="b ${tn} ${oh}" style="color:${tc}">${top[i]}</span>`;
    h+=`<span class="b">${(i>=1&&i<=4)?(state==='anneal'?'┊':'|'):''}</span>`;
    b+=`<span class="b ${bn} ${oh}" style="color:${bc}">${bot[i]}</span>`;
  }
  return `<div class="frag"><div class="jlab" style="color:var(--sec)">${e.name} 接點</div>
    <div class="seqrow">${t}</div><div class="seqrow hbrow">${h}</div><div class="seqrow">${b}</div></div>`;
}
function geneBlock3(){return `<div class="frag" style="border-style:solid;border-color:var(--target)">
  <div class="jlab" style="color:var(--target)">插入片段</div>
  <div class="seqrow"><span class="geneblk">目標基因</span></div>
  <div class="seqrow hbrow"></div><div class="seqrow"></div></div>`;}
function ohEnd(e,col){return `<span class="ohend" style="border-color:${col};color:${col}">5'-${e.overhang}<small>${e.name}</small></span>`;}
function apartSchematic(){
  return `<div class="seqwrap"><div style="font-size:12px;line-height:2.2;color:var(--sec)">
     <div><b style="color:var(--target)">目標基因：</b></div>
     <div class="afterwrap">${ohEnd(BAM,'var(--target)')}<span class="geneblk">目標基因</span>${ohEnd(HIND,'var(--target)')}</div>
     <div style="margin-top:6px"><b style="color:var(--tet)">質粒載體（已雙酶切）：</b></div>
     <div class="afterwrap"><span class="vecarm">載體</span>${ohEnd(BAM,'var(--tet)')}<span class="gap">┈缺口┈</span>${ohEnd(HIND,'var(--tet)')}<span class="vecarm">載體</span></div>
   </div><small class="note">BamHI黏端(GATC)只配BamHI；HindIII黏端(AGCT)只配HindIII → 只能單一方向插入。</small></div>`;}
function ligSeq(state){
  const note=state==='apart'?'黏端尚未接觸，等待互補配對':state==='anneal'?'互補鹼基以<b style="color:var(--amp)">氫鍵</b>配對：A=T（2 鍵）、G≡C（3 鍵）':'<b style="color:var(--rop)">DNA連接酶</b>以<b style="color:var(--rop)">磷酸二酯鍵</b>封閉骨架';
  const vis=`<div class="bpsim-wrap">${basePairSVG(state)}<small class="note" style="text-align:center">${note}</small></div>`;
  if(state==='apart')return vis+apartSchematic();
  const cap=state==='anneal'
    ?'黏端互補配對形成<b style="color:var(--amp)">氫鍵</b>（┊）；骨架仍有缺口（紅線）。'
    :'<b style="color:var(--rop)">DNA連接酶</b>形成<b style="color:var(--rop)">磷酸二酯鍵</b>（紫線），封閉骨架。';
  return vis+`<div class="seqwrap"><div class="seq afterwrap">
    ${junctionBlock(BAM,'var(--tet)','var(--target)',state)}${geneBlock3()}${junctionBlock(HIND,'var(--target)','var(--tet)',state)}
  </div><small class="note">${cap}</small></div>`;}
function updateLigStatus(){const el=document.getElementById('ligStatus');if(!el)return;const l=experimentState.ligation;
  el.innerHTML=`<div class="stat"><span>互補配對（氫鍵）</span><b style="color:${l.inserted?'var(--good)':'var(--dim)'}">${l.inserted?'已形成':'尚未'}</b></div>
    <div class="stat"><span>連接酶 · 磷酸二酯鍵</span><b style="color:${l.ligated?'var(--good)':'var(--dim)'}">${l.ligated?'已封閉':'尚未'}</b></div>
    <div class="stat"><span>插入方向</span><b style="color:${l.ligated?'var(--good)':'var(--dim)'}">${l.ligated?'單一方向':'—'}</b></div>`;}
function setupDrag(){
  const svg=document.getElementById('ligSVG'),chip=document.getElementById('targetChip');if(!chip)return;
  let dragging=false,moved=0,start={x:0,y:0},base={x:280,y:470},cur={x:280,y:470};
  const[tx,ty]=polar(CX,CY,R,(MCS_BAM+MCS_HIND)/2);
  function pt(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*560,y:(e.clientY-r.top)/r.height*540};}
  function down(e){if(experimentState.ligation.inserted)return;dragging=true;moved=0;chip.style.cursor='grabbing';start=pt(e);base={...cur};
    try{chip.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();}
  function move(e){if(!dragging)return;const p=pt(e);cur={x:base.x+(p.x-start.x),y:base.y+(p.y-start.y)};
    moved=Math.max(moved,Math.hypot(p.x-start.x,p.y-start.y));
    chip.setAttribute('transform',`translate(${cur.x},${cur.y})`);
    chip.style.opacity=Math.hypot(cur.x-tx,cur.y-ty)<60?'1':'.85';e.preventDefault();}
  function up(e){if(!dragging)return;dragging=false;chip.style.cursor='grab';
    if(moved<8){insertTarget();return;}
    if(Math.hypot(cur.x-tx,cur.y-ty)<70)insertTarget();
    else{cur={x:280,y:470};chip.setAttribute('transform','translate(280,470)');}}
  chip.addEventListener('pointerdown',down);
  chip.addEventListener('pointermove',move);
  chip.addEventListener('pointerup',up);
  chip.addEventListener('pointercancel',()=>{dragging=false;});
}
function insertTarget(){if(experimentState.ligation.inserted)return;experimentState.ligation.inserted=true;runLigationAnimation();}
function runLigationAnimation(){
  const fx=document.getElementById('ligFx'),fb=document.getElementById('fb2'),svg=document.getElementById('ligSVG'),sh=document.getElementById('ligSeqHost');
  const ib=document.getElementById('insertBtn');if(ib)ib.disabled=true;
  if(fb)fb.innerHTML=`<div class="feedback info">兩端黏端各自互補配對 → 形成<b>氫鍵</b>…（見配對模擬）</div>`;
  if(sh)sh.innerHTML=ligSeq('anneal');spawnParticles(fx);updateLigStatus();
  setTimeout(()=>{experimentState.ligation.ligated=true;
    if(svg)svg.innerHTML=plasmidInner('recombinant');if(sh)sh.innerHTML=ligSeq('ligated');updateLigStatus();
    if(fb)fb.innerHTML=`<div class="feedback good">✅ <b>DNA連接酶</b>於兩接點各形成<b>磷酸二酯鍵</b>。重組質粒完成！目標基因插入四環素抗性基因 → <b>插入失活</b>，方向固定。</div>`;
    const hb=document.getElementById('heatBtn');if(hb)hb.disabled=false;
    toast('插入失活：四環素抗性基因失去功能 → 不再抗四環素','info',2800);},1800);
}
function spawnParticles(host){if(!host)return;host.innerHTML='';
  for(let i=0;i<14;i++){const p=document.createElement('div');const ang=Math.random()*Math.PI*2,d=20+Math.random()*40;
    p.style.cssText=`position:absolute;left:50%;top:40%;width:6px;height:6px;border-radius:50%;background:var(--target);transition:1s cubic-bezier(.2,.8,.2,1);opacity:1;`;
    host.appendChild(p);requestAnimationFrame(()=>{p.style.transform=`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d}px)`;p.style.opacity='0';});}
  setTimeout(()=>{host.innerHTML='';},1100);}
function doHeatShock(){if(!experimentState.ligation.ligated){toast('請先完成DNA連接','bad');return;}
  experimentState.transformation.heatShock=true;experimentState.transformation.done=true;
  document.getElementById('transText').innerHTML='🔥 熱休克完成！重組質粒進入細胞。轉化後出現三種族群：';
  renderPopulations();document.getElementById('next2Box').style.display='';}
function renderPopulations(){const host=document.getElementById('popHost');if(!host)return;
  host.innerHTML=`<div class="popcards">
    <div class="popcard">${ecoli('var(--target)')}<div><b>重組質粒</b><div class="pheno">Amp：<span class="r">抗</span>　Tet：<span class="s">敏感（插入失活）</span></div></div></div>
    <div class="popcard">${ecoli('var(--amp)')}<div><b>重新環化載體（雙酶切下很少）</b><div class="pheno">Amp：<span class="r">抗</span>　Tet：<span class="r">抗</span></div></div></div>
    <div class="popcard">${ecoli('var(--dim)')}<div><b>無質粒細胞</b><div class="pheno">Amp：<span class="s">敏感</span>　Tet：<span class="s">敏感</span></div></div></div>
  </div>`;}
function resetStage2(){experimentState.ligation={inserted:false,ligated:false};
  experimentState.transformation.heatShock=false;experimentState.transformation.done=false;suppressReplay=true;renderStage2();suppressReplay=false;}
function replayStage2(){experimentState.ligation={inserted:true,ligated:true};
  experimentState.transformation.heatShock=true;experimentState.transformation.done=true;
  const svg=document.getElementById('ligSVG');if(svg)svg.innerHTML=plasmidInner('recombinant');
  const sh=document.getElementById('ligSeqHost');if(sh)sh.innerHTML=ligSeq('ligated');
  updateLigStatus();renderPopulations();const hb=document.getElementById('heatBtn');if(hb)hb.disabled=false;
  const ib=document.getElementById('insertBtn');if(ib)ib.disabled=true;
  document.getElementById('next2Box').style.display='';
  document.getElementById('fb2').innerHTML=`<div class="feedback good">▶ 重播：雙接點連接 → 重組質粒 → 轉化完成。</div>`;}

        <div class="plate-wrap"><div class="plate-label" style="color:var(--tet)">培養皿 B · 四環素</div><div class="plate-sub">影印培養（比對生長）</div>${petriSVG('B')}</div>

        <span><i class="dot" style="background:transparent;border:1px dashed var(--sec)"></i>B 上未生長</span>
      </div></div></div>
    <div class="col-ctl">
      <div class="glass"><h2>影印培養（絲絨蓋印）</h2>
        <p>用絲絨布從 A 蓋印至 B，保留菌落位置以比較生長差異。</p>
        <button class="btn warn" id="replicaBtn" ${rep.plated?'disabled':''} onclick="doReplica()">🧫 絲絨蓋印 A → B</button>
        <button class="btn ghost sm" id="onionBtn" style="margin-top:6px" ${rep.plated?'':'disabled'} onclick="toggleOnion()">${rep.onionSkin?'🔲 關閉重疊比對':'🔳 洋蔥皮重疊比對'}</button></div>
      <div class="glass" id="challengeBox" style="${rep.plated?'':'display:none'}">
        <h2>篩選挑戰</h2>
        <p>點 A 上菌落 → B 出現十字準星。選出所有<b>重組菌</b>（A 生長、B 不生長）。</p>
        <div class="stat"><span>分數</span><b>${q.score}</b></div>
        <div class="stat"><span>已找到重組菌</span><b>${q.found} / ${q.totalRecombinant}</b></div>
        <div class="stat"><span>準確率</span><b>${accuracy()}%</b></div>
      </div>
      <div id="fb3"></div>
      <div class="glass"><button class="btn danger sm" onclick="resetStage3()">↺ 重置此步</button></div>
      <div class="glass" id="next3Box" style="${q.complete?'':'display:none'}">
        <button class="btn primary" onclick="goStage(4)">查看實驗總結 ★ →</button>
      </div>
    </div></div>`;
  attachColonyEvents();
  if(experimentState.mode==='replay'&&!suppressReplay)replayStage3();
}
function accuracy(){const q=experimentState.quiz,j=q.found+q.mistakes;return j?Math.round(q.found/j*100):100;}
function petriSVG(which){
  const rep=experimentState.replica;let body='',hits='';
  experimentState.colonies.forEach(c=>{
    if(which==='A'){
      let fill='#8a9ab0';if(c.judged==='correct')fill='var(--target)';else if(c.judged==='wrong')fill='var(--bad)';
      body+=`<circle cx="${c.x}" cy="${c.y}" r="5.5" fill="${fill}" stroke="rgba(26,35,50,.3)" stroke-width="1" style="pointer-events:none"/>`;
      hits+=`<circle class="hitA" data-id="${c.id}" cx="${c.x}" cy="${c.y}" r="11" fill="transparent" style="cursor:pointer"/>`;
    }else{
      if(c.type==='self')
        body+=`<circle cx="${c.x}" cy="${c.y}" r="5.5" fill="#8a9ab0" stroke="rgba(26,35,50,.3)" stroke-width="1" style="pointer-events:none"/>`;
      else
        body+=`<circle cx="${c.x}" cy="${c.y}" r="5" fill="none" stroke="rgba(74,90,112,.45)" stroke-width="1.2" stroke-dasharray="2 2" style="pointer-events:none"/>`;
    }
  });
  let cross='';
  if(which==='B'&&experimentState._focus!=null){const c=experimentState.colonies.find(x=>x.id===experimentState._focus);
    if(c){const col=c.type==='self'?'var(--warn)':'var(--bad)';
      cross=`<g style="pointer-events:none"><line x1="${c.x-16}" y1="${c.y}" x2="${c.x+16}" y2="${c.y}" stroke="${col}" stroke-width="1.6"/>
      <line x1="${c.x}" y1="${c.y-16}" x2="${c.x}" y2="${c.y+16}" stroke="${col}" stroke-width="1.6"/>
      <circle cx="${c.x}" cy="${c.y}" r="11" fill="none" stroke="${col}" stroke-width="1.6"/>
      <text x="${c.x}" y="${c.y-19}" fill="${col}" font-size="9" text-anchor="middle">${c.type==='self'?'有生長':'無生長'}</text></g>`;}}
  const ring=which==='A'?'var(--amp)':'var(--tet)';
  const overlay=(which==='B'&&rep.onionSkin)?(()=>{let s='<g opacity="0.45" style="pointer-events:none">';experimentState.colonies.forEach(c=>{s+=`<circle cx="${c.x}" cy="${c.y}" r="5.5" fill="none" stroke="var(--amp)" stroke-width="1" stroke-dasharray="2 2"/>`;});return s+'</g>';})():'';
  return `<svg class="petri" viewBox="0 0 200 200" data-petri="${which}">
    <circle cx="100" cy="100" r="94" fill="#eaf2ec" style="pointer-events:none"/>
    <circle cx="100" cy="100" r="94" fill="none" stroke="${ring}" stroke-width="3" style="pointer-events:none"/>
    <circle cx="100" cy="100" r="86" fill="rgba(0,0,0,.02)" style="pointer-events:none"/>
    ${overlay}${body}${cross}
    <g class="velvet" opacity="0" style="pointer-events:none"><circle cx="100" cy="100" r="80" fill="rgba(94,53,177,.14)" stroke="var(--ori)" stroke-width="2"/>
      <text x="100" y="104" fill="var(--ori)" font-size="11" text-anchor="middle">絲絨</text></g>
    ${hits}</svg>`;
}
function doReplica(){experimentState.replica.plated=true;
  const v=document.querySelectorAll('.velvet');v.forEach(x=>{x.style.transition='opacity .5s';x.setAttribute('opacity','0.9');});
  setTimeout(()=>{v.forEach(x=>x.setAttribute('opacity','0'));
    renderStage3();
    const fb=document.getElementById('fb3');if(fb)fb.innerHTML=`<div class="feedback info">蓋印完成，菌落位置已對應。
A（Amp）：所有帶質粒的菌皆生長。
B（Tet）：只有抗 Tet 的背景菌生長，<b>重組菌不生長</b>（虛線圈＝原位置但未長）。</div>`;
  },900);}
function toggleOnion(){experimentState.replica.onionSkin=!experimentState.replica.onionSkin;renderStage3();}
function attachColonyEvents(){
  document.querySelectorAll('.hitA').forEach(c=>{
    c.addEventListener('click',ev=>{ev.stopPropagation();colonyTap(+c.dataset.id);});
  });
}
function colonyTap(id){
  if(!experimentState.replica.plated){toast('請先完成絲絨蓋印 A → B','bad');return;}
  const c=experimentState.colonies.find(x=>x.id===id);experimentState._focus=id;
  const q=experimentState.quiz;
  if(c.judged){renderStage3();return;}
  let msg;
  if(c.type==='recombinant'){c.judged='correct';q.score+=10;q.found++;
    msg=`<div class="feedback good">正確！抗 Amp 但因插入失活而不抗 Tet → 重組成功細菌。</div>`;}
  else{c.judged='wrong';q.score=Math.max(0,q.score-5);q.mistakes++;
    msg=`<div class="feedback bad">錯誤！此菌可在 Tet 下生長 → 四環素抗性基因完整 → 非重組（背景）菌。</div>`;
    if(q.mistakes>=2&&!q.hintShown){q.hintShown=true;
      setTimeout(()=>toast('💡 目標基因插入四環素抗性基因後該基因失活 → 重組菌在 Tet 上不會生長。','info',4500),300);}}
  if(q.found>=q.totalRecombinant){q.complete=true;}
  renderStage3();
  const fb=document.getElementById('fb3');if(fb)fb.innerHTML=msg;
  if(q.complete)setTimeout(()=>toast('🎉 已找出所有重組菌！可進入總結。','good',3000),150);
}
function resetStage3(){experimentState.replica={plated:false,onionSkin:false};
  experimentState.colonies.forEach(c=>c.judged=null);experimentState._focus=null;
  experimentState.quiz={score:0,mistakes:0,totalRecombinant:experimentState.quiz.totalRecombinant,found:0,hintShown:false,complete:false};suppressReplay=true;renderStage3();suppressReplay=false;}
function replayStage3(){experimentState.replica.plated=true;
  experimentState.colonies.forEach(c=>c.judged=c.type==='recombinant'?'correct':null);
  const q=experimentState.quiz;q.found=q.totalRecombinant;q.score=q.found*10;q.mistakes=0;q.complete=true;
  const save=experimentState.mode;experimentState.mode='explore';renderStage3();experimentState.mode=save;
  const fb=document.getElementById('fb3');if(fb)fb.innerHTML=`<div class="feedback good">▶ 重播：所有重組菌已標示。</div>`;}

/* SUMMARY */
function renderSummary(){
  const q=experimentState.quiz;
  main.innerHTML=`<div class="stage">
    <div class="col-vis"><div class="glass" style="overflow:auto"><h2>實驗總結</h2>
      <div style="text-align:center">${plasmidSVG({mode:'recombinant'})}</div>
      <table class="cmp">
        <tr><th>菌株</th><th>Amp</th><th>Tet</th><th>重組</th></tr>
        <tr><td>重組菌</td><td class="yes">✓</td><td class="no">✗</td><td class="yes">✓</td></tr>
        <tr><td>重新環化載體</td><td class="yes">✓</td><td class="yes">✓</td><td class="no">✗</td></tr>
        <tr><td>無質粒</td><td class="no">✗</td><td class="no">✗</td><td class="no">✗</td></tr>
      </table>
      <p>成績：分數 <b style="color:var(--amp);font-family:var(--mono)">${q.score}</b>　準確率 <b style="color:var(--amp);font-family:var(--mono)">${accuracy()}%</b></p>
    </div></div>
    <div class="col-ctl">
      <div class="glass"><h2>關鍵問題解析</h2>
        <p><b>1. 為何用兩種不同的酶（定向選殖）？</b><br>目標基因左 BamHI、右 HindIII，兩端黏端不同：① 只能單一方向插入，防反向連接；② 載體兩端黏端不互補，難自我黏合，降低背景。</p>
        <p><b>2. 為何先用 Amp 篩選？</b><br>帶質粒者保留完整 Amp 抗性可生長，無質粒被淘汰。</p>
        <p><b>3. 為何影印培養？</b><br>絲絨蓋印保留菌落位置，使 A、B 同座標對應同菌落，便於比較 Amp/Tet 生長差異。</p>
        <p><b>4. 插入失活如何篩選？</b><br>兩切點皆在 Tet 基因內，插入後失活；重組菌 Tet 不生長：A 長、B 不長者即為重組菌。</p>
        <p><b>5. 應用：</b>胰島素生產、基因治療、疫苗、基因工程作物。</p>
      </div>
      <div class="glass"><div class="btnrow">
        <button class="btn danger sm" onclick="goStage(1)">↺ 重新實驗</button>
        <button class="btn primary sm" onclick="goStage(3)">← 回篩選</button>
      </div></div>
    </div></div>`;
}
render();
</script>
</body>
</html>
