<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>人體水份調節互動模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            font-family: 'Noto Sans TC', sans-serif;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
        }
        .glass {
            background: rgba(255,255,255,0.80);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
        }
        @keyframes flow { 0%{stroke-dashoffset:28} 100%{stroke-dashoffset:0} }
        .blood-flow { stroke-dasharray:8,6; animation:flow 1.8s linear infinite; }
        @keyframes pulseglow {
            0%,100%{ filter:drop-shadow(0 0 4px rgba(59,130,246,.8)); }
            50%{ filter:drop-shadow(0 0 16px rgba(59,130,246,1)); }
        }
        .adh-glow { animation:pulseglow 1.8s ease-in-out infinite; }
        input[type=range]{ cursor:pointer; }
    </style>
</head>
<body class="p-2 flex flex-col text-slate-800" style="height:100vh;">

<header class="flex-shrink-0 mb-1.5">
    <h1 class="text-base font-bold text-slate-900 flex items-center gap-2">
        <span class="text-blue-600 text-lg">💧</span>人體水份調節與滲透調節模擬器
    </h1>
    <p class="text-[10px] text-slate-500 mt-0.5">腎臟和水份調節 - HinHin Biology</p>
</header>

<div class="flex-1 grid gap-2 min-h-0 overflow-hidden" style="grid-template-columns:5fr 7fr;">

    <!-- ═════ LEFT PANEL ═════ -->
    <div class="flex flex-col gap-2 min-h-0 overflow-hidden">
        <div class="glass rounded-xl shadow-md flex-shrink-0 p-2.5">
            <h2 class="text-xs font-bold text-slate-800 border-b border-slate-200 pb-1 mb-2">⚙️ 生理參數輸入</h2>
            <div class="mb-1.5">
                <div class="flex justify-between items-center mb-0.5">
                    <label class="text-xs font-medium text-slate-700">水分攝取量</label>
                    <span class="text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded-full text-[11px]" id="val-water">1.2 升</span>
                </div>
                <input type="range" id="input-water" min="0" max="3" step="0.1" value="1.2" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-blue-600">
                <div class="flex justify-between text-[9px] text-slate-400 mt-0.5"><span>0升 缺水</span><span>1.5升 適中</span><span>3升 過多</span></div>
            </div>
            <div class="mb-1.5">
                <div class="flex justify-between items-center mb-0.5">
                    <label class="text-xs font-medium text-slate-700">排汗量</label>
                    <span class="text-orange-600 font-bold bg-orange-50 px-2 py-0.5 rounded-full text-[11px]" id="val-sweat">正常狀態</span>
                </div>
                <input type="range" id="input-sweat" min="0" max="2" step="1" value="0" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-orange-500">
                <div class="flex justify-between text-[9px] text-slate-400 mt-0.5"><span>正常靜止</span><span>運動出汗</span><span>高溫多汗 🔥</span></div>
            </div>
            <div class="mb-1.5">
                <div class="flex justify-between items-center mb-0.5">
                    <label class="text-xs font-medium text-slate-700">咖啡因攝入</label>
                    <span class="text-amber-700 font-bold bg-amber-50 px-2 py-0.5 rounded-full text-[11px]" id="val-caffeine">無</span>
                </div>
                <input type="range" id="input-caffeine" min="0" max="2" step="1" value="0" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-amber-700">
                <div class="flex justify-between text-[9px] text-slate-400 mt-0.5"><span>無</span><span>輕度 ☕</span><span>高度 ☕☕</span></div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-0.5">
                    <label class="text-xs font-medium text-slate-700">酒精攝入</label>
                    <span class="text-purple-600 font-bold bg-purple-50 px-2 py-0.5 rounded-full text-[11px]" id="val-alcohol">無</span>
                </div>
                <input type="range" id="input-alcohol" min="0" max="2" step="1" value="0" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-purple-600">
                <div class="flex justify-between text-[9px] text-slate-400 mt-0.5"><span>無</span><span>微醺 🍺</span><span>酩酊 🍺🍺</span></div>
            </div>
        </div>

        <div class="glass rounded-xl shadow-md flex-1 min-h-0 overflow-hidden flex flex-col p-2.5">
            <h2 class="text-xs font-bold text-slate-800 border-b border-slate-200 pb-1 mb-2 flex-shrink-0">📊 體內核心生理指標</h2>
            <div class="mb-2 flex-shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-medium text-slate-700">血液水勢</span>
                    <span id="status-wp" class="text-xs font-bold text-emerald-600">正常</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-3.5 relative overflow-hidden">
                    <div id="bar-wp" class="h-3.5 bg-emerald-500 transition-all duration-500" style="width:50%"></div>
                    <div class="absolute inset-0 flex justify-between px-2 text-[8px] text-slate-600 font-bold items-center pointer-events-none">
                        <span>↓ 脫水</span><span>正常</span><span>↑ 過高</span>
                    </div>
                </div>
            </div>
            <div class="p-1.5 rounded-lg mb-2 text-[11px] font-medium transition-all duration-300 flex-shrink-0" id="box-osmoreceptor">
                🧠 下丘腦滲壓感受器：<span id="text-osmoreceptor">偵測中...</span>
            </div>
            <div class="mb-2 flex-shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-medium text-slate-700">垂體釋放抗利尿激素（ADH）</span>
                    <span id="val-adh" class="text-xs font-bold text-blue-600">50%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5">
                    <div id="bar-adh" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width:50%"></div>
                </div>
            </div>
            <div class="flex items-start gap-3 mb-2 flex-shrink-0">
                <div class="relative border-4 border-slate-400 border-t-0 rounded-b-xl flex items-end overflow-hidden bg-slate-50/50 shadow-inner flex-shrink-0" style="width:46px;height:62px;">
                    <div id="urine-fluid" class="w-full transition-all duration-500 ease-out" style="height:40%;background-color:#FFFBE6"></div>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[11px] font-bold text-slate-700 mb-0.5">尿液輸出狀態</p>
                    <p class="text-[11px] text-slate-600">排出量：<span id="urine-volume-txt" class="font-bold text-slate-800">正常</span></p>
                    <p class="text-[11px] text-slate-600">濃縮度：<span id="urine-conc-txt" class="font-bold text-slate-800">正常</span></p>
                </div>
            </div>
            <div class="flex-1 min-h-0 flex flex-col overflow-hidden">
                <h3 class="text-[11px] font-bold text-slate-800 mb-1 flex-shrink-0">🧠 當前生理協調狀態</h3>
                <div id="explanation-box" class="flex-1 text-[10px] leading-relaxed text-slate-700 bg-white/60 p-2 rounded-lg border border-slate-200 overflow-y-auto">計算中...</div>
            </div>
        </div>
    </div>

<script>
const inputWater    = document.getElementById('input-water');
const inputSweat    = document.getElementById('input-sweat');
const inputCaffeine = document.getElementById('input-caffeine');
const inputAlcohol  = document.getElementById('input-alcohol');
const valWater      = document.getElementById('val-water');
const valSweat      = document.getElementById('val-sweat');
const valCaffeine   = document.getElementById('val-caffeine');
const valAlcohol    = document.getElementById('val-alcohol');
const statusWp      = document.getElementById('status-wp');
const barWp         = document.getElementById('bar-wp');
const boxOsmo       = document.getElementById('box-osmoreceptor');
const txtOsmo       = document.getElementById('text-osmoreceptor');
const valAdh        = document.getElementById('val-adh');
const barAdh        = document.getElementById('bar-adh');
const urineFluid    = document.getElementById('urine-fluid');
const urineVolTxt   = document.getElementById('urine-volume-txt');
const urineConcTxt  = document.getElementById('urine-conc-txt');
const explainBox    = document.getElementById('explanation-box');
const dctTube       = document.getElementById('dct-tube');
const cdTube        = document.getElementById('cd-tube');
const microSvg      = document.getElementById('micro-svg');

const sweatMap   = ["正常狀態","運動出汗","高溫多汗 🔥"];
const cafMap     = ["無","輕度 ☕","高度 ☕☕"];
const alcMap     = ["無","微醺 🍺","酩酊 🍺🍺"];

/* ADH-dependent water molecules */
const adhMolDefs = [
    { x0:516, y0:88,  ex:  0, ey:110, dur:2300, delay:   0 },
    { x0:640, y0:88,  ex:  0, ey:126, dur:2300, delay: 767 },
    { x0:712, y0:248, ex:-26, ey:  0, dur:2300, delay:   0 },
    { x0:712, y0:365, ex:-26, ey:  0, dur:2300, delay: 767 },
    { x0:712, y0:460, ex:-26, ey:  0, dur:2300, delay:1534 },
];
let adhActive   = false;
let animStartTs = null;
const ns = 'http://www.w3.org/2000/svg';
const adhElems = adhMolDefs.map(() => {
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('opacity','0');
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('r','5.5'); c.setAttribute('fill','#60A5FA');
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x','8'); t.setAttribute('y','4');
    t.setAttribute('font-size','8'); t.setAttribute('fill','#1D4ED8');
    t.setAttribute('font-weight','bold'); t.textContent='H₂O';
    g.appendChild(c); g.appendChild(t);
    microSvg.appendChild(g);
    return g;
});
function animFrame(ts) {
    if (!animStartTs) animStartTs = ts;
    const elapsed = ts - animStartTs;
    adhMolDefs.forEach((m, i) => {
        const el = adhElems[i];
        if (!adhActive) { el.setAttribute('opacity','0'); return; }
        const cycle = ((elapsed + m.delay) % m.dur + m.dur) % m.dur;
        const prog  = cycle / m.dur;
        let opacity;
        if      (prog < 0.10) opacity = prog / 0.10;
        else if (prog > 0.80) opacity = (1 - prog) / 0.20;
        else                  opacity = 1;
        el.setAttribute('transform', `translate(${m.x0 + m.ex * prog},${m.y0 + m.ey * prog})`);
        el.setAttribute('opacity', opacity.toFixed(3));
    });
    requestAnimationFrame(animFrame);
}
requestAnimationFrame(animFrame);

function switchTab(tab) {
    const macroTab = document.getElementById('tab-macro');
    const microTab = document.getElementById('tab-micro');
    const macroBtn = document.getElementById('tab-macro-btn');
    const microBtn = document.getElementById('tab-micro-btn');
    const on  = "flex-1 py-2 px-2 text-[11px] font-bold text-blue-600 border-b-2 border-blue-600 transition-all focus:outline-none";
    const off = "flex-1 py-2 px-2 text-[11px] font-bold text-slate-500 hover:text-slate-700 transition-all focus:outline-none";
    if (tab === 'macro') {
        macroTab.style.display = 'flex'; microTab.style.display = 'none';
        macroBtn.className = on; microBtn.className = off;
    } else {
        macroTab.style.display = 'none'; microTab.style.display = 'flex';
        macroBtn.className = off; microBtn.className = on;
    }
}

function updateSimulation() {
    const water    = parseFloat(inputWater.value);
    const sweat    = parseInt(inputSweat.value);
    const caffeine = parseInt(inputCaffeine.value);
    const alcohol  = parseInt(inputAlcohol.value);
    valWater.innerText    = `${water.toFixed(1)} 升`;
    valSweat.innerText    = sweatMap[sweat];
    valCaffeine.innerText = cafMap[caffeine];
    valAlcohol.innerText  = alcMap[alcohol];

    let wp = 100 + (water - 1.2)*35 - sweat*25 - caffeine*3 - alcohol*5;
    wp = Math.max(20, Math.min(180, wp));
    barWp.style.width = `${((wp-20)/160)*100}%`;

    const baseClass = "p-1.5 rounded-lg mb-2 text-[11px] font-medium transition-all duration-300 flex-shrink-0 ";
    if (wp < 85) {
        statusWp.className = "text-xs font-bold text-red-600";
        statusWp.innerText = `偏低（脫水 ${Math.round(wp)}）`;
        barWp.className    = "h-3.5 bg-red-500 transition-all duration-500";
        boxOsmo.className  = baseClass + "bg-red-50 text-red-700 border border-red-200 animate-pulse";
        txtOsmo.innerText  = "刺激！偵測到細胞外液水勢過低（滲透壓升高）。";
    } else if (wp > 115) {
        statusWp.className = "text-xs font-bold text-blue-500";
        statusWp.innerText = `過高（水份過剩 ${Math.round(wp)}）`;
        barWp.className    = "h-3.5 bg-cyan-400 transition-all duration-500";
        boxOsmo.className  = baseClass + "bg-blue-50 text-blue-700 border border-blue-200";
        txtOsmo.innerText  = "抑制！偵測到細胞外液水勢過高（滲透壓降低）。";
    } else {
        statusWp.className = "text-xs font-bold text-emerald-600";
        statusWp.innerText = `正常（${Math.round(wp)}）`;
        barWp.className    = "h-3.5 bg-emerald-500 transition-all duration-500";
        boxOsmo.className  = baseClass + "bg-emerald-50 text-emerald-700 border border-emerald-200";
        txtOsmo.innerText  = "正常。細胞外液滲透壓維持穩態。";
    }

    let baseAdh = wp < 110 ? (110 - wp)*1.4 : 5;
    baseAdh = Math.max(5, Math.min(100, baseAdh));
    const alcMult  = alcohol===1 ? 0.4 : alcohol===2 ? 0.15 : 1.0;
    const finalAdh = baseAdh * alcMult;
    valAdh.innerText   = `${Math.round(finalAdh)}%`;
    barAdh.style.width = `${finalAdh}%`;

    adhActive = finalAdh > 40;
    if (adhActive) {
        dctTube.setAttribute('stroke','#3B82F6');
        cdTube.setAttribute('stroke','#3B82F6');
        dctTube.classList.add('adh-glow');
        cdTube.classList.add('adh-glow');
    } else {
        dctTube.setAttribute('stroke','#D97706');
        cdTube.setAttribute('stroke','#D97706');
        dctTube.classList.remove('adh-glow');
        cdTube.classList.remove('adh-glow');
    }

    const rr  = finalAdh / 100;
    const raw = (3.5 - rr*2.8) * (1 + caffeine*0.3) * (water/1.2);
    const bh  = Math.max(10, Math.min(98, raw*25));
    urineFluid.style.height = `${bh}%`;
    if (bh < 25) {
        urineFluid.style.backgroundColor = "#E6A23C";
        urineVolTxt.innerText  = "極少（濃縮）";
        urineConcTxt.innerText = "極高";
    } else if (bh < 55) {
        urineFluid.style.backgroundColor = "#FCD34D";
        urineVolTxt.innerText  = "正常";
        urineConcTxt.innerText = "正常";
    } else {
        urineFluid.style.backgroundColor = bh>75 ? "#FEFCE8" : "#FAF0A3";
        urineVolTxt.innerText  = "大量（稀釋）";
        urineConcTxt.innerText = "極低";
    }

    let html = "";
    if (alcohol > 0 && wp < 85) {
        html = `<strong class="text-red-600">🚨 脫水危險：</strong>排汗使血液水勢極低，本應大量釋放ADH，但<span class="bg-purple-100 px-1 font-bold text-purple-700 rounded">酒精抑制垂體</span>，ADH僅剩${Math.round(finalAdh)}%，大量稀釋尿排出，<strong>持續脫水！</strong>`;
    } else if (wp < 85) {
        html = `<strong class="text-amber-600">⚠️ 負反饋代償：</strong>血液水勢偏低，下丘腦滲壓感受器活化，<strong class="text-blue-600">垂體後葉大量釋放ADH（${Math.round(finalAdh)}%）</strong>，遠曲小管與集尿管水通道蛋白開啟，排出少量濃縮尿。`;
    } else if (wp > 115) {
        html = `<strong class="text-cyan-600">🌊 排除多餘水分：</strong>大量飲水使水勢升高，<strong class="text-slate-500">ADH分泌抑制</strong>，集尿管透性降低，排出大量稀釋尿液恢復穩態。`;
    } else {
        html = `<strong class="text-emerald-600">✅ 生理穩態正常：</strong>水分攝取與流失平衡，ADH分泌適中（${Math.round(finalAdh)}%），腎小管正常水分重吸收，尿液量與濃度均正常。`;
    }
    if (caffeine > 0) html += ` <span class="text-amber-700">（咖啡因：腎小球濾過率↑，尿量增加。）</span>`;
    explainBox.innerHTML = html;
}

['input-water','input-sweat','input-caffeine','input-alcohol'].forEach(id =>
    document.getElementById(id).addEventListener('input', updateSimulation)
);
window.onload = updateSimulation;
</script>
</body>
</html>
