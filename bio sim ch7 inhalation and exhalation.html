<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呼吸模擬器 — HinHin Biology</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
  
  :root {
    /* Scientific Laboratory Dashboard / Precision Instrument Palette */
    --bg: #f4f6f9;
    --surface: #ffffff;
    --border: #d4dbe6;
    
    /* Text Colors */
    --text: #1a2332;
    --text-dim: #4a5a70;
    --label: #8a9ab0;
    
    /* Semantic Accents */
    --inhale: #1976d2; /* Primary Cyan */
    --exhale: #e65100; /* Warning Amber */
    --pressure-line: #c62828; /* Danger/Reset Rose */
    --volume-line: #1976d2; /* Primary Cyan */
    
    /* Auto Toggle States */
    --auto: #5e35b1; /* Special Violet */
    --auto-active: #2e7d32; /* Success/Energy Green */
    --auto-paused: #c62828; /* Rose */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  header {
    background: var(--surface);
    text-align: center;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  header p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  .models-row {
    display: flex;
    gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .model-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
    position: relative;
  }

  .model-panel:first-child {
    border-right: 1px solid var(--border);
  }

  .model-title {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
    background: var(--bg);
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 20px;
  }  

  /* Enclosing the SVGs in dark scientific chambers preserves the contrast 
     for the light-colored dynamically injected JS text overlays. */
  #bell-jar-svg, #ribcage-svg {
    width: 100%;
    max-width: 250px;
    height: auto;
    overflow: visible;
    background: #0f151c;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
  }

  .charts-row {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 16px;
    gap: 12px;
    background: var(--bg);
  }

  .chart-container {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }

  .chart-title {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }

  .chart-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    display: inline-block;
    flex-shrink: 0;
  }

  /* Dark oscilloscope aesthetic preserves visibility of the white grid/text drawn by JS */
  canvas.chart {
    width: 100%;
    flex: 1;
    min-height: 85px;
    max-height: 120px;
    display: block;
    background: #0f151c;
    border-radius: 4px;
    border: 1px solid #2a3746;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .btn {
    flex: 1;
    max-width: 180px;
    padding: 12px 0;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    text-transform: uppercase;
    border: 1px solid transparent;
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn-inhale {
    background: var(--inhale);
    color: #ffffff;
    border-color: #115293;
  }
  .btn-inhale:hover { filter: brightness(1.1); }

  .btn-exhale {
    background: var(--exhale);
    color: #ffffff;
    border-color: #b33e00;
  }
  .btn-exhale:hover { filter: brightness(1.1); }

  .btn-auto {
    background: var(--auto);
    color: #ffffff;
    border-color: #4527a0;
  }
  .btn-auto:hover { filter: brightness(1.1); }
  
  .btn-auto.is-auto {
    background: var(--auto-active);
    border-color: #1b5e20;
  }
  .btn-auto.is-paused {
    background: var(--auto-paused);
    border-color: #b71c1c;
  }

  .phase-bar {
    height: 4px;
    background: var(--border);
    margin: 16px 20px 0;
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .phase-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width 0.05s linear, background 0.3s;
  }

  /* Digital readout styling ensures JS inline colors stand out with absolute high contrast */
  .state-lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-top: 16px;
    background: #0f151c;
    padding: 6px 16px;
    border-radius: 4px;
    border: 1px solid #2a3746;
  }

  /* Airflow particle animations */
  .air-particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
  }
  @keyframes inhale-particle {
    0% { opacity: 0; transform: translateY(-18px) scale(0.5); }
    20% { opacity: 0.85; }
    80% { opacity: 0.65; }
    100% { opacity: 0; transform: translateY(22px) scale(1.4); }
  }
  @keyframes exhale-particle {
    0% { opacity: 0; transform: translateY(22px) scale(1.4); }
    20% { opacity: 0.85; }
    80% { opacity: 0.65; }
    100% { opacity: 0; transform: translateY(-18px) scale(0.5); }
  }
</style>

<script>
// ── Physical model ──────────────────────────────────────────────────────────
//
// CORRECT LUNG PRESSURE PHYSIOLOGY:
//
//  Lungs are NOT a sealed container — they are open to the airway.
//  Pressure deviation is caused by volume CHANGING (air flowing), not by
//  the absolute volume at any moment.
//
//  Key rule:
//    • Volume increasing (inhale active) → P < Patm  (air flows IN)
//    • Volume decreasing (exhale active) → P > Patm  (air flows OUT)
//    • Volume NOT changing (at max/min, or rest)  → P = Patm  ✓
//
//  This is consistent with respiratory physiology:
//    - Inspiratory phase: diaphragm contracts → thorax expands → P drops
//      → air flows in until P = Patm (end of inspiration)
//    - Expiratory phase: muscles relax → thorax recoils → P rises
//      → air flows out until P = Patm (end of expiration)
//    - At end-inspiration (V_max) or end-expiration (V_min), airflow = 0
//      → P = Patm.
//
//  Implementation:
//    pressure = ATMOS + K × (dV/dt)
//    where dV/dt > 0 during inhale, < 0 during exhale, 0 when stopped.
//    K is a gain constant scaled for clear teaching visibility (±4 mmHg).
//
//  This gives exactly the correct qualitative AND quantitative behaviour:
//    inhale active   → P = 756 mmHg  (−4 from atmos)
//    exhale active   → P = 764 mmHg  (+4 from atmos)
//    volume at max/min or rest → dV/dt = 0 → P = 760 mmHg ✓
//
const ATMOS = 760;
const VOL_REST = 0.50, VOL_MAX = 0.95, VOL_MIN = 0.10;
const PRESS_DELTA = 4.0;   // mmHg peak deviation (enlarged for teaching clarity)
const P_AX_MIN = ATMOS - PRESS_DELTA - 0.5;
const P_AX_MAX = ATMOS + PRESS_DELTA + 0.5;

// ── Breathing is driven by a continuous phase angle θ (radians) ────────────
//
// Volume follows a sine:   V(θ) = V_rest + A·sin(θ)
//   θ increasing → inhale half-cycle (V rises toward V_max)
//   θ decreasing → exhale half-cycle (V falls toward V_min)
//
// dV/dt = A·cos(θ)·(dθ/dt)
//   → pressure naturally forms a cosine/sine wave, smooth at all transitions.
//   → at θ = ±π/2 (volume extremes) cos(θ)=0 → dV/dt=0 → P=Patm ✓
//   → at θ = 0 (rest) sin(θ)=0 → V=V_rest, and cos(θ)=1 → peak dV/dt ✓
//
// θ range: −π/2 (full exhale, V_min) … 0 (rest) … +π/2 (full inhale, V_max)
// Amplitude A chosen so: V_rest + A = V_max  →  A = V_max − V_rest
//
// dθ/dt is controlled by the user:
//   inhale  →  dθ/dt = +OMEGA  (θ advances toward +π/2)
//   exhale  →  dθ/dt = −OMEGA  (θ retreats toward −π/2)
//   rest    →  dθ/dt = 0; θ glides back to 0 smoothly, pressure tracks cos(θ)
//
// Because pressure = ATMOS − PRESS_DELTA·cos(θ)·sign(dθ/dt)  (while active)
// and rest glides θ→0 via exponential decay, the curve is always smooth.

const A_VOL  = VOL_MAX - VOL_REST;   // 0.45 — inhale amplitude
const A_VOL2 = VOL_REST - VOL_MIN;   // 0.40 — exhale amplitude
const OMEGA  = 0.55;                  // rad/s — θ advance speed

// Volume from phase angle θ ∈ [−π/2, +π/2]
function volFromTheta(th){
  const amp = th >= 0 ? A_VOL : A_VOL2;
  return VOL_REST + amp * Math.sin(th);
}

// ── Pressure model ────────────────────────────────────────────────────────
//
// Pressure must be a SMOOTH sine-shaped curve with NO discontinuities.
//
// Key insight: the problem with using dθ/dt is that dθ/dt is a SQUARE WAVE
// (OMEGA when button held, 0 when released) — multiplying it by cos(θ) still
// produces corners wherever the button state changes.
//
// Solution: decouple pressure from dθ/dt entirely.
// Instead, track two independent smooth variables:
//
//   pressureSign  ∈ {−1, 0, +1}   direction (−1=inhale, +1=exhale, 0=rest)
//   pressureAmp   ∈ [0, 1]         smooth envelope via low-pass filter
//
// Pressure = ATMOS − pressureSign × pressureAmp × PRESS_DELTA × |cos(θ)|
//
//   • |cos(θ)|: naturally fades to 0 at volume extremes (θ=±π/2) ✓
//   • pressureAmp: low-pass filtered → smooth attack & release, NO jumps ✓
//   • pressureSign: changes direction, but always multiplied by the smooth amp ✓
//
// The result is a sine-envelope curve that:
//   – rises smoothly when button pressed
//   – falls smoothly when button released
//   – is zero at volume extremes regardless of button state
//   – has no discontinuities anywhere

const PRESS_SMOOTH = 6.0;  // low-pass cutoff (higher = faster attack/release)
const PRESS_OUTPUT_SMOOTH = 18.0; // final output low-pass — eliminates any sign-switch discontinuity
let phase='rest', lastTime=null, elapsed=0;
let theta = 0;           // volume phase angle
let smoothThetaDt = 0;   // 橫膈膜(氣流)的平滑加速度
let volFrac = VOL_REST;
let pressure = ATMOS;
let pressureRaw = ATMOS;  // raw computed pressure (may have sign-switch seam)
let pressureAmp  = 0;    // smooth 0→1 envelope
let pressureSign = 0;    // −1 (inhale) / +1 (exhale) / 0 (rest)
const MAX_PTS=720, dataV=[], dataP=[];
const cvV=document.getElementById('cv'), cvP=document.getElementById('cp');
const ctxV=cvV.getContext('2d'), ctxP=cvP.getContext('2d');

// ── Airflow particle state ──────────────────────────────────────────────────
const PARTICLE_COUNT=5;
let particleTimers=[]; // staggered spawn timers
function initParticleTimers(){
  particleTimers=Array.from({length:PARTICLE_COUNT},(_,i)=>i*0.22);
}
initParticleTimers();
let particlePhase='rest', particleElapsed=0;

function animateParticles(dt){
  const trBJ=document.getElementById('bj-trachea-flow');
  const trRC=document.getElementById('rc-trachea-flow');
  // Arrow element sets: [arrow1, arrow2, arrow3] for each model
  const bjArrows=[
    document.getElementById('bj-arrow1'),
    document.getElementById('bj-arrow2'),
    document.getElementById('bj-arrow3'),
  ];
  const rcArrows=[
    document.getElementById('rc-arrow1'),
    document.getElementById('rc-arrow2'),
    document.getElementById('rc-arrow3'),
  ];

  const bjLabel=document.getElementById('bj-flow-label');
  const rcLabel=document.getElementById('rc-flow-label');

  // 物理/生物學修正：當氣流強度(氣壓差)真正歸零時才隱藏動畫，而非單純依賴 UI 按鈕狀態。
  // 這樣才能視覺化呈現胸腔彈性回縮時的「被動呼氣」氣流。
  const flowIntensity = pressureAmp;
  
  if(flowIntensity < 0.05){
    ['bj-ap','rc-ap'].forEach(cls=>{
      document.querySelectorAll('.'+cls).forEach(el=>{
        el.style.transition='opacity .35s';
        el.style.opacity='0';
        el.style.transform='';
      });
    });
    if(trBJ) trBJ.setAttribute('stroke','rgba(128,220,180,0)');
    if(trRC) trRC.setAttribute('stroke','rgba(128,220,180,0)');
    [...bjArrows,...rcArrows].forEach(a=>{if(a)a.setAttribute('fill','rgba(120,230,180,0)');});
    if(bjLabel) bjLabel.setAttribute('fill','rgba(60,220,150,0)');
    if(rcLabel) rcLabel.setAttribute('fill','rgba(60,220,150,0)');
    return;
  }

  particleElapsed+=dt;
  // 氣流方向應由真實的肺內壓與大氣壓相對關係決定 (P < ATMOS 則為吸氣)
  const isInhale = pressure < ATMOS;
  const dur=0.72;

  // Trachea glow
  const glowPulse=0.5+0.5*Math.sin(particleElapsed*9);
  const glowAlpha = flowIntensity * (0.55+glowPulse*0.35);
  const glowCol=isInhale
    ?`rgba(60,220,150,${glowAlpha})`
    :`rgba(245,160,50,${glowAlpha})`;
  if(trBJ) trBJ.setAttribute('stroke',glowCol);
  if(trRC) trRC.setAttribute('stroke',glowCol);

  // Flow labels
  const labelText = isInhale ? '▼ 空氣進入' : '▲ 空氣呼出';
  const labelAlpha = (flowIntensity * 0.9).toFixed(3);
  const labelCol = isInhale
    ? `rgba(60,230,150,${labelAlpha})`
    : `rgba(245,160,50,${labelAlpha})`;
  if(bjLabel){ bjLabel.textContent=labelText; bjLabel.setAttribute('fill',labelCol); }
  if(rcLabel){ rcLabel.textContent=labelText; rcLabel.setAttribute('fill',labelCol); }

  // ── Cascading directional arrows ──────────────────────────────────────────
  // Three arrows staggered 0.22s apart, scrolling in flow direction
  const arrowCycle = 0.66; // seconds per full cascade sweep
  const inhaleCol  = 'rgba(60,230,160,'; // green for inhale
  const exhaleCol  = 'rgba(245,160,50,'; // amber for exhale
  const arrowChar  = isInhale ? '▼' : '▲';
  const arrowSets  = [bjArrows, rcArrows];

  arrowSets.forEach(arrows=>{
    arrows.forEach((a,i)=>{
      if(!a) return;
      a.textContent = arrowChar;
      // phase offset: 0, 0.22, 0.44 seconds
      const t = ((particleElapsed - i*0.22) % arrowCycle + arrowCycle) % arrowCycle / arrowCycle; // 0→1
      // Fade in 0→0.2, full 0.2→0.7, fade out 0.7→1
      let alpha;
      if(t < 0.2)       alpha = t / 0.2;
      else if(t < 0.7)  alpha = 1;
      else              alpha = 1 - (t - 0.7) / 0.3;
      const finalAlpha = (alpha * flowIntensity * 0.92).toFixed(3);
      const col = (isInhale ? inhaleCol : exhaleCol) + finalAlpha + ')';
      a.setAttribute('fill', col);
      // Animate vertical position along trachea (arrows scroll in direction of flow)
      // Trachea occupies roughly y=2..32. Arrow positions scroll through it.
      const spanY = 28; // px in SVG units
      let posY;
      if(isInhale){
        // Arrow flows DOWN: start above, exit at bottom
        posY = -4 + t * (spanY + 10);
      } else {
        // Arrow flows UP: start at bottom, exit above
        posY = spanY + 6 - t * (spanY + 10);
      }
      a.setAttribute('y', posY.toFixed(1));
    });
  });

  // ── Particles ──────────────────────────────────────────────────────────────
  ['bj-ap','rc-ap'].forEach((cls)=>{
    const els=document.querySelectorAll('.'+cls);
    els.forEach((el,i)=>{
      const t=((particleElapsed + i*0.19)%dur)/dur;
      let opacity;
      if(t<0.18)      { opacity=t/0.18; }
      else if(t<0.72) { opacity=1; }
      else            { opacity=1-(t-0.72)/0.28; }

      let ty;
      if(isInhale){
        ty = -14 + t*46;
        el.setAttribute('fill','#5ee8b8');
        el.setAttribute('r', (2+t*1.2).toFixed(1));
      } else {
        ty = 32 - t*46;
        el.setAttribute('fill','#f5b050');
        el.setAttribute('r', (3.2-t*1.2).toFixed(1));
      }
      el.style.transition='none';
      el.style.opacity = (opacity * 0.95 * flowIntensity).toFixed(3);
      el.style.transform = `translateY(${ty}px)`;
    });
  });
}

function resize(){
  [cvV,cvP].forEach(c=>{
    c.width=c.offsetWidth*devicePixelRatio;
    c.height=c.offsetHeight*devicePixelRatio;
  });
}
window.addEventListener('resize',resize);
setTimeout(resize,60);

function tick(ts){
  requestAnimationFrame(tick);
  if(!lastTime){lastTime=ts;}
  const dt=Math.min((ts-lastTime)/1000,.05);
  lastTime=ts;

  // --- 插入此段，確保暫停時凍結所有物理運算 ---
  if (autoPaused) {
    updateModels();
    drawChart(ctxV,cvV,dataV,0,1.0,'#61afef','rgba(97,175,239,.20)','rgba(97,175,239,.01)',v=>(v*100).toFixed(0)+'%', VOL_REST, 0, 1.05, 'vol');
    drawChart(ctxP,cvP,dataP,P_AX_MIN,P_AX_MAX,'#e06c75','rgba(224,108,117,.20)','rgba(224,108,117,.01)',v=>v.toFixed(1)+' mmHg', ATMOS, P_AX_MIN, P_AX_MAX, 'mmHg');
    return; // 直接返回，不執行下方的物理運算
  }
  // ----------------------------------------

  elapsed+=dt;
  const HALF_PI = Math.PI / 2;

  // Auto-breath state machine advances phase before physics
  tickAuto();

// ── 1. Advance θ (volume phase) & 平滑氣流加速度 ────────────────────────
  let targetDTheta = 0;
  if (phase === 'inhale') {
    targetDTheta = OMEGA;
  } else if (phase === 'exhale') {
    targetDTheta = -OMEGA;
  } else {
    // 靜止時使用指數衰減回歸 FRC，這樣速度會逐漸變慢，氣壓也會平滑歸零
    targetDTheta = -theta * 2.0; // 2.0 是回歸速率，可根據需要調整
  }
  
  // 加入呼吸肌肉的「平滑加速度」，完美消除手動點擊時的氣壓折角
  smoothThetaDt += (targetDTheta - smoothThetaDt) * Math.min(1, 15.0 * dt);
  
  theta += smoothThetaDt * dt;
  theta = Math.max(-HALF_PI, Math.min(HALF_PI, theta)); // 限制在極值內
  
  volFrac = volFromTheta(theta);

// ── 2. Calculate Pressure (Physiological Sine Curve) ─────────────────────
// 生物學修正：壓力變化應始終由體積變化率 (dV/dt) 決定，遵循波以耳定律。
// 即使在 phase === 'rest' 的狀態，肺部彈性回縮導致體積減小時，仍會產生推動空氣外流的正壓。
// smoothThetaDt 代表相位的角速度，Math.cos(theta) 則是體積正弦函數的導數因子。
const dVdt = smoothThetaDt * Math.cos(theta);

// 透過正規化因子調整顯示幅度 (OMEGA 是主動呼吸時的最大角速度)
const normalizedFlow = dVdt / OMEGA; 

// 壓力 = 大氣壓 - (常數 * 體積變化率)
// 當 dV/dt 為正 (體積膨脹)，P < 大氣壓 (吸氣)；當 dV/dt 為負 (體積縮小)，P > 大氣壓 (呼氣)
pressure = ATMOS - (PRESS_DELTA * normalizedFlow);

// 同步更新 pressureAmp 讓空氣粒子的動畫能完美貼合真實的氣壓流速
pressureAmp = Math.abs(pressure - ATMOS) / PRESS_DELTA;

  // Airflow particles
  animateParticles(dt);

  dataV.push({t:elapsed,v:volFrac});
  dataP.push({t:elapsed,v:pressure});
  if(dataV.length>MAX_PTS)dataV.shift();
  if(dataP.length>MAX_PTS)dataP.shift();

  // Phase progress bar — proportion of full travel
  let fill = 0;
  if(phase==='inhale') fill = (theta / HALF_PI) * 100;
  else if(phase==='exhale') fill = (-theta / HALF_PI) * 100;
  const pf=document.getElementById('phase-fill');
  pf.style.width=Math.max(0,Math.min(100,fill))+'%';
  pf.style.background=phase==='inhale'?'#4caf8a':phase==='exhale'?'#e8a84c':'#4a6a8a';

  updateModels();
  drawChart(ctxV,cvV,dataV,0,1.0,'#61afef','rgba(97,175,239,.20)','rgba(97,175,239,.01)',
    v=>(v*100).toFixed(0)+'%', VOL_REST, 0, 1.05, 'vol');
  drawChart(ctxP,cvP,dataP,P_AX_MIN,P_AX_MAX,'#e06c75','rgba(224,108,117,.20)','rgba(224,108,117,.01)',
    v=>v.toFixed(1)+' mmHg', ATMOS, P_AX_MIN, P_AX_MAX, 'mmHg');
}

function updateModels(){
  const t=volFrac;
  // Bell jar balloons
  const sc=0.55+t*0.80;
  document.getElementById('bj-ll').setAttribute('rx',24*sc*.85);
  document.getElementById('bj-ll').setAttribute('ry',34*sc);
  document.getElementById('bj-lr').setAttribute('rx',24*sc*.85);
  document.getElementById('bj-lr').setAttribute('ry',34*sc);
  // Bell jar diaphragm
  const sag=196+(t-VOL_REST)*30;
  document.getElementById('bj-diap').setAttribute('d',`M 36 176 Q 100 ${sag} 164 176`);
  document.getElementById('bj-hline').setAttribute('y1',sag);
  document.getElementById('bj-hline').setAttribute('y2',sag+24);
  document.getElementById('bj-knob').setAttribute('cy',sag+26);
  document.getElementById('bj-arr').setAttribute('y',sag+16);
  document.getElementById('bj-arr').textContent=phase==='inhale'?'↓':phase==='exhale'?'↑':'↕';

  // Labels
  let lbl, col;
  if(autoMode && !autoPaused){
    lbl = phase==='inhale' ? '⟳ 自動吸氣 ▼' : '⟳ 自動呼氣 ▲';
    col = phase==='inhale' ? '#4caf8a' : '#e8a84c';
  } else if(autoMode && autoPaused){
    lbl = '⏸ 暫停中';
    col = '#c06020';
  } else {
    const isActivelyBreathing = Math.abs(pressure - ATMOS) > 0.2;
    if (phase === 'inhale') {
      lbl = '主動吸氣中 ▼';
      col = '#4caf8a';
    } else if (phase === 'exhale') {
      lbl = '主動呼氣中 ▲';
      col = '#e8a84c';
    } else if (isActivelyBreathing) {
      // 生物學修正：放開按鈕但體積仍在回歸 FRC，顯示被動呼氣/吸氣
      lbl = pressure > ATMOS ? '被動呼氣中 ▲' : '被動吸氣中 ▼';
      col = pressure > ATMOS ? '#e8a84c' : '#4caf8a';
    } else {
      lbl = '靜止 (大氣壓平衡)';
      col = '#7a8fa6';
    }
  }
  ['bj-state','rc-state'].forEach(id=>{
    document.getElementById(id).textContent=lbl;
    document.getElementById(id).style.color=col;
  });

  // Ribcage lungs
  const rs=0.52+t*0.85;
  document.getElementById('rc-ll').setAttribute('rx',19*rs*.9);
  document.getElementById('rc-ll').setAttribute('ry',40*rs*.95);
  document.getElementById('rc-lr').setAttribute('rx',19*rs*.9);
  document.getElementById('rc-lr').setAttribute('ry',40*rs*.95);
  // Ribcage diaphragm
  const dsag=183+(t-VOL_REST)*28;
  document.getElementById('rc-diap').setAttribute('d',`M 53 166 Q 100 ${dsag} 147 166`);
  document.getElementById('rc-dfill').setAttribute('d',`M 53 166 Q 100 ${dsag} 147 166 L 147 186 Q 100 186 53 186 Z`);
  // Rib expand — bucket-handle motion: ribs move outward AND upward
  const rx=(t-VOL_REST)*9;
  const ry_shift=(t-VOL_REST)*-5; // ribs also rise slightly during inhale
  document.querySelectorAll('.rl').forEach(r=>r.style.transform=`translate(${-rx}px,${ry_shift}px)`);
  document.querySelectorAll('.rr').forEach(r=>r.style.transform=`translate(${rx}px,${ry_shift}px)`);
}

function drawChart(ctx,cv,data,yMin,yMax,lineCol,bgCol1,bgCol2,valFmt,refV,axMin,axMax,unit){
  const W=cv.width,H=cv.height,dpr=devicePixelRatio||1;
  ctx.clearRect(0,0,W,H);
  if(data.length<2)return;
  const PL=46*dpr,PR=12*dpr,PT=8*dpr,PB=22*dpr;
  const cw=W-PL-PR,ch=H-PT-PB;
  const tEnd=data[data.length-1].t;
  const tStart=Math.max(0,tEnd-10);
  const xOf=t=>PL+(t-tStart)/10*cw;
  const yOf=v=>PT+ch-(v-axMin)/(axMax-axMin)*ch;
  const visible=data.filter(d=>d.t>=tStart);

  // Grid
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=.6*dpr;
  for(let i=1;i<4;i++){const y=PT+ch/4*i;ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(PL+cw,y);ctx.stroke();}

  // Phase bg bands
  let prevX=xOf(visible[0]?.t??tStart), prevPhaseIsInhale=null;
  if(visible.length>1){
    // color based on pressure relative to atmos
    ctx.save();
    ctx.beginPath();ctx.rect(PL,PT,cw,ch);ctx.clip();
    let bandStart=xOf(visible[0].t);
    let bandType=visible[0].v<ATMOS?'inhale':'exhale';
    for(let i=1;i<visible.length;i++){
      const d=visible[i];
      const thisType=d.v<ATMOS?'inhale':'exhale';
      if(thisType!==bandType||i===visible.length-1){
        const bx=xOf(d.t);
        ctx.fillStyle=bandType==='inhale'?'rgba(76,175,138,.07)':'rgba(232,168,76,.07)';
        ctx.fillRect(bandStart,PT,bx-bandStart,ch);
        bandStart=bx;bandType=thisType;
      }
    }
    ctx.restore();
  }

  // Reference line
  const ry=yOf(refV);
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=.8*dpr;
  ctx.setLineDash([4*dpr,4*dpr]);
  ctx.beginPath();ctx.moveTo(PL,ry);ctx.lineTo(PL+cw,ry);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font=`${7.5*dpr}px JetBrains Mono`;
  ctx.textAlign='right';
  ctx.fillText(refV,PL-3*dpr,ry+3*dpr);

  // Y axis labels
  ctx.fillStyle='rgba(160,185,210,.65)';ctx.font=`${7.5*dpr}px JetBrains Mono`;ctx.textAlign='right';
  const fmtAx=v=>unit==='mmHg'?v.toFixed(1):v.toFixed(2);
  ctx.fillText(fmtAx(axMax),PL-3*dpr,PT+6*dpr);
  ctx.fillText(fmtAx(axMin),PL-3*dpr,PT+ch+1*dpr);

  // X ticks
  ctx.fillStyle='rgba(160,185,210,.5)';ctx.font=`${7*dpr}px JetBrains Mono`;ctx.textAlign='center';
  for(let s=Math.ceil(tStart);s<=tEnd;s++){
    const x=xOf(s);
    ctx.fillText(s+'s',x,PT+ch+15*dpr);
    ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=.5*dpr;
    ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,PT+ch);ctx.stroke();
  }

  // Gradient fill
  if(visible.length>1){
    const g=ctx.createLinearGradient(0,PT,0,PT+ch);
    g.addColorStop(0,bgCol1);g.addColorStop(1,bgCol2);
    ctx.beginPath();
    ctx.moveTo(xOf(visible[0].t),yOf(visible[0].v));
    visible.forEach(d=>ctx.lineTo(xOf(d.t),yOf(d.v)));
    ctx.lineTo(xOf(visible[visible.length-1].t),PT+ch);
    ctx.lineTo(xOf(visible[0].t),PT+ch);
    ctx.closePath();ctx.fillStyle=g;ctx.fill();
  }

  // Line
  ctx.beginPath();ctx.strokeStyle=lineCol;ctx.lineWidth=2*dpr;ctx.lineJoin='round';ctx.lineCap='round';
  let first=true;
  visible.forEach(d=>{first?ctx.moveTo(xOf(d.t),yOf(d.v)):ctx.lineTo(xOf(d.t),yOf(d.v));first=false;});
  ctx.stroke();

  // Dot + value
  if(visible.length>0){
    const last=visible[visible.length-1];
    const lx=xOf(last.t),ly=yOf(last.v);
    ctx.beginPath();ctx.arc(lx,ly,3.5*dpr,0,Math.PI*2);ctx.fillStyle=lineCol;ctx.fill();
    ctx.fillStyle=lineCol;ctx.font=`bold ${8.5*dpr}px JetBrains Mono`;ctx.textAlign='left';
    ctx.fillText(valFmt(last.v),lx+6*dpr,ly-2*dpr);
  }

  // Axes
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=dpr;
  ctx.beginPath();ctx.moveTo(PL,PT);ctx.lineTo(PL,PT+ch);ctx.lineTo(PL+cw,PT+ch);ctx.stroke();
}

// ── Auto-breath state machine ────────────────────────────────────────────────
// Auto mode cycles: inhale until θ → +π/2, then exhale until θ → −π/2, repeat.
// Pause freezes phase at 'rest' (volume returns to FRC).
let autoMode   = false;   // auto-breathing enabled
let autoPaused = false;   // paused mid-auto
let autoSubPhase = 'inhale'; // which half-cycle we're in during auto

function toggleAuto(){
  if(!autoMode){
    // Start auto
    autoMode     = true;
    autoPaused   = false;
    autoSubPhase = theta >= 0 ? 'inhale' : 'exhale'; // start from sensible direction
    phase        = autoSubPhase;
    updateAutoBtn();
  } else if(!autoPaused){
    // Pause - 僅僅切換狀態，不要碰任何物理變數 (phase, theta)
    autoPaused = true;
    updateAutoBtn();
  } else {
    // Resume - 僅僅切換狀態，讓動畫從原本的 theta 繼續
    autoPaused = false;
    updateAutoBtn();
  }
}

function updateAutoBtn(){
  const btn = document.getElementById('btn-auto');
  if(!autoMode){
    btn.textContent = '▶ 自動呼吸';
    btn.className   = 'btn btn-auto';
  } else if(autoPaused){
    btn.textContent = '▶ 繼續';
    btn.className   = 'btn btn-auto is-paused';
  } else {
    btn.textContent = '⏸ 暫停';
    btn.className   = 'btn btn-auto is-auto';
  }
}

function tickAuto(){
  if(!autoMode || autoPaused) return;
  const HALF_PI = Math.PI / 2;
// 讓相位精準達到極值才切換，以繪製出數學上完美的連續正弦波
  const MARGIN  = 0.01;
  if(autoSubPhase === 'inhale' && theta >= HALF_PI - MARGIN){
    autoSubPhase = 'exhale';
    phase = 'exhale';
  } else if(autoSubPhase === 'exhale' && theta <= -HALF_PI + MARGIN){
    autoSubPhase = 'inhale';
    phase = 'inhale';
  } else {
    phase = autoSubPhase;
  }
}

function manualBreath(p){
  // Manual press overrides auto temporarily
  if(autoMode){ autoMode=false; autoPaused=false; updateAutoBtn(); }
  phase=p;
}
function manualEnd(){
  if(!autoMode) phase='rest';
}
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('contextmenu',e=>e.preventDefault()));
requestAnimationFrame(tick);
