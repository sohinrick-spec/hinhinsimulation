<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>食物測試實驗模擬器</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-app:#f4f6f9;
    --bg-panel:#ffffff;
    --border:#d4dbe6;
    --text-primary:#1a2332;
    --text-secondary:#4a5a70;
    --text-dim:#8a9ab0;
    --cyan:#1976d2;
    --cyan-dark:#0d47a1;
    --rose:#c62828;
    --green:#2e7d32;
    --amber:#e65100;
    --violet:#5e35b1;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    background:var(--bg-app);
    color:var(--text-primary);
    font-family:'IBM Plex Sans','Noto Sans TC',system-ui,sans-serif;
    margin:0;
  }
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .font-tc{font-family:'Noto Sans TC','IBM Plex Sans',sans-serif;}

  .panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:6px;
  }
  .btn{
    border:1px solid var(--border);
    border-radius:4px;
    padding:8px 12px;
    font-size:13px;
    font-weight:500;
    background:#fff;
    color:var(--text-primary);
    transition:all .15s ease;
    cursor:pointer;
  }
  .btn:hover{ border-color:var(--cyan); color:var(--cyan-dark); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary{ background:var(--cyan); border-color:var(--cyan); color:#fff; }
  .btn-primary:hover{ background:var(--cyan-dark); border-color:var(--cyan-dark); color:#fff; }
  .btn-danger{ background:var(--rose); border-color:var(--rose); color:#fff; }
  .btn-danger:hover{ background:#8e1c1c; border-color:#8e1c1c; color:#fff; }
  .btn-amber{ background:var(--amber); border-color:var(--amber); color:#fff; }
  .btn-amber:hover{ background:#b23a00; border-color:#b23a00; color:#fff; }
  .btn-violet{ background:var(--violet); border-color:var(--violet); color:#fff; }
  .btn-violet:hover{ background:#472a8c; border-color:#472a8c; color:#fff; }

  .test-tab{
    border:1px solid var(--border);
    border-radius:4px;
    padding:8px 10px;
    cursor:pointer;
    background:#fff;
    transition:all .15s ease;
  }
  .test-tab:hover{ border-color:var(--cyan); }
  .test-tab.active{
    border-color:var(--cyan);
    background:#e8f1fb;
    box-shadow:inset 3px 0 0 var(--cyan);
  }
  .test-tab.active .test-tab-title{ color:var(--cyan-dark); }

  .sample-chip{
    border:1px solid var(--border);
    border-radius:4px;
    padding:6px 8px;
    font-size:12px;
    text-align:center;
    cursor:pointer;
    background:#fff;
    transition:all .15s ease;
  }
  .sample-chip:hover{ border-color:var(--cyan); }
  .sample-chip.active{
    border-color:var(--violet);
    background:#f1ecfa;
    color:var(--violet);
    font-weight:600;
  }

  .stat-box{
    border:1px solid var(--border);
    border-radius:4px;
    padding:8px 10px;
    background:#fbfcfe;
  }
  .stat-label{
    font-size:10px;
    letter-spacing:.06em;
    color:var(--text-dim);
    font-weight:600;
  }
  .stat-value{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:18px;
    color:var(--text-primary);
    margin-top:2px;
  }

  .status-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:4px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:.04em;
  }
  .status-idle{ background:#eef1f6; color:var(--text-secondary); }
  .status-progress{ background:#fff3e0; color:var(--amber); }
  .status-positive{ background:#e6f4ea; color:var(--green); }
  .status-negative{ background:#fdecea; color:var(--rose); }

  /* Log terminal: white background, bounded height */
  .log-terminal{
    background:#ffffff;
    border:1px solid var(--border);
    border-radius:4px;
    padding:10px;
    height:220px;
    max-height:220px;
    overflow-y:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    line-height:1.6;
  }
  @media (min-width:1024px){
    .log-terminal{
      height:auto;
      max-height:none;
    }
  }
  .log-line{ white-space:pre-wrap; word-break:break-word; }
  .log-sys{ color:var(--cyan-dark); }
  .log-ok{ color:var(--green); }
  .log-warn{ color:var(--amber); }
  .log-err{ color:var(--rose); }
  .log-dim{ color:var(--text-dim); }

  select{
    border:1px solid var(--border);
    border-radius:4px;
    padding:6px 8px;
    font-size:13px;
    background:#fff;
    color:var(--text-primary);
  }

  .bench-card{
    background:linear-gradient(180deg,#fafcff 0%, #f3f7fb 100%);
    border:1px solid var(--border);
    border-radius:6px;
    min-height:340px;
  }

  .liquid-transition{ transition: fill 0.9s ease, opacity .6s ease; }
  .fade-in{ animation: fadeIn .4s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .bubble{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.65);
    animation: rise 1.6s linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) scale(.6); opacity:0; }
    20%{ opacity:.8; }
    100%{ transform:translateY(-50px) scale(1); opacity:0; }
  }

  /* --- Authentic lab-action animations --- */
  .dropper{ transform-origin:center top; }
  .dropper.squeeze{ animation: dropperSqueeze .55s ease; }
  @keyframes dropperSqueeze{
    0%,100%{ transform:scaleY(1); }
    35%{ transform:scaleY(.8); }
    55%{ transform:scaleY(1.08); }
    75%{ transform:scaleY(.96); }
  }
  .drop-fall{ animation: dropFall .55s cubic-bezier(.55,0,.85,.35) forwards; }
  @keyframes dropFall{
    0%{ transform:translateY(0); opacity:1; }
    80%{ opacity:1; }
    100%{ transform:translateY(86px); opacity:0; }
  }
  .ripple{ transform-origin:center; animation: rippleAnim .6s ease-out forwards; }
  @keyframes rippleAnim{
    0%{ transform:scale(.25); opacity:.9; }
    100%{ transform:scale(2.6); opacity:0; }
  }
  .flame{ transform-origin:center bottom; animation: flicker 1s ease-in-out infinite; }
  @keyframes flicker{
    0%,100%{ transform:scale(1,1); opacity:1; }
    50%{ transform:scale(.88,1.1); opacity:.8; }
  }
  .steam{ animation: steamRise 1.8s ease-in infinite; }
  @keyframes steamRise{
    0%{ transform:translateY(0) scale(.7); opacity:0; }
    25%{ opacity:.55; }
    100%{ transform:translateY(-40px) scale(1.3); opacity:0; }
  }
  .air-line{ animation: airFlow 1.1s ease-in-out infinite; }
  @keyframes airFlow{
    0%,100%{ opacity:.15; transform:translateX(-4px); }
    50%{ opacity:.65; transform:translateX(4px); }
  }
  .strip-dip{ animation: stripDipAnim .9s ease-in-out; }
  @keyframes stripDipAnim{
    0%{ transform:translateY(0); }
    45%{ transform:translateY(46px); }
    60%{ transform:translateY(46px); }
    100%{ transform:translateY(0); }
  }
  .pour-tilt{ transform-origin:10% 90%; animation: pourTiltAnim 1s ease-in-out; }
  @keyframes pourTiltAnim{
    0%{ transform:rotate(0deg); }
    40%{ transform:rotate(-60deg); }
    70%{ transform:rotate(-60deg); }
    100%{ transform:rotate(0deg); }
  }
  .swirl{ transform-origin:50% 95%; animation: swirlAnim .6s ease-in-out; }
  @keyframes swirlAnim{
    0%{ transform:rotate(0deg); }
    25%{ transform:rotate(9deg); }
    60%{ transform:rotate(-7deg); }
    100%{ transform:rotate(0deg); }
  }
  .light-glow{ animation: glowPulse 1.4s ease-in-out infinite; }
  @keyframes glowPulse{
    0%,100%{ opacity:.35; }
    50%{ opacity:.9; }
  }

  .progress-track{
    width:100%; height:6px; border-radius:3px;
    background:#e3e8f0; overflow:hidden; border:1px solid var(--border);
  }
  .progress-fill{
    height:100%; background:var(--amber); width:0%;
    transition:width .1s linear;
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#b9c2d0; border-radius:4px; }
  ::-webkit-scrollbar-track{ background:#eef1f6; }
</style>
</head>
<body class="min-h-screen lg:h-screen lg:overflow-hidden lg:flex lg:flex-col">

<!-- HEADER -->
<header class="border-b lg:shrink-0" style="background:#ffffff;border-color:var(--border);">
  <div class="max-w-[1440px] mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-[4px] flex items-center justify-center" style="background:var(--cyan);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2v6.5L4.5 17a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L15 8.5V2"/>
          <path d="M9 2h6"/>
          <path d="M7 14h10"/>
        </svg>
      </div>
      <div>
        <h1 class="text-[16px] font-bold font-tc leading-tight">食物測試實驗模擬器</h1>
        <p class="text-[11px] font-mono font-tc" style="color:var(--text-dim);">香港中學文憑生物科 · 虛擬食物測試實驗終端機</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="status-badge" id="stationStatusBadge"><span id="stationStatusDot">●</span> <span id="stationStatusText">系統就緒</span></span>
    </div>
  </div>
</header>

<main class="max-w-[1440px] mx-auto p-4 w-full lg:flex-1 lg:min-h-0 lg:flex lg:flex-col lg:overflow-hidden">
  <div class="grid grid-cols-1 lg:grid-cols-[280px_1fr_300px] gap-4 lg:flex-1 lg:min-h-0">

    <!-- LEFT PANEL: CONTROL CONSOLE -->
    <section class="panel p-4 flex flex-col gap-4 lg:h-full lg:min-h-0 lg:overflow-y-auto">
      <div>
        <p class="stat-label mb-2 font-tc">測試選擇</p>
        <div id="testTabs" class="flex flex-col gap-1.5"></div>
      </div>

      <div class="border-t pt-3" style="border-color:var(--border);">
        <p class="stat-label mb-2 font-tc">樣本選擇</p>
        <div id="sampleGrid" class="grid grid-cols-2 gap-1.5"></div>
      </div>

      <div class="border-t pt-3" style="border-color:var(--border);">
        <p class="stat-label mb-2 font-tc">操作</p>
        <div id="actionButtons" class="flex flex-col gap-2"></div>
      </div>

      <div class="border-t pt-3 mt-auto" style="border-color:var(--border);">
        <button id="resetBtn" class="btn btn-danger w-full font-tc text-[13px] tracking-wide">⟲ 重設站台</button>
      </div>
    </section>

    <!-- CENTER PANEL: LAB BENCH -->
    <section class="panel p-4 lg:h-full lg:min-h-0 lg:overflow-hidden flex flex-col">
      <div class="flex items-center justify-between mb-3 shrink-0">
        <h2 class="font-tc font-semibold text-[14px]" id="benchTitle">實驗台</h2>
        <span class="text-[11px] font-tc" style="color:var(--text-dim);" id="benchSubtitle"></span>
      </div>
      <div class="bench-card relative flex items-center justify-center p-6 lg:flex-1 lg:min-h-0 overflow-y-auto" id="benchArea"></div>
      <div class="mt-3 shrink-0">
        <p class="stat-label mb-1 font-tc">步驟指引</p>
        <p class="text-[13px] font-tc leading-relaxed" id="stepGuide" style="color:var(--text-secondary);"></p>
      </div>
    </section>

    <!-- RIGHT PANEL: PRECISION MONITOR -->
    <section class="panel p-4 flex flex-col gap-4 lg:h-full lg:min-h-0 lg:overflow-hidden">
      <div class="shrink-0">
        <p class="stat-label mb-2 font-tc">狀態</p>
        <div id="statusBadgeBox"></div>
      </div>

      <div class="shrink-0">
        <p class="stat-label mb-2 font-tc">數據監控</p>
        <div class="grid grid-cols-2 gap-2" id="metricsGrid"></div>
      </div>

      <div class="border-t pt-3 flex-1 flex flex-col lg:min-h-0" style="border-color:var(--border);">
        <p class="stat-label mb-2 shrink-0 font-tc">系統日誌</p>
        <div class="log-terminal flex-1 lg:min-h-0" id="logTerminal"></div>
      </div>
    </section>

  </div>
</main>

<script>
(function(){
  "use strict";

  /* ============================================================
     COLOR HELPERS
  ============================================================ */

  function hexToRgb(hex){
    hex = hex.replace('#','');
    if (hex.length === 3) { hex = hex.split('').map(function(c){ return c+c; }).join(''); }
    const num = parseInt(hex,16);
    return [ (num>>16)&255, (num>>8)&255, num&255 ];
  }
  function blendColor(hexA, hexB, t){
    t = Math.max(0, Math.min(1, t));
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    const mix = a.map(function(c,i){ return Math.round(c + (b[i]-c)*t); });
    return 'rgb('+mix.join(',')+')';
  }

  /* ============================================================
     DATA MODEL
  ============================================================ */

  // "glucose" = 對葡萄糖專一酵素試紙呈陽性
  // "reducingSugar" = 對本立德試驗呈陽性（還原糖，如葡萄糖、乳糖；蔗糖不屬還原糖）
  // "color" = 樣本本身未加任何試劑時的顏色
  const SAMPLES = {
    water:   { id:'water',   nameTC:'蒸餾水 (對照)',       glucose:false, reducingSugar:false, starch:false, protein:false, oil:false, vitaminC:'none',    color:'#eaf3fb' },
    glucose: { id:'glucose', nameTC:'葡萄糖溶液',           glucose:true,  reducingSugar:true,  starch:false, protein:false, oil:false, vitaminC:'none',    color:'#fdf6d8' },
    sucrose: { id:'sucrose', nameTC:'蔗糖溶液 (非還原糖)',  glucose:false, reducingSugar:false, starch:false, protein:false, oil:false, vitaminC:'none',    color:'#fdf8ea' },
    starch:  { id:'starch',  nameTC:'澱粉溶液',             glucose:false, reducingSugar:false, starch:true,  protein:false, oil:false, vitaminC:'none',    color:'#f4f1e6' },
    albumen: { id:'albumen', nameTC:'蛋白溶液',             glucose:false, reducingSugar:false, starch:false, protein:true,  oil:false, vitaminC:'none',    color:'#f6f7f1' },
    milk:    { id:'milk',    nameTC:'牛奶',                 glucose:false, reducingSugar:true,  starch:false, protein:true,  oil:true,  vitaminC:'none',    color:'#fffdf6' },
    oil:     { id:'oil',     nameTC:'食油',                 glucose:false, reducingSugar:false, starch:false, protein:false, oil:true,  vitaminC:'none',    color:'#f2df9c' },
    vitc:    { id:'vitc',    nameTC:'維他命C溶液 (新鮮)',   glucose:false, reducingSugar:false, starch:false, protein:false, oil:false, vitaminC:'fresh',   color:'#eef7d8' },
    orangeJuice:{ id:'orangeJuice', nameTC:'橙汁',          glucose:true,  reducingSugar:true,  starch:false, protein:false, oil:false, vitaminC:'dilute1', color:'#f5a83c' },
    lemonJuice: { id:'lemonJuice',  nameTC:'檸檬汁',        glucose:true,  reducingSugar:true,  starch:false, protein:false, oil:false, vitaminC:'dilute2', color:'#f2ec8f' },
    vitcHeated:{ id:'vitcHeated', nameTC:'維他命C溶液 (已加熱)', glucose:false, reducingSugar:false, starch:false, protein:false, oil:false, vitaminC:'heated', color:'#eef7d8' }
  };

  const TESTS = {
    glucoseStrip: { id:'glucoseStrip', nameTC:'尿糖試紙測試', icon:'📏' },
    benedict:     { id:'benedict',     nameTC:"本立德試驗",   icon:'🧪' },
    iodine:       { id:'iodine',       nameTC:'碘液試驗',     icon:'🧫' },
    grease:       { id:'grease',       nameTC:'油漬試驗',     icon:'📄' },
    proteinStrip: { id:'proteinStrip', nameTC:'尿蛋白試紙測試', icon:'📏' },
    dcpip:        { id:'dcpip',        nameTC:'DCPIP 溶液測試', icon:'💧' }
  };

  const state = {
    currentTest: 'glucoseStrip',
    selectedSample: 'water',
    temperature: 25.0,
    timeElapsed: 0,
    dropsAdded: 0,
    reagentVolume: 0,
    isHeated: false,
    testStatus: 'idle',
    stripDipped: false,
    stripDipping: false,
    heatBathRunning: false,
    heatBathDone: false,
    paperDropped: false,
    paperDried: false,
    paperDrying: false,
    solventAdded: false,
    dcpipThreshold: null,
    ioDropAnim: false,
    reagentDropAnim: false,
    greaseDropAnim: false,
    solventAnim: false,
    dcpipDropAnim: false,
    timerHandle: null
  };

  /* ============================================================
     LOGGING
  ============================================================ */

  function log(msg, type){
    type = type || 'sys';
    const term = document.getElementById('logTerminal');
    const line = document.createElement('div');
    line.className = 'log-line log-' + type + ' font-tc';
    const t = new Date();
    const stamp = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0') + ':' + String(t.getSeconds()).padStart(2,'0');
    const tagMap = { sys:'[系統]', ok:'[完成]', warn:'[警告]', err:'[結果]', dim:'[記錄]' };
    line.textContent = '[' + stamp + '] ' + (tagMap[type]||'[系統]') + ' ' + msg;
    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
  }

  function clearLog(){
    document.getElementById('logTerminal').innerHTML = '';
  }

  function statusLabelCN(s){
    return { idle:'—', progress:'進行中', positive:'陽性', negative:'陰性' }[s] || '—';
  }

  /* ============================================================
     SHARED LAB-EQUIPMENT SVG HELPERS
  ============================================================ */

  function dropperGraphic(x, y, liquidColor, animating){
    return (
      '<g transform="translate('+x+','+y+')">' +
        '<g class="dropper'+(animating?' squeeze':'')+'">' +
          '<ellipse cx="0" cy="6" rx="8" ry="11" fill="#e3766b" stroke="#a4453c" stroke-width="1.4"/>' +
          '<rect x="-3" y="15" width="6" height="30" fill="#d9dee6" stroke="#9aa7ba" stroke-width="1"/>' +
          '<rect x="-1.6" y="45" width="3.2" height="8" fill="#c7d0dc"/>' +
        '</g>' +
        (animating ? '<circle class="drop-fall" cx="0" cy="55" r="3.2" fill="'+liquidColor+'"/>' : '') +
      '</g>'
    );
  }

  function rippleGraphic(cx, cy){
    return '<circle class="ripple" cx="'+cx+'" cy="'+cy+'" r="9" fill="none" stroke="#ffffff" stroke-width="2"/>';
  }

  function rackGraphic(cx, y){
    return (
      '<rect x="'+(cx-60)+'" y="'+y+'" width="120" height="30" rx="6" fill="#a9825a" stroke="#7a5a3a" stroke-width="2"/>' +
      '<ellipse cx="'+cx+'" cy="'+y+'" rx="16" ry="6" fill="#5b4128"/>'
    );
  }

  /* ============================================================
     RENDER: LEFT PANEL - TEST TABS
  ============================================================ */

  function renderTestTabs(){
    const box = document.getElementById('testTabs');
    box.innerHTML = '';
    Object.values(TESTS).forEach(function(t){
      const div = document.createElement('div');
      div.className = 'test-tab' + (state.currentTest === t.id ? ' active' : '');
      div.innerHTML =
        '<div class="flex items-center gap-2">' +
          '<span class="text-[15px]">'+t.icon+'</span>' +
          '<p class="test-tab-title font-tc font-semibold text-[13px]" style="color:var(--text-primary);">'+t.nameTC+'</p>' +
        '</div>';
      div.addEventListener('click', function(){ switchTest(t.id); });
      box.appendChild(div);
    });
  }

  /* ============================================================
     RENDER: LEFT PANEL - SAMPLE GRID
  ============================================================ */

  function renderSampleGrid(){
    const box = document.getElementById('sampleGrid');
    box.innerHTML = '';
    Object.values(SAMPLES).forEach(function(s){
      const div = document.createElement('div');
      div.className = 'sample-chip font-tc' + (state.selectedSample === s.id ? ' active' : '');
      div.innerHTML = '<p class="leading-tight">'+s.nameTC+'</p>';
      div.addEventListener('click', function(){ switchSample(s.id); });
      box.appendChild(div);
    });
  }

  /* ============================================================
     SWITCHING
  ============================================================ */

  function switchTest(testId){
    if (state.timerHandle) { clearInterval(state.timerHandle); state.timerHandle = null; }
    state.currentTest = testId;
    resetTransientFlags();
    state.testStatus = 'idle';
    state.timeElapsed = 0;
    state.dropsAdded = 0;
    state.reagentVolume = 0;
    state.temperature = 25.0;
    renderTestTabs();
    renderBench();
    renderActionButtons();
    renderMetrics();
    renderStatusBadge();
    log('已切換至「' + TESTS[testId].nameTC + '」', 'sys');
  }

  function switchSample(sampleId){
    if (state.timerHandle) { clearInterval(state.timerHandle); state.timerHandle = null; }
    state.selectedSample = sampleId;
    resetTransientFlags();
    state.testStatus = 'idle';
    state.timeElapsed = 0;
    state.dropsAdded = 0;
    state.reagentVolume = 0;
    state.temperature = 25.0;
    renderSampleGrid();
    renderBench();
    renderActionButtons();
    renderMetrics();
    renderStatusBadge();
    log('已選取樣本：' + SAMPLES[sampleId].nameTC, 'sys');
  }

  function resetTransientFlags(){
    state.stripDipped = false;
    state.stripDipping = false;
    state.heatBathRunning = false;
    state.heatBathDone = false;
    state.paperDropped = false;
    state.paperDried = false;
    state.paperDrying = false;
    state.solventAdded = false;
    state.dcpipThreshold = null;
    state.ioDropAnim = false;
    state.reagentDropAnim = false;
    state.greaseDropAnim = false;
    state.solventAnim = false;
    state.dcpipDropAnim = false;
  }

  function resetStation(){
    if (state.timerHandle) { clearInterval(state.timerHandle); state.timerHandle = null; }
    state.currentTest = 'glucoseStrip';
    state.selectedSample = 'water';
    state.temperature = 25.0;
    state.timeElapsed = 0;
    state.dropsAdded = 0;
    state.reagentVolume = 0;
    state.isHeated = false;
    state.testStatus = 'idle';
    resetTransientFlags();
    clearLog();
    renderAll();
    log('站台已重設，等待指令。', 'sys');
  }

  /* ============================================================
     RENDER: STATUS BADGE
  ============================================================ */

  function renderStatusBadge(){
    const box = document.getElementById('statusBadgeBox');
    const map = {
      idle:     { cls:'status-idle',     label:'待命' },
      progress: { cls:'status-progress', label:'進行中' },
      positive: { cls:'status-positive', label:'陽性' },
      negative: { cls:'status-negative', label:'陰性' }
    };
    const s = map[state.testStatus];
    box.innerHTML = '<span class="status-badge ' + s.cls + ' font-tc">● ' + s.label + '</span>';

    const headerText = document.getElementById('stationStatusText');
    if (state.testStatus === 'idle') { headerText.textContent = '系統就緒'; }
    else if (state.testStatus === 'progress') { headerText.textContent = '測試進行中'; }
    else { headerText.textContent = '結果：' + (state.testStatus === 'positive' ? '陽性' : '陰性'); }
  }

  /* ============================================================
     RENDER: METRICS
  ============================================================ */

  function fmtTime(sec){
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function renderMetrics(){
    const box = document.getElementById('metricsGrid');
    const test = state.currentTest;
    const items = [];

    items.push({ label:'溫度', value: state.temperature.toFixed(1)+'°C', color:'var(--amber)' });
    items.push({ label:'經過時間', value: fmtTime(state.timeElapsed), color:'var(--text-primary)' });

    if (test === 'dcpip') {
      items.push({ label:'已滴滴數', value: state.dropsAdded, color:'var(--violet)' });
      items.push({ label:'溶液狀態', value: state.testStatus==='positive' ? '已還原' : '藍色', color:'var(--cyan)' });
    } else if (test === 'benedict') {
      items.push({ label:'試劑體積', value: state.reagentVolume.toFixed(1)+' mL', color:'var(--violet)' });
      items.push({ label:'水浴加熱', value: state.heatBathRunning ? '加熱中' : (state.heatBathDone ? '已完成' : '未開始'), color:'var(--amber)' });
    } else if (test === 'grease') {
      items.push({ label:'風乾狀態', value: state.paperDrying ? '風乾中' : (state.paperDried ? '已乾燥' : '—'), color:'var(--amber)' });
      items.push({ label:'溶劑', value: state.solventAdded ? '已加入' : '未加入', color:'var(--violet)' });
    } else if (test === 'glucoseStrip' || test === 'proteinStrip') {
      items.push({ label:'試紙狀態', value: state.stripDipped ? '已浸入' : '乾燥', color:'var(--violet)' });
      items.push({ label:'結果', value: statusLabelCN(state.testStatus), color:'var(--cyan)' });
    } else if (test === 'iodine') {
      items.push({ label:'已滴滴數', value: state.dropsAdded, color:'var(--violet)' });
      items.push({ label:'結果', value: statusLabelCN(state.testStatus), color:'var(--cyan)' });
    }

    box.innerHTML = items.map(function(it){
      return '<div class="stat-box"><p class="stat-label">'+it.label+'</p><p class="stat-value" style="color:'+it.color+';">'+it.value+'</p></div>';
    }).join('');
  }

  /* ============================================================
     BENCH RENDERING PER TEST
  ============================================================ */

  function renderBench(){
    const guide = document.getElementById('stepGuide');
    const title = document.getElementById('benchTitle');
    const subtitle = document.getElementById('benchSubtitle');
    const t = TESTS[state.currentTest];
    title.textContent = '實驗台 · ' + t.nameTC;
    subtitle.textContent = '目前樣本：' + SAMPLES[state.selectedSample].nameTC;

    const renderers = {
      glucoseStrip: renderGlucoseStripBench,
      proteinStrip: renderProteinStripBench,
      benedict: renderBenedictBench,
      iodine: renderIodineBench,
      grease: renderGreaseBench,
      dcpip: renderDcpipBench
    };
    renderers[state.currentTest]();

    const guides = {
      glucoseStrip: '步驟：選擇樣本後按「浸入試紙」，試紙會浸入置於試管架上的樣本試管中。只有含游離葡萄糖的樣本（如葡萄糖溶液、橙汁、檸檬汁）會由綠轉棕；蔗糖及乳糖（牛奶）不會令此試紙變色。',
      proteinStrip: '步驟：選擇樣本後按「浸入試紙」。若樣本含蛋白質（蛋白溶液、牛奶），試紙將由黃色轉為藍綠色；其他樣本保持黃色。',
      benedict: '步驟：按「加入本立德試劑」，藍色試劑會滴入以支架固定的試管中；再按「開始水浴加熱」，試管會置於以三腳架、耐火網及本生燈加熱的水浴中（模擬5分鐘）。含還原糖的樣本會出現磚紅色沉澱；蔗糖屬非還原糖，加熱後仍保持藍色。',
      iodine: '步驟：按「滴加碘液」，觀察碘液滴在白色點滴板上的樣本後顏色的變化。若樣本含澱粉，會立即轉為藍黑色；否則呈樣本原色混合碘液的淡棕色調。',
      grease: '步驟：按「滴在濾紙上」，再按「開始風乾」（模擬5分鐘，可見氣流線）。風乾後對著光源檢查是否出現半透明油漬點，再按「加入有機溶劑」，以洗瓶沖洗觀察油漬點會否溶解消失。',
      dcpip: '步驟：按「加一滴」，將樣本逐滴加入試管架上盛有藍色DCPIP溶液的試管，並輕輕搖動混合。新鮮維他命C溶液只需最少滴數即可完全使其褪色，褪色後溶液會呈樣本本身的顏色；橙汁次之，檸檬汁再次之；已加熱破壞的維他命C樣本需要非常多滴數；其他樣本則難以完全使其褪色。'
    };
    guide.textContent = guides[state.currentTest];
  }

  function benchWrap(inner){
    return '<div class="w-full flex items-center justify-center fade-in">' + inner + '</div>';
  }

  // --- 尿糖 / 尿蛋白試紙測試：試紙浸入置於試管架上的樣本試管 ---

  // --- 本立德試驗：支架固定試管，置於三腳架、耐火網及本生燈加熱的水浴中 ---
  function renderBenedictBench(){
    const sample = SAMPLES[state.selectedSample];

            '<line x1="130" y1="205" x2="95" y2="270" stroke="#8a9ab0" stroke-width="3"/>' +
            '<line x1="130" y1="205" x2="165" y2="270" stroke="#8a9ab0" stroke-width="3"/>' +
            '<line x1="130" y1="205" x2="130" y2="272" stroke="#8a9ab0" stroke-width="3"/>' +
            '<rect x="92" y="199" width="76" height="5" fill="none" stroke="#a9b4c4" stroke-width="1"/>' +
            flame +
            '<rect x="122" y="215" width="16" height="35" fill="#8a97a8"/>' +

            '<rect x="108" y="256" width="44" height="10" rx="2" fill="#3d4a5c"/>' +

  // --- 碘液試驗：白色點滴板 ---
  function renderIodineBench(){

  // --- 油漬試驗：滴管滴樣本 → 風乾（氣流線）→ 對光檢查 → 洗瓶沖洗 ---
  function renderGreaseBench(){
    const sample = SAMPLES[state.selectedSample];
    const positive = sample.oil;
    let spotOpacity = 0;
    let label = '濾紙：乾淨';
    const animating = state.greaseDropAnim;
    let showLightCheck = false;

    if (state.paperDropped && !state.paperDried && !state.paperDrying) {
      label = '樣本已滴下，等待風乾';
      spotOpacity = positive ? 0.18 : 0.06;
    } else if (state.paperDrying) {
      label = '風乾中…';
      spotOpacity = positive ? 0.32 : 0.08;
    } else if (state.paperDried && !state.solventAdded) {
      label = positive ? '陽性：對著光源可見半透明油漬點' : '陰性：對著光源沒有明顯油漬點';
      spotOpacity = positive ? 0.55 : 0.05;
      showLightCheck = true;
    } else if (state.solventAdded) {
      label = positive ? '陽性確認：以有機溶劑沖洗後油漬點溶解消失' : '陰性：本來就沒有油漬點';
      spotOpacity = 0;
    }

    const airLines = state.paperDrying ? [0,1,2].map(function(i){
      const y = 50 + i*36;
      const delay = (i*0.2).toFixed(2);
      return '<line class="air-line" x1="6" y1="'+y+'" x2="22" y2="'+y+'" stroke="#8a9ab0" stroke-width="2" style="animation-delay:'+delay+'s;"/>';
    }).join('') : '';

    const dropperPart = animating ? dropperGraphic(120,0,sample.color,true) : '';
    const ripplePart = animating ? rippleGraphic(120,110) : '';
    const wetDrop = (state.paperDropped && !state.paperDrying && !state.paperDried && !animating)
      ? '<circle cx="120" cy="120" r="9" fill="'+sample.color+'" opacity="0.85"/>' : '';

    const lightCheck = showLightCheck ?
      '<g>' +
        '<circle cx="225" cy="120" r="16" fill="#ffe9a8" class="light-glow"/>' +
        '<line x1="209" y1="120" x2="168" y2="120" stroke="#ffd76b" stroke-width="2" class="light-glow"/>' +
        '<line x1="213" y1="105" x2="172" y2="95" stroke="#ffd76b" stroke-width="2" class="light-glow"/>' +
        '<line x1="213" y1="135" x2="172" y2="145" stroke="#ffd76b" stroke-width="2" class="light-glow"/>' +
      '</g>' : '';

    const solventBottle = (state.solventAdded && state.solventAnim)
      ? '<g class="pour-tilt" transform="translate(190,6)">' +
          '<path d="M0 30 L0 8 Q0 0 8 0 L18 0 Q22 0 22 6 L22 14 L34 24 L34 34 L18 34 L18 60 L0 60 Z" fill="#bcd8f5" stroke="#8fb8e6" stroke-width="1.5"/>' +
          '<rect x="18" y="0" width="4" height="14" fill="#8fb8e6"/>' +
        '</g>' : '';

    document.getElementById('benchArea').innerHTML = benchWrap(
      '<div class="flex flex-col items-center gap-4">' +
        '<svg width="260" height="250" viewBox="0 0 260 250">' +
          dropperPart +
          '<rect x="40" y="20" width="160" height="190" rx="4" fill="#fdfdfb" stroke="#d4dbe6" stroke-width="2"/>' +
          '<circle cx="120" cy="120" r="45" fill="#e8dcc0" opacity="'+spotOpacity+'" class="liquid-transition"/>' +
          wetDrop +
          ripplePart +
          airLines +
          lightCheck +
          solventBottle +
        '</svg>' +
        '<div class="stat-box text-center px-4">' +
          '<p class="stat-label">濾紙讀數</p>' +
          '<p class="font-tc text-[13px] font-semibold mt-1" style="color:var(--text-primary);">'+label+'</p>' +
        '</div>' +
        (state.paperDrying ? '<div class="w-56"><div class="progress-track"><div class="progress-fill" id="greaseProgress"></div></div></div>' : '') +
      '</div>'
    );
  }

  // --- DCPIP 溶液測試：試管架上的試管，逐滴加入樣本並搖動混合 ---
  function renderDcpipBench(){
    const sample = SAMPLES[state.selectedSample];
    let threshold = null;
    if (sample.vitaminC === 'fresh') threshold = 4;
    else if (sample.vitaminC === 'dilute1') threshold = 9;
    else if (sample.vitaminC === 'dilute2') threshold = 14;
    else if (sample.vitaminC === 'heated') threshold = 18;
    state.dcpipThreshold = threshold;

    const maxDrops = 20;
    let fadeRatio;
    if (threshold === null) {
      fadeRatio = Math.min(state.dropsAdded / (maxDrops*2), 0.35);
    } else {
      fadeRatio = Math.min(state.dropsAdded / threshold, 1);
    }
    // DCPIP 藍色逐漸被還原，最終顏色會混入樣本本身的顏色，而非必然無色
    const liquidColor = blendColor('#1e3c82', sample.color, fadeRatio);

    let label = '深藍色 DCPIP 溶液';
    if (fadeRatio >= 0.999 && threshold !== null) {
      label = '陽性：DCPIP完全被還原，溶液呈'+sample.nameTC+'本身的顏色（共 '+state.dropsAdded+' 滴）';
    } else if (state.dropsAdded >= maxDrops && threshold === null) {
      label = '陰性：即使滴加 '+maxDrops+' 滴仍未完全褪色';
    } else if (state.dropsAdded > 0) {
      label = '褪色中…（已滴加 '+state.dropsAdded+' 滴，並輕輕搖動混合）';
    }

    document.getElementById('benchArea').innerHTML = benchWrap(
      '<div class="flex flex-col items-center gap-4">' +
        '<svg width="220" height="280" viewBox="0 0 220 280">' +
          dropperGraphic(110,0,sample.color, state.dcpipDropAnim) +
          rackGraphic(110,210) +
          '<g class="'+(state.dcpipDropAnim?'swirl':'')+'">' +
            '<rect x="75" y="60" width="70" height="150" rx="8" fill="#fafcff" stroke="#d4dbe6" stroke-width="2"/>' +
            '<rect x="81" y="120" width="58" height="86" rx="4" class="liquid-transition" fill="'+liquidColor+'"/>' +
          '</g>' +
          (state.dcpipDropAnim ? rippleGraphic(110,120) : '') +
        '</svg>' +
        '<div class="stat-box text-center px-4">' +
          '<p class="stat-label">溶液讀數</p>' +
          '<p class="font-tc text-[13px] font-semibold mt-1" style="color:var(--text-primary);">'+label+'</p>' +
        '</div>' +
      '</div>'
    );
  }

  /* ============================================================
     ACTION BUTTONS PER TEST
  ============================================================ */

  function renderActionButtons(){
    const box = document.getElementById('actionButtons');
    box.innerHTML = '';
    const test = state.currentTest;

    function addBtn(label, cls, handler, disabled){
      const b = document.createElement('button');
      b.className = 'btn ' + (cls||'') + ' font-tc text-[13px]';
      b.textContent = label;
      b.disabled = !!disabled;
      b.addEventListener('click', handler);
      box.appendChild(b);
      return b;
    }

    if (test === 'glucoseStrip' || test === 'proteinStrip') {
      addBtn('浸入試紙', 'btn-primary', function(){ dipStrip(test); }, state.stripDipped);
    } else if (test === 'benedict') {
      addBtn('加入本立德試劑', 'btn-primary', function(){ addBenedictReagent(); }, state.reagentVolume > 0);
      addBtn('開始水浴加熱', 'btn-amber', function(){ startHeatBath(); }, state.reagentVolume <= 0 || state.heatBathRunning || state.heatBathDone);
    } else if (test === 'iodine') {
      addBtn('滴加碘液', 'btn-primary', function(){ addIodineDrop(); }, state.dropsAdded > 0);
    } else if (test === 'grease') {
      addBtn('滴在濾紙上', 'btn-primary', function(){ dropOnPaper(); }, state.paperDropped);
      addBtn('開始風乾', 'btn-amber', function(){ startDrying(); }, !state.paperDropped || state.paperDrying || state.paperDried);
      addBtn('加入有機溶劑', 'btn-violet', function(){ addSolvent(); }, !state.paperDried || state.solventAdded);
    } else if (test === 'dcpip') {
      addBtn('加一滴', 'btn-violet', function(){ addDcpipDrop(); }, state.testStatus === 'positive');
    }
  }

  /* ============================================================
     ACTIONS: STRIP TESTS
  ============================================================ */

  function dipStrip(test){
    state.stripDipped = true;
    state.stripDipping = true;
    state.testStatus = 'progress';
    log((test==='glucoseStrip'?'尿糖':'尿蛋白') + '試紙正浸入試管架上的樣本試管中…', 'sys');
    renderBench();
    renderActionButtons();
    renderMetrics();
    renderStatusBadge();
    setTimeout(function(){
      state.stripDipping = false;
      const sample = SAMPLES[state.selectedSample];
      const positive = test === 'glucoseStrip' ? sample.glucose : sample.protein;
      state.testStatus = positive ? 'positive' : 'negative';
      log('試紙顏色反應完成：' + (positive ? '陽性' : '陰性'), positive ? 'ok' : 'dim');
      renderBench();
      renderMetrics();
      renderStatusBadge();
    }, 900);
  }

  /* ============================================================
     ACTIONS: BENEDICT'S TEST
  ============================================================ */

  function addBenedictReagent(){
    state.reagentVolume = 2.0;
    state.reagentDropAnim = true;
    log('已加入本立德試劑 2.0 mL（藍色試劑等量混合樣本）。', 'sys');
    renderBench();
    renderActionButtons();
    renderMetrics();
    setTimeout(function(){
      state.reagentDropAnim = false;
      renderBench();
    }, 600);
  }

  function startHeatBath(){
    state.heatBathRunning = true;
    state.testStatus = 'progress';
    state.temperature = 25;
    log('開始水浴加熱（模擬5分鐘）…', 'warn');
    renderBench();
    renderActionButtons();
    renderStatusBadge();

    const totalSimSeconds = 300;
    const realDurationMs = 5000;
    const stepMs = 100;
    const steps = realDurationMs / stepMs;
    let step = 0;

    state.timerHandle = setInterval(function(){
      step++;
      state.timeElapsed = Math.min(totalSimSeconds, (step/steps) * totalSimSeconds);
      state.temperature = Math.min(95, 25 + (step/steps) * 70);
      const fillEl = document.getElementById('benedictProgress');
      if (fillEl) fillEl.style.width = Math.min(100, (step/steps)*100) + '%';
      renderMetrics();

      if (step >= steps) {
        clearInterval(state.timerHandle);
        state.timerHandle = null;
        state.heatBathRunning = false;
        state.heatBathDone = true;
        const sample = SAMPLES[state.selectedSample];
        const positive = sample.reducingSugar;
        state.testStatus = positive ? 'positive' : 'negative';
        log('水浴加熱完成。' + (positive ? '溶液出現磚紅色沉澱物：陽性' : '溶液保持藍色：陰性'), positive ? 'ok' : 'dim');
        renderBench();
        renderActionButtons();
        renderMetrics();
        renderStatusBadge();
      }
    }, stepMs);
  }

  /* ============================================================
     ACTIONS: IODINE TEST
  ============================================================ */

  function addIodineDrop(){
    state.dropsAdded = 1;
    state.testStatus = 'progress';
    state.ioDropAnim = true;
    log('正在滴加碘液…', 'sys');
    renderBench();
    renderActionButtons();
    renderMetrics();
    renderStatusBadge();
    setTimeout(function(){
      state.ioDropAnim = false;
      const sample = SAMPLES[state.selectedSample];
      const positive = sample.starch;
      state.testStatus = positive ? 'positive' : 'negative';
      log('已滴加1滴碘液。' + (positive ? '顏色即時轉為藍黑色：陽性' : '顏色保持樣本原色混合碘液的棕色調：陰性'), positive ? 'ok' : 'dim');
      renderBench();
      renderMetrics();
      renderStatusBadge();
    }, 550);
  }

  /* ============================================================
     ACTIONS: GREASE SPOT TEST
  ============================================================ */

  function dropOnPaper(){
    state.paperDropped = true;
    state.testStatus = 'progress';
    state.greaseDropAnim = true;
    log('正在將樣本滴在濾紙上…', 'sys');
    renderBench();
    renderActionButtons();
    renderStatusBadge();
    setTimeout(function(){
      state.greaseDropAnim = false;
      log('樣本已滴在濾紙上。', 'sys');
      renderBench();
    }, 550);
  }

  function startDrying(){
    state.paperDrying = true;
    log('開始風乾（模擬5分鐘）…', 'warn');
    renderBench();
    renderActionButtons();

    const totalSimSeconds = 300;
    const realDurationMs = 4000;
    const stepMs = 100;
    const steps = realDurationMs / stepMs;
    let step = 0;

    state.timerHandle = setInterval(function(){
      step++;
      state.timeElapsed = Math.min(totalSimSeconds, (step/steps) * totalSimSeconds);
      const fillEl = document.getElementById('greaseProgress');
      if (fillEl) fillEl.style.width = Math.min(100, (step/steps)*100) + '%';
      renderMetrics();

      if (step >= steps) {
        clearInterval(state.timerHandle);
        state.timerHandle = null;
        state.paperDrying = false;
        state.paperDried = true;
        const sample = SAMPLES[state.selectedSample];
        const positive = sample.oil;
        log('風乾完成。' + (positive ? '對著光源可見濾紙上有半透明油漬點。' : '對著光源濾紙上沒有明顯油漬點。'), positive ? 'ok' : 'dim');
        renderBench();
        renderActionButtons();
        renderMetrics();
      }
    }, stepMs);
  }

  function addSolvent(){
    state.solventAdded = true;
    state.solventAnim = true;
    log('正在以洗瓶傾倒有機溶劑沖洗濾紙…', 'sys');
    renderBench();
    renderActionButtons();
    setTimeout(function(){
      state.solventAnim = false;
      const sample = SAMPLES[state.selectedSample];
      const positive = sample.oil;
      state.testStatus = positive ? 'positive' : 'negative';
      log('已加入有機溶劑。' + (positive ? '油漬點完全溶解消失：確認陽性' : '沒有油漬點可被溶解：陰性'), positive ? 'ok' : 'dim');
      renderBench();
      renderActionButtons();
      renderMetrics();
      renderStatusBadge();
    }, 700);
  }

  /* ============================================================
     ACTIONS: DCPIP TEST
  ============================================================ */

  function addDcpipDrop(){
    state.dropsAdded += 1;
    state.testStatus = 'progress';
    state.dcpipDropAnim = true;
    const threshold = state.dcpipThreshold;
    const maxDrops = 20;
    const sample = SAMPLES[state.selectedSample];

    if (threshold !== null && state.dropsAdded >= threshold) {
      state.testStatus = 'positive';
      log('已加入第 ' + state.dropsAdded + ' 滴。DCPIP溶液完全被還原，溶液呈' + sample.nameTC + '本身的顏色：陽性（樣本含維他命C）。', 'ok');
    } else if (threshold === null && state.dropsAdded >= maxDrops) {
      state.testStatus = 'negative';
      log('已加入第 ' + state.dropsAdded + ' 滴，DCPIP溶液仍未完全褪色：陰性（樣本不含足夠維他命C）。', 'dim');
    } else {
      log('已加入第 ' + state.dropsAdded + ' 滴樣本，並搖動混合…', 'sys');
    }
    renderBench();
    renderActionButtons();
    renderMetrics();
    renderStatusBadge();
    setTimeout(function(){
      state.dcpipDropAnim = false;
      renderBench();
    }, 500);
  }

  /* ============================================================
     INITIALISATION
  ============================================================ */

  function renderAll(){
    renderTestTabs();
    renderSampleGrid();
    renderBench();
    renderActionButtons();
    renderMetrics();
    renderStatusBadge();
  }

  document.getElementById('resetBtn').addEventListener('click', resetStation);

  renderAll();
  log('食物測試實驗模擬器已啟動，請選擇測試項目及樣本。', 'sys');

})();
</script>
</body>
</html>
